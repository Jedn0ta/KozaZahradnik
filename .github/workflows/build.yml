name: APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner má Android SDK i Gradle předinstalované.
      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Sestavit debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Pojmenovat podle commitu
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/koza-zahradnik.apk

      - name: Uložit jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: koza-zahradnik-debug-apk
          path: out/koza-zahradnik.apk
          if-no-files-found: error

      # Release má stálý odkaz a stahuje se bez přihlášení,
      # takže jde otevřít rovnou v telefonu.
      - name: Vydat jako poslední verzi
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete posledni --yes --cleanup-tag 2>/dev/null || true
          gh release create posledni out/koza-zahradnik.apk \
            --title "Koza Zahradník — poslední build" \
            --notes "Sestaveno z $(git rev-parse --short HEAD) dne $(date +%d.%m.%Y\ %H:%M). Debug build, Android vyžádá povolení instalace z neznámého zdroje."
