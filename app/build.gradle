plugins { id 'com.android.application' }

android {
    namespace 'cz.kozazahradnik.app'
    compileSdk 34

    // Runner si jinak pokazde vyrobi novy ladici klic a Android pak odmitne
    // nainstalovat novou verzi pres starou. Klic proto drzime v repozitari.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "cz.kozazahradnik.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Servíruje assety přes https origin, aby fungovalo localStorage
    implementation 'androidx.webkit:webkit:1.11.0'
}
