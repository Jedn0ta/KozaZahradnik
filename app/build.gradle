plugins { id 'com.android.application' }

android {
    namespace 'cz.kozazahradnik.app'
    compileSdk 34

    defaultConfig {
        applicationId "cz.kozazahradnik.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Servíruje assety přes https origin, aby fungovalo localStorage
    implementation 'androidx.webkit:webkit:1.11.0'
}
