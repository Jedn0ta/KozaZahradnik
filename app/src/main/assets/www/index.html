/* Nástroje jsou vlevo, přiblížení vpravo, kartička dole. Spodek plánu
   si drží volno jen podle toho, co je právě vysunuté. */
function posadPanel() {
  const sh = el('msheet'), zo = el('m-zoom'), sc = el('m-scale'), ra = el('mrail');
  let hs = 0;
  if (sh) { sh.style.bottom = '0px'; hs = sh.offsetHeight || 0; }
  if (zo) zo.style.bottom = (hs + 14) + 'px';
  if (sc) sc.style.bottom = (hs + 18) + 'px';
  if (ra) {
    const cv = el('cv');
    const misto = (cv ? cv.clientHeight : 400) - hs;
    const vys = ra.offsetHeight || 0;
    ra.style.top = Math.max(14, Math.round((misto - vys) / 2)) + 'px';
  }
}

/* --- prepocty mezi metry a pixely --- */
function cvRect() { const c = el('cv'); return c ? c.getBoundingClientRect() : { width:0, height:0, left:0, top:0 }; }
function w2s(x, y) { return [ (x - view.ox) * view.scale, (y - view.oy) * view.scale ]; }
function s2w(px, py) { return [ px / view.scale + view.ox, py / view.scale + view.oy ]; }
function snapW(x, y) { return [ Math.round(x/snapStep)*snapStep, Math.round(y/snapStep)*snapStep ]; }
function cellAt(px, py) { const w = s2w(px, py); return ck(Math.floor(w[0]), Math.floor(w[1])); }

function panelVyska() {
  const sh = el('msheet');
  return sh ? sh.offsetHeight : 0;
}
function fitView() {
  let pts = [];
  if (state.outline.length >= 2) {
    pts = state.outline.slice();
    (state.vedlejsi || []).forEach(v => { if (v.length >= 2) pts = pts.concat(v); });
  } else {
    pts = items().flatMap(i => { const b = itBBox(i); return [[b.x0,b.y0],[b.x1,b.y1]]; });
  }
  const r = cvRect();
  if (!pts.length) { kresliPlatno(); return; }
  // plátno ještě nemá rozměry (právě se překreslilo) - zkusíme to v dalším snímku
  if (!r.width || !r.height) {
    kresliPlatno();
    if (!fitView._znovu) {
      fitView._znovu = true;
      requestAnimationFrame(() => { fitView._znovu = false; fitView(); });
    }
    return;
  }
  const b = bbox(pts);
  // mapu zakryva nahore pilulka s adresou a dole vysouvaci panel,
  // zahrada se musi vejit mezi ne
  const shora = (el('otevri-adresu') || el('p-zavri') || el('m-hotovo')) ? 80 : 14;
  const zdola = panelVyska();
  const uzitna = Math.max(120, r.height - zdola - shora);
  // vlevo svislá lišta nástrojů, vpravo přiblížení
  const mr = el('mrail');
  const zleva = (mr && !mr.classList.contains('pryc')) ? 72 : 12, zprava = 72;
  const siroka = Math.max(140, r.width - zleva - zprava);
  const pad = 3;
  const w = Math.max(b.x1-b.x0, 4) + pad*2, h = Math.max(b.y1-b.y0, 4) + pad*2;
  view.scale = clamp(Math.min(siroka/w, uzitna/h), 1.2, 60);
  view.ox = (b.x0+b.x1)/2 - (zleva + siroka/2)/view.scale;
  view.oy = (b.y0+b.y1)/2 - (shora + uzitna/2)/view.scale;
  save(); kresliPlatno();
}
function centerOn(it) {
  const b = itBBox(it), r = cvRect();
  if (!r.width) return;
  const pad = 6;
  const w = b.w + pad*2, hh = b.h + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/hh), 1.2, 30);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); kresliPlatno();
}
function zoomAt(f, px, py) {
  const w = s2w(px, py);
  view.scale = clamp(view.scale * f, 1.2, 60);
  view.ox = w[0] - px/view.scale;
  view.oy = w[1] - py/view.scale;
  save(); kresliPlatno();
}

/* --- uchyty pro roztahovani --- */
function handlesOf(it) {
  const b = itBBox(it);
  return [
    { side:'N', p: w2s((b.x0+b.x1)/2, b.y0), ax:'v' },
    { side:'S', p: w2s((b.x0+b.x1)/2, b.y1), ax:'v' },
    { side:'W', p: w2s(b.x0, (b.y0+b.y1)/2), ax:'h' },
    { side:'E', p: w2s(b.x1, (b.y0+b.y1)/2), ax:'h' },
  ];
}

/* --- kresleni --- */
let preview = null;
let rafId = null;
function scheduleRender() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = null; kresliPlatno(); }); }

function kresliPlatno() {
  const cv = el('cv'), svg = el('svg');
  if (!cv || !svg) return;
  const W = cv.clientWidth, H = cv.clientHeight;

  snapStep = 1;
  const dotStep = view.scale >= 9 ? 1 : (view.scale >= 3.5 ? 5 : 10);
  const tile = dotStep * view.scale, tile5 = dotStep * 5 * view.scale;
  const px = -view.ox * view.scale, py = -view.oy * view.scale;
  cv.style.backgroundImage =
    'radial-gradient(circle, var(--dot) 1.1px, transparent 1.7px),' +
    'linear-gradient(to right, var(--grid) 1px, transparent 1px),' +
    'linear-gradient(to bottom, var(--grid) 1px, transparent 1px)';
  cv.style.backgroundSize = `${tile}px ${tile}px, ${tile5}px ${tile5}px, ${tile5}px ${tile5}px`;
  cv.style.backgroundPosition = `${px - tile/2}px ${py - tile/2}px, ${px}px ${py}px, ${px}px ${py}px`;

  const sb = el('sc-b'), sbl = el('sc-t');
  if (sb) {
    let mm = 5;
    for (const cand of [1,2,5,10,20,50,100]) { mm = cand; if (cand*view.scale >= 46) break; }
    sb.style.width = (mm*view.scale) + 'px';
    sbl.textContent = mm + ' m';
  }

  const parts = [];
  // dalsi vybrane parcely pod hlavnim obrysem
  (state.vedlejsi || []).forEach(poly => {
    if (poly.length < 3) return;
    const ps = poly.map(q => w2s(q[0],q[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    parts.push(`<polygon points="${ps}" fill="#e4f0da" fill-opacity="0.8" stroke="#79a35e" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round"/>`);
  });
  // obrys parcely
  if (state.outline.length >= 2) {
    const pstr = state.outline.map(p => w2s(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    if (state.outlineDone && state.outline.length >= 3) {
      parts.push(`<polygon points="${pstr}" fill="#dceccf" fill-opacity="0.95" stroke="#79a35e" stroke-width="7" stroke-opacity=".28" stroke-linejoin="round"/>`);
      parts.push(`<polygon points="${pstr}" fill="none" stroke="#4f8c3f" stroke-width="2.6" stroke-linejoin="round"/>`);
    } else {
      parts.push(`<polyline points="${pstr}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>`);
    }
  }
  // prvky ze ctverecku
  const zo = { paved:0, house:1, bed:2, raised:3, trough:4, pot:5 };
  const sorted = items().slice().sort((a,b) => (zo[a.typ]||0) - (zo[b.typ]||0));
  const s = view.scale, ov = 0.6;
  sorted.forEach(it => {
    const d = PRVKY[it.typ] || PRVKY.bed;
    const c = crop(it.cropId);
    const out = !itemInside(it);
    let b = itBBox(it);
    // malé prvky mají vlastní rozměr v metrech, klidně pod jeden metr
    if (PRVKY[it.typ].maly && it.rozmer) {
      b = { x0:b.x0, y0:b.y0, x1:b.x0 + it.rozmer.w, y1:b.y0 + it.rozmer.h,
            w:it.rozmer.w, h:it.rozmer.h };
    }
    const sp0 = w2s(b.x0, b.y0), bw = b.w*s, bh = b.h*s;
    const r = Math.min(7, Math.max(2, Math.min(bw,bh)*0.22));

    /* Obdelnikove prvky kreslime jako jeden zakulaceny tvar — plan tak
       vypada jako zahrada, ne jako milimetrovy papir. Nepravidelne
       tvary zustavaji po ctverecich. */
    const jednoduchy = isRect(it) || !!(PRVKY[it.typ].maly && it.rozmer);
    const telo = (vypln, opacita, posunX, posunY, uzsi) => {
      if (jednoduchy) {
        return `<rect x="${(sp0[0]+(posunX||0)).toFixed(1)}" y="${(sp0[1]+(posunY||0)).toFixed(1)}" width="${Math.max(1,bw-(uzsi||0)*2).toFixed(1)}" height="${Math.max(1,bh-(uzsi||0)*2).toFixed(1)}" rx="${r.toFixed(1)}" fill="${vypln}" fill-opacity="${opacita}"/>`;
      }
      let fp = '';
      cellsOf(it).forEach(k => {
        const cc = cxy(k), sp = w2s(cc[0], cc[1]);
        fp += `M${sp[0].toFixed(1)} ${sp[1].toFixed(1)}h${(s+ov).toFixed(1)}v${(s+ov).toFixed(1)}h${(-(s+ov)).toFixed(1)}Z`;
      });
      return `<path d="${fp}" fill="${vypln}" fill-opacity="${opacita}"/>`;
    };

    // měkký stín, aby prvky na papíře ležely a neplavaly
    if (jednoduchy && s > 4) parts.push(`<rect x="${(sp0[0]+1.5).toFixed(1)}" y="${(sp0[1]+2.5).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${r.toFixed(1)}" fill="rgba(31,45,28,.13)"/>`);

    parts.push(telo(d.fill, 1));
    // hlína v záhonu: jemné řádky, ne šachovnice
    if (roste(it) && s >= 7 && jednoduchy) {
      let rad = '';
      for (let y = b.y0 + 0.5; y < b.y1; y += 0.5) {
        const a2 = w2s(b.x0 + 0.25, y), b3 = w2s(b.x1 - 0.25, y);
        rad += `M${a2[0].toFixed(1)} ${a2[1].toFixed(1)}L${b3[0].toFixed(1)} ${b3[1].toFixed(1)}`;
      }
      parts.push(`<path d="${rad}" stroke="rgba(0,0,0,.08)" stroke-width="1" fill="none"/>`);
    }
    // osázený záhon má zelený nádech
    if (roste(it) && c) parts.push(telo('#3f8c3f', 0.3));
    // dřevěný rám u vyvýšeného záhonu a truhlíku
    if ((it.typ === 'raised' || it.typ === 'trough') && jednoduchy && Math.min(bw,bh) > 16) {
      parts.push(`<rect x="${(sp0[0]+3).toFixed(1)}" y="${(sp0[1]+3).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${(bh-6).toFixed(1)}" rx="${Math.max(1,r-2).toFixed(1)}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.6"/>`);
    }
    // obrys
    if (jednoduchy) {
      parts.push(`<rect x="${sp0[0].toFixed(1)}" y="${sp0[1].toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${r.toFixed(1)}" fill="none" stroke="${out?'var(--danger)':d.line}" stroke-width="${out?2.6:2}" ${out?'stroke-dasharray="6 4"':''}/>`);
    } else {
      let ep = '';
      edgeSegments(it).forEach(g => {
        const a = w2s(g[0], g[1]), b2 = w2s(g[2], g[3]);
        ep += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}`;
      });
      parts.push(`<path d="${ep}" fill="none" stroke="${out?'var(--danger)':d.line}" stroke-width="${out?2.6:2}" stroke-linejoin="round" stroke-linecap="round" ${out?'stroke-dasharray="6 4"':''}/>`);
    }

    /* Obrázek a jméno vedle sebe, bez podkladu. Cesty a zpevněné plochy
       žádnou ikonu nedostanou, jen popisek. */
    const zn = (it.typ === 'paved') ? null : (c ? plodinaZnak(c) : { typ:'emoji', v: d.emoji });
    const txt = c ? c.nazev : it.nazev;
    const fs = Math.min(13, Math.max(9, bh * 0.36));
    const velI = Math.min(bh * 0.62, bw * 0.5, 30);
    const siroky = bw > 54 && bh > 13;
    const maIkonu = !!(zn && zn.v) && velI >= 12 && bh > 16;
    const sirkaTxt = siroky ? txt.length * fs * 0.53 : 0;
    const mezera = (maIkonu && siroky) ? 5 : 0;
    const cel = (maIkonu ? velI : 0) + mezera + sirkaTxt;
    let bx = sp0[0] + bw/2 - cel/2;
    const by = sp0[1] + bh/2;
    const svetly = roste(it);
    const barva = svetly ? '#ffffff' : 'var(--ink)';
    const halo = svetly ? 'rgba(40,26,14,.42)' : 'rgba(255,255,255,.7)';

    if (maIkonu) {
      const cx = bx + velI/2, cy = by;
      if (zn.typ === 'foto') {
        const cid = 'cl' + it.id, rr = velI/2;
        parts.push(`<clipPath id="${cid}"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}"/></clipPath>`);
        parts.push(`<image href="${zn.v}" x="${(cx-rr).toFixed(1)}" y="${(cy-rr).toFixed(1)}" width="${(rr*2).toFixed(1)}" height="${(rr*2).toFixed(1)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`);
      } else if (zn.typ === 'msym') {
        parts.push(`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${velI.toFixed(1)}" font-family="${SADY[zn.sada].font}" fill="${barva}" style="paint-order:stroke" stroke="${halo}" stroke-width="2.6">${esc(zn.v)}</text>`);
      } else {
        parts.push(`<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${velI.toFixed(1)}">${zn.v}</text>`);
      }
      bx += velI + mezera;
    }
    if (siroky && sirkaTxt > 0) {
      parts.push(`<text x="${bx.toFixed(1)}" y="${by.toFixed(1)}" dominant-baseline="central" font-size="${fs.toFixed(1)}" font-weight="700" fill="${barva}" style="paint-order:stroke" stroke="${halo}" stroke-width="2.8">${esc(txt)}</text>`);
    }

    // stavove odznaky v rohu: co tenhle zahon prave potrebuje
    if (roste(it) && bw > 30 && bh > 17) {
      const sv = stavy(it).filter(x => x !== 'prazdny').slice(0, bw > 110 ? 3 : (bw > 72 ? 2 : 1));
      const r2 = Math.min(9, Math.max(5.5, Math.min(bw, bh) * 0.2));
      sv.forEach((sx, i) => {
        const cx = sp0[0] + bw - 3 - r2 - i * (r2*2 + 2.5), cy = sp0[1] + 3 + r2;
        parts.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r2.toFixed(1)}" fill="${STAV_BARVY[sx].bg}" stroke="#fffdf6" stroke-width="1.8"/>`);
        parts.push(`<g color="#ffffff">` + artInto(STAV_BARVY[sx].ik, cx - r2*0.62, cy - r2*0.62, r2*1.24) + `</g>`);
      });
    } else if (it.zamek && bw > 26 && bh > 26) {
      parts.push(`<g color="var(--ink2)">` + artInto('zamek', sp0[0] + bw - 20, sp0[1] + 4, 16) + `</g>`);
    }
  });
  // vybrany prvek: ramec a uchyty
  const sel = state.sel ? state.items[state.sel] : null;
  if (sel && state.tool === 'pan') {
    const b = itBBox(sel), sp = w2s(b.x0, b.y0);
    parts.push(`<rect x="${(sp[0]-3).toFixed(1)}" y="${(sp[1]-3).toFixed(1)}" width="${(b.w*s+6).toFixed(1)}" height="${(b.h*s+6).toFixed(1)}" fill="none" stroke="var(--acc-dark)" stroke-width="2" stroke-dasharray="6 4" rx="4"/>`);
    if (!sel.zamek && !state.zamek) handlesOf(sel).forEach(h => {
      parts.push(`<circle cx="${h.p[0].toFixed(1)}" cy="${h.p[1].toFixed(1)}" r="9.5" fill="var(--card)" stroke="var(--acc-dark)" stroke-width="2.5"/>`);
      const l = 4;
      parts.push(h.ax === 'h'
        ? `<path d="M${(h.p[0]).toFixed(1)} ${(h.p[1]-l).toFixed(1)}v${l*2}" stroke="var(--acc-dark)" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M${(h.p[0]-l).toFixed(1)} ${(h.p[1]).toFixed(1)}h${l*2}" stroke="var(--acc-dark)" stroke-width="2.5" stroke-linecap="round"/>`);
    });
  }
  // vrcholy obrysu
  if (state.tool === 'outline') {
    const n = state.outline.length;
    if (n >= 2) {
      const lim = (state.outlineDone && n >= 3) ? n : n-1;
      for (let i = 0; i < lim; i++) {
        const a = state.outline[i], b = state.outline[(i+1) % n];
        const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
        if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
        const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
        parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="var(--paper)" fill-opacity="0.9" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="3 2.5" data-mid="${i}"/>`);
      }
    }
    state.outline.forEach((p, i) => {
      const sp = w2s(p[0], p[1]);
      const on = state.selVert === i;
      parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="${on?8:6.5}" fill="${on?'var(--acc)':'var(--card)'}" stroke="var(--acc-dark)" stroke-width="2.5"/>`);
      if (i === 0 && !state.outlineDone && state.outline.length >= 3) {
        parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="12" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="3 3"/>`);
      }
    });
  }
  // nahled tazeneho bloku
  if (preview && preview.w > 0 && preview.h > 0) {
    const d = PRVKY[preview.prvek] || PRVKY.bed;
    const sp = w2s(preview.x, preview.y);
    parts.push(`<rect x="${sp[0].toFixed(1)}" y="${sp[1].toFixed(1)}" width="${(preview.w*s).toFixed(1)}" height="${(preview.h*s).toFixed(1)}" fill="${d.fill}" fill-opacity="0.55" stroke="${d.line}" stroke-width="2" stroke-dasharray="6 4"/>`);
    parts.push(`<text x="${(sp[0] + preview.w*s/2).toFixed(1)}" y="${(sp[1] - 7).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--ink)">${preview.w} × ${preview.h} m</text>`);
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = parts.join('');
}

/* --- gesta --- */
let ptrs = new Map(), gest = null;
function napojPlatno() {
  const cv = el('cv'); if (!cv || cv.dataset.bound) return;
  cv.dataset.bound = '1';
  const local = (e) => { const r = cvRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    const p = local(e);
    ptrs.set(e.pointerId, p);

    if (ptrs.size === 2) {
      const a = [...ptrs.values()];
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      gest = { type:'pinch', d0: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1, s0: view.scale, w0: s2w(mid.x, mid.y) };
      preview = null; return;
    }

    /* Zamčená zahrada: prst jen posouvá a vybírá, nic se nepřekreslí. */
    if (state.zamek && state.tool !== 'pan') {
      gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false };
      return;
    }

    if (state.tool === 'outline') {
      const hv = state.outline.findIndex(q => { const sp = w2s(q[0],q[1]); return Math.hypot(sp[0]-p.x, sp[1]-p.y) <= 17; });
      if (hv >= 0) { gest = { type:'vertex', i:hv, start:p, moved:false }; return; }
      const n = state.outline.length;
      if (n >= 2) {
        const lim = (state.outlineDone && n >= 3) ? n : n-1;
        for (let i = 0; i < lim; i++) {
          const a = state.outline[i], b = state.outline[(i+1) % n];
          const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
          if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
          const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
          if (Math.hypot(mx-p.x, my-p.y) <= 15) { gest = { type:'insert', i, start:p, moved:false }; return; }
        }
      }
      gest = { type:'tapAdd', start:p, moved:false }; return;
    }

    if (state.tool === 'erase') {
      gest = { type:'erase', start:p, moved:false, done:new Set() };
      const k = cellAt(p.x, p.y);
      const o = ownerAt(k);
      if (!o || !o.zamek) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }

    if (PRVKY[state.tool]) {
      const w = s2w(p.x, p.y);
      gest = { type:'rect', prvek: state.tool, ax: Math.floor(w[0]), ay: Math.floor(w[1]), start:p, moved:false };
      return;
    }

    /* Ruka: prst vždy posouvá plán. Prvek se hýbe jen když je předtím vybraný —
       jinak by se při listování zahradou omylem přetahovaly záhony. */
    const sel = state.sel ? state.items[state.sel] : null;
    if (sel && !sel.zamek) {
      const h = handlesOf(sel).find(h => Math.hypot(h.p[0]-p.x, h.p[1]-p.y) <= 18);
      if (h) { gest = { type:'stretch', id:sel.id, side:h.side, start:p, applied:0, moved:false }; return; }
    }
    const own = ownerAt(cellAt(p.x, p.y));
    if (own && state.sel === own.id && !own.zamek && !state.zamek) {
      gest = { type:'move', id:own.id, start:p, last:{dx:0,dy:0}, moved:false }; return;
    }
    gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false, klep: own ? own.id : null };
  });

  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.set(e.pointerId, p);
    if (!gest) return;
    if (gest.type !== 'pinch' && !gest.moved && Math.hypot(p.x-gest.start.x, p.y-gest.start.y) > 7) gest.moved = true;

    if (gest.type === 'pinch') {
      const a = [...ptrs.values()]; if (a.length < 2) return;
      const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1;
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      view.scale = clamp(gest.s0 * (d/gest.d0), 1.2, 60);
      view.ox = gest.w0[0] - mid.x/view.scale;
      view.oy = gest.w0[1] - mid.y/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'pan' && gest.moved) {
      view.ox = gest.o0.ox - (p.x - gest.start.x)/view.scale;
      view.oy = gest.o0.oy - (p.y - gest.start.y)/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'erase') {
      const k = cellAt(p.x, p.y);
      const o = ownerAt(k);
      if (!gest.done.has(k) && (!o || !o.zamek)) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }
    if (gest.type === 'rect') {
      const w = s2w(p.x, p.y);
      const bx = Math.floor(w[0]), by = Math.floor(w[1]);
      const x0 = Math.min(gest.ax, bx), y0 = Math.min(gest.ay, by);
      preview = { prvek:gest.prvek, x:x0, y:y0, w: Math.abs(bx-gest.ax)+1, h: Math.abs(by-gest.ay)+1 };
      scheduleRender(); return;
    }
    if (gest.type === 'vertex' && gest.moved) {
      state.outline[gest.i] = snapW(...s2w(p.x, p.y));
      scheduleRender(); return;
    }
    if (gest.type === 'stretch') {
      const it = state.items[gest.id]; if (!it) return;
      const side = gest.side;
      const d = (side === 'E' || side === 'W')
        ? (p.x - gest.start.x)/view.scale
        : (p.y - gest.start.y)/view.scale;
      const want = Math.round((side === 'W' || side === 'N') ? -d : d);
      let guard = 0;
      while (gest.applied < want && guard++ < 80) { if (!stretch(it, side, true)) break; gest.applied++; }
      guard = 0;
      while (gest.applied > want && guard++ < 80) { if (!stretch(it, side, false)) break; gest.applied--; }
      scheduleRender(); return;
    }
    if (gest.type === 'move' && gest.moved) {
      const it = state.items[gest.id]; if (!it) return;
      const dx = Math.round((p.x - gest.start.x)/view.scale);
      const dy = Math.round((p.y - gest.start.y)/view.scale);
      if (dx !== gest.last.dx || dy !== gest.last.dy) {
        moveItemBy(it, dx - gest.last.dx, dy - gest.last.dy);
        gest.last = { dx, dy };
        scheduleRender();
      }
      return;
    }
  });

  const finish = (e) => {
    ptrs.delete(e.pointerId);
    if (!gest) return;
    const g = gest;
    if (ptrs.size > 0 && g.type === 'pinch') return;
    gest = null;

    if (g.type === 'pinch') { save(); kresliPlatno(); return; }

    if (g.type === 'tapAdd' && !g.moved) {
      const w = snapW(...s2w(g.start.x, g.start.y));
      if (!state.outlineDone && state.outline.length >= 3) {
        const f = w2s(state.outline[0][0], state.outline[0][1]);
        if (Math.hypot(f[0]-g.start.x, f[1]-g.start.y) <= 19) {
          state.outlineDone = true; save(); kresliMapu(); toast('Obrys uzavřen'); return;
        }
      }
      if (state.outlineDone) { state.selVert = null; save(); kresliMapu(); return; }
      state.outline.push(w); state.selVert = null; save(); kresliMapu(); return;
    }
    if (g.type === 'insert' && !g.moved) {
      const a = state.outline[g.i], b = state.outline[(g.i+1) % state.outline.length];
      state.outline.splice(g.i+1, 0, snapW((a[0]+b[0])/2, (a[1]+b[1])/2));
      state.selVert = g.i+1;
      save(); kresliMapu(); toast('Vrchol vložen'); return;
    }
    if (g.type === 'vertex') {
      if (g.moved) { save(); kresliMapu(); }
      else { state.selVert = (state.selVert === g.i) ? null : g.i; save(); kresliMapu(); }
      return;
    }
    if (g.type === 'erase') { save(); kresliMapu(); return; }

    if (g.type === 'rect') {
      const pv = preview; preview = null;
      const w = s2w(g.start.x, g.start.y);
      const box = pv || { prvek:g.prvek, x:Math.floor(w[0]), y:Math.floor(w[1]), w:1, h:1 };
      let keys = rectKeys(box.x, box.y, box.x+box.w, box.y+box.h);
      // na zamcene prvky se kreslit neda
      keys = keys.filter(k => { const o = ownerAt(k); return !o || !o.zamek; });
      if (!keys.length) { toast('Tahle část je zamčená'); kresliMapu(); return; }
      // ctverecky vedle sebe patri k jednomu prvku stejneho typu;
      // kvetinace jsou kazdy sam za sebe, proto se nikdy nespojuji
      const sousedi = new Set();
      if (!PRVKY[box.prvek].samostatny) keys.forEach(k => {
        const c = cxy(k);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(dd => {
          const o = ownerAt(ck(c[0]+dd[0], c[1]+dd[1]));
          if (o && o.typ === box.prvek && !o.zamek) sousedi.add(o.id);
        });
      });
      let target = null;
      if (sousedi.size) {
        const ids = [...sousedi];
        target = state.items[ids[0]];
        ids.slice(1).forEach(id => { const o = state.items[id]; if (o) { addCells(target, o.cells.slice()); } });
        addCells(target, keys);
      } else if (PRVKY[box.prvek].samostatny) {
        keys.forEach(k => { target = novyPrvek(box.prvek, [k]); });
      } else {
        target = novyPrvek(box.prvek, keys);
      }
      const fresh = !sousedi.size && keys.length === 1 || !sousedi.size;
      state.sel = null;
      save(); kresliMapu();
      if (fresh && target && roste(target) && !PRVKY[box.prvek].samostatny) dialogPrvku(target.id);
      return;
    }
    if (g.type === 'stretch') { save(); kresliMapu(); return; }
    if (g.type === 'move') {
      if (g.moved) { save(); kresliMapu(); }
      else { state.sel = g.id; save(); kresliMapu(); }
      return;
    }
    if (g.type === 'pan') {
      if (g.moved) { save(); return; }
      if (g.klep && state.sel !== g.klep) { state.sel = g.klep; save(); kresliMapu(); }
      else if (state.sel) { state.sel = null; save(); kresliMapu(); }
      return;
    }
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', finish);

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cvRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

}

   Jedním pohledem na plán i na kartu: co ten záhon zrovna potřebuje.

const STAV_BARVY = {
  zalij:  { bg:'#2f7fa8', ik:'konev',    popis:'Potřebuje zalít' },
  sklid:  { bg:'#1e7a3c', ik:'kosik',    popis:'Je čas sklízet' },
  hnoj:   { bg:'#a9663a', ik:'hnojivo',  popis:'Dlouho bez hnojení' },
  uhyn:   { bg:'#c0392b', ik:'uhyn',     popis:'Letos tu uhynuly rostliny' },
  prace:  { bg:'#d99a1f', ik:'pece',     popis:'Čeká tu práce z kalendáře' },
  zamek:  { bg:'#5c6b5e', ik:'zamek',    popis:'Zamčeno' },
  ven:    { bg:'#c0392b', ik:'pozor',    popis:'Přesahuje obrys zahrady' },
  prazdny:{ bg:'#8a9a8c', ik:'sazenice', popis:'Bez plodiny' },
};
function stavy(b) {
  const out = [];
  const c = crop(b.cropId);
  const m = new Date().getMonth() + 1;
  if (!itemInside(b)) out.push('ven');
  if (b.zamek) out.push('zamek');
  if (!c) { out.push('prazdny'); return out; }
  const k = dalsiKrok(b);
  if (k.akce === 'zalij') out.push('zalij');
  if (k.akce === 'sklid' || c.harvest.includes(m)) out.push('sklid');
  if (k.akce === 'hnoj') out.push('hnoj');
  if (!k.akce && ukonyOf(c).some(u => u.m === m)) out.push('prace');
  if (uhynLetos(b) > 0) out.push('uhyn');
  return out;
}
const stavOdznak = (s) => `<span class="odznak" style="background:${STAV_BARVY[s].bg}" title="${esc(STAV_BARVY[s].popis)}">${ik(STAV_BARVY[s].ik)}</span>`;

const rostlinSlovo = (n) => n === 1 ? 'rostlina' : (n >= 2 && n <= 4 ? 'rostliny' : 'rostlin');

/* ============ OBRAZOVKA: KALENDÁŘ ============ */
const DNY_ZKR = ['Po','Út','St','Čt','Pá','So','Ne'];
const UKON_PIX = { soil:'ryc', sow:'semeno', plant:'sazenice', care:'pece', harvest:'kosik' };
const ZAPIS_PIX = { voda:'konev', hnuj:'hnojivo', vysadba:'sazenice', sklizen:'kosik', uhyn:'uhyn', dosadba:'sazenice', akce:'pece' };
const ZAPIS_NAZEV = { voda:'Zalito', hnuj:'Pohnojeno', vysadba:'Vyseto nebo vysazeno', sklizen:'Sklizeno', uhyn:'Úhyn rostlin', dosadba:'Dosazeno', akce:'' };

/* Vsechno, co je v zahrade zapsane na konkretni den: zalivka, hnojeni, vysadba */
function zapisyPoDnech() {
  const map = {};
  const pridej = (iso, e) => { if (!iso) return; (map[iso] = map[iso] || []).push(e); };
  beds().forEach(b => {
    (b.zalivka || []).forEach(dt => pridej(dt, { typ:'voda', b }));
    (b.hnojeni || []).forEach(h => pridej(h.datum, { typ:'hnuj', b, co:h.co }));
    if (b.datumVysadby) pridej(b.datumVysadby, { typ:'vysadba', b });
    (b.sklizen || []).forEach(s => pridej(s.datum, { typ:'sklizen', b, co: fmtN(s.mnozstvi) + ' ' + (s.jednotka||'kg') }));
    (b.zaznamy || []).forEach(z => { const a = akceById(z.akceId); if (a) pridej(z.datum, { typ:'akce', b, co:a.nazev, ikona:a.ikona }); });
    (b.udalosti || []).forEach(u => pridej(u.datum, { typ:u.typ, b,
      co: (u.typ === 'uhyn' ? '−' : '+') + u.pocet + (u.duvod ? ', ' + u.duvod.toLowerCase() : '') }));
  });
  return map;
}
const isoDne = (r, m, d) => r + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2);

function kresliKalendar() {
  const s = el('s-cal');
  const dnes = new Date();
  let rok = state.calRok ?? dnes.getFullYear();
  let mi = state.calMonth ?? dnes.getMonth();       // 0-11
  const m = mi + 1;
  const zapisy = zapisyPoDnech();

  // mrizka: tyden zacina pondelim
  const prvni = new Date(rok, mi, 1);
  const posun = (prvni.getDay() + 6) % 7;
  const dnuVMesici = new Date(rok, mi+1, 0).getDate();
  const dnuPred = new Date(rok, mi, 0).getDate();
  const bunky = [];
  for (let i = 0; i < posun; i++) bunky.push({ d: dnuPred - posun + 1 + i, out:true });
  for (let d = 1; d <= dnuVMesici; d++) bunky.push({ d, out:false, iso: isoDne(rok, m, d) });
  while (bunky.length % 7) bunky.push({ d: bunky.length - posun - dnuVMesici + 1, out:true });

  const dnesIso = todayISO();
  const moje = beds().map(b => ({ b, c: crop(b.cropId) })).filter(o => o.c);
  const ukMoje = [];
  moje.forEach(o => ukonyOf(o.c).filter(u => u.m === m).forEach(u => ukMoje.push({ ...u, c:o.c, b:o.b })));
  const ukOst = [];
  allCrops().forEach(c => {
    if (moje.some(o => o.c.id === c.id)) return;
    ukonyOf(c).filter(u => u.m === m).forEach(u => ukOst.push({ ...u, c, b:null }));
  });
  const poradi = { soil:0, sow:1, plant:2, care:3, harvest:4 };
  ukMoje.sort((a,b)=>poradi[a.typ]-poradi[b.typ]);
  ukOst.sort((a,b)=>poradi[a.typ]-poradi[b.typ]);
  const zapisuVMesici = bunky.filter(b => !b.out && zapisy[b.iso]).length;

  s.innerHTML = `<div class="scroll">
    <div class="sec" style="margin-top:14px">
      <div class="seg" style="margin-bottom:14px">
        <button class="${state.calRezim!=='rok'?'on':''}" data-crez="mesic">Měsíc</button>
        <button class="${state.calRezim==='rok'?'on':''}" data-crez="rok">Celý rok</button>
      </div>
      ${state.calRezim === 'rok' ? rokovyPrehled(rok) : `
      <div class="calhead">
        <button class="ar" id="c-prev" aria-label="Předchozí měsíc">‹</button>
        <span class="nm"><b>${esc(MESICE[mi])}</b><span>${rok}${zapisuVMesici ? ' · ' + zapisuVMesici + ' dnů se zápisem' : ''}</span></span>
        <button class="ar" id="c-next" aria-label="Další měsíc">›</button>
      </div>
      <div class="cal">
        ${DNY_ZKR.map(d=>`<div class="wd">${d}</div>`).join('')}
        ${bunky.map(b => {
          if (b.out) return `<div class="cday out">${b.d}</div>`;
          const ev = zapisy[b.iso] || [];
          const typy = [...new Set(ev.map(e=>e.typ))];
          return `<button class="cday ${b.iso===dnesIso?'dnes':(typy.length?'mam':'')}" data-den="${b.iso}">
            ${b.d}<span class="dots">${typy.slice(0,3).map(t=>`<i class="${t}"></i>`).join('')}</span></button>`;
        }).join('')}
      </div>
      <div class="callegend">
        <span><i style="background:var(--sky)"></i>zalito</span>
        <span><i style="background:var(--earth)"></i>hnojeno</span>
        <span><i style="background:var(--acc)"></i>výsev či výsadba</span>
        <span><i style="background:var(--sun)"></i>sklizeň</span>
        <span><i style="background:var(--danger)"></i>úhyn</span>
      </div>
      ${mi !== dnes.getMonth() || rok !== dnes.getFullYear()
        ? `<button class="btn sm sec wide" id="c-dnes" style="margin-top:14px">Zpátky na dnešek</button>` : ''}

      <div class="sec-h" style="margin-top:26px"><h2>Co dělat v ${esc(MESICE[mi])}u</h2><span class="n">${ukMoje.length}</span></div>
      <div class="list">
        ${ukMoje.length ? ukMoje.map(u => radekUkonu(u, true)).join('')
          : `<div class="card"><div class="task"><span class="ti2" style="background:var(--bg2)">${ik('klid')}</span>
             <span class="tm"><b>V ${esc(MESICE[mi])}u nic nečeká</b><span>Na tvých plodinách není tenhle měsíc žádný úkon.</span></span></div></div>`}
      </div>
      ${ukOst.length ? `<div class="sec-h" style="margin-top:24px"><h2>Co se dá dělat navíc</h2><span class="n">${ukOst.length}</span></div>
      <div class="list">${ukOst.map(u => radekUkonu(u, false)).join('')}</div>` : ''}
      `}
    </div>
  </div>`;

  s.querySelectorAll('[data-crez]').forEach(b => b.onclick = () => {
    state.calRezim = b.dataset.crez; save(); kresliKalendar();
  });
  if (state.calRezim === 'rok') {
    s.querySelectorAll('[data-crop]').forEach(b => b.onclick = () => dialogPlodiny(b.dataset.crop));
    return;
  }

  const posun2 = (k) => {
    mi += k;
    if (mi < 0) { mi = 11; rok--; }
    if (mi > 11) { mi = 0; rok++; }
    state.calMonth = mi; state.calRok = rok; save(); kresliKalendar();
  };
  if (!el('c-prev')) return;
  el('c-prev').onclick = () => posun2(-1);
  el('c-next').onclick = () => posun2(1);
  const cd = el('c-dnes');
  if (cd) cd.onclick = () => {
    state.calMonth = dnes.getMonth(); state.calRok = dnes.getFullYear(); save(); kresliKalendar();
  };
  s.querySelectorAll('[data-den]').forEach(b => b.onclick = () => dialogDne(b.dataset.den));
  s.querySelectorAll('[data-crop]').forEach(b => b.onclick = () => dialogPlodiny(b.dataset.crop));
}

/* ============ ROČNÍ PŘEHLED ============
   Zahradničení běží v intervalech, ne v jednotlivých dnech. Každá plodina
   má pruh přes dvanáct měsíců: kdy připravit půdu, sít, sázet, pečovat
   a sklízet. Hned je vidět, kdy se záhon uvolní pro další plodinu. */
const PAS_BARVA = { soil:'#a9663a', sow:'#7bb04c', plant:'#1e7a3c', care:'#d99a1f', harvest:'#c0392b' };
const PAS_NAZEV = { soil:'půda', sow:'výsev', plant:'výsadba', care:'péče', harvest:'sklizeň' };
function rokovyPrehled(rok) {
  const dnesM = new Date().getMonth() + 1;
  const moje = [];
  beds().forEach(b => { const c = crop(b.cropId); if (c && !moje.some(x => x.c.id === c.id)) moje.push({ c, b }); });
  const seznam = moje.length ? moje : allCrops().slice(0, 8).map(c => ({ c, b:null }));
  return `
    <p class="note" style="margin-top:0">${moje.length ? 'Plodiny, které pěstuješ.' : 'Zatím nic nepěstuješ, tohle je ukázka ze seznamu plodin.'} Barevné pruhy jsou období, kdy se co dělá.</p>
    <div class="rok">
      <div class="rhead"><span class="rn"></span>
        <span class="rmesice">${MESICE_KR2.map((m,i)=>`<span class="${i+1===dnesM?'ted':''}">${m.charAt(0).toUpperCase()}</span>`).join('')}</span>
      </div>
      ${seznam.map(o => {
        const typy = {};
        ukonyOf(o.c).forEach(u => { (typy[u.typ] = typy[u.typ] || []).push(u.m); });
        const poradi = ['soil','sow','plant','care','harvest'].filter(t => typy[t] && typy[t].length);
        return `<button class="rrow" data-crop="${o.c.id}">
          <span class="rn"><span class="ra">${cropArt(o.c)}</span><b>${esc(o.c.nazev)}</b>
            ${o.b ? `<i>${esc(o.b.nazev)}</i>` : ''}</span>
          <span class="rpas">
            <span class="rmr">${MESICE_KR2.map((x,i)=>`<i class="${i+1===dnesM?'ted':''}"></i>`).join('')}</span>
            ${poradi.map(t => `<span class="rl">
              ${Array.from({length:12},(_,i)=>{
                const on = typy[t].includes(i+1);
                return `<i class="${on?'on':''}" style="${on?'background:'+PAS_BARVA[t]:''}"></i>`;
              }).join('')}
            </span>`).join('')}
          </span>
        </button>`;
      }).join('')}
    </div>
    <div class="callegend" style="margin-top:14px">
      ${Object.keys(PAS_NAZEV).map(t=>`<span><i style="background:${PAS_BARVA[t]};border-radius:2px"></i>${PAS_NAZEV[t]}</span>`).join('')}
    </div>`;
}

/* Co se ten den v zahradě dělo a co se tam dá dopsat */

    ${uk.length ? `<div class="sec-h"><h2>Úkony měsíce</h2></div>
      <div class="list">${uk.slice(0,6).map(u=>`<div class="card task ${u.typ}">
        <span class="ti2">${ik(UKON_PIX[u.typ])}</span>
        <span class="tm"><b>${esc(u.t)}</b><span>${esc(u.c.nazev)} · ${esc(u.b.nazev)}</span></span></div>`).join('')}</div>` : ''}

function radekUkonu(u, moje) {
  return `<button class="card task ${u.typ}" data-crop="${u.c.id}" style="width:100%;text-align:left">

/* ============ DIALOGY ============ */
function dialog(obsah) {
  zavri();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="dh"><i></i></div><div class="dc">${obsah}</div></div>`;
  ov.addEventListener('pointerdown', e => { if (e.target === ov) zavri(); });
  document.body.appendChild(ov);
  return ov;
}
function zavri() { const o = el('ov'); if (o) o.remove(); }
function potvrd(nadpis, text, ano) {
  const d = dialog(`<h2>${esc(nadpis)}</h2><p class="lead">${esc(text)}</p>
    <div class="dacts"><button class="btn sec" id="c-ne">Zrušit</button>

  d.querySelector('#c-ne').onclick = zavri;
  d.querySelector('#c-ano').onclick = () => { zavri(); ano(); };
}

/* --- fotky --- */
let fotoCil = null, fotoPotom = null;
function pridejFotku(id, potom) {
  fotoCil = id; fotoPotom = potom || null;
  let inp = el('inp-foto');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'inp-foto'; inp.hidden = true;
    inp.setAttribute('capture','environment');
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f || !fotoCil) return;
      const it = state.items[fotoCil]; if (!it) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 1100, (data) => {
        it.fotky = it.fotky || [];
        it.fotky.push({ data, datum: todayISO() });
        save(); kresliZahonky(); toast('Fotka přidána');
        if (fotoPotom) fotoPotom();
      });
      r.readAsDataURL(f);
    };
  }
  inp.click();
}
function prohlizecFotek(bedId, idx) {
  const it = state.items[bedId]; if (!it) return;
  const fs = fotky(it); if (!fs.length) return;
  let i = clamp(idx, 0, fs.length-1);
  const kresli = () => {
    const f = fs[i];
    const d = dialog(`<h2>${esc(it.nazev)}</h2>
      <p class="lead">${esc(formatDate(f.datum))} · ${esc(relDays(f.datum))} · ${i+1} z ${fs.length}</p>
      <img src="${f.data}" style="width:100%;border-radius:var(--r);display:block" alt="">
      <div class="dacts"><button class="btn sec" id="f-st" ${i>=fs.length-1?'disabled':''}>Starší</button>
      <button class="btn sec" id="f-no" ${i===0?'disabled':''}>Novější</button></div>
      <div class="dacts"><button class="btn" id="f-ok">Zavřít</button></div>`);
    d.querySelector('#f-ok').onclick = zavri;
    const a = d.querySelector('#f-st'), b = d.querySelector('#f-no');
    if (a) a.onclick = () => { if (i<fs.length-1){i++;kresli();} };
    if (b) b.onclick = () => { if (i>0){i--;kresli();} };
  };
  kresli();
}

let cfotoCil = null, cfotoPotom = null;
function addCropFoto(cropId, potom) {
  cfotoCil = cropId; cfotoPotom = potom || null;
  let inp = el('inp-cfoto');
  if (!inp) {
    inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.id='inp-cfoto'; inp.hidden=true;
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value='';
      if (!f || !cfotoCil) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 900, (data) => {
        if (!state.cropFoto) state.cropFoto = {};
        state.cropFoto[cfotoCil] = (state.cropFoto[cfotoCil]||[]).concat([data]);
        save(); kresliPlodiny(); toast('Fotka přidána');
        if (cfotoPotom) cfotoPotom();
      });
      r.readAsDataURL(f);
    };
  }
  inp.click();
}

    } else if (vlastni) {
      const i = state.customCrops.findIndex(x => x.id === id);
      if (i>=0) state.customCrops[i] = Object.assign({ id }, data);
    } else {
      state.cropEdits = state.cropEdits || {};
      state.cropEdits[id] = data;
    }
    save(); zavri(); kresliPlodiny(); kresliZahonky(); toast(novy ? 'Plodina přidána' : 'Uloženo');
  };
  const sm = d.querySelector('#e-smaz');
  if (sm) sm.onclick = () => potvrd('Smazat '+c.nazev+'?','Záhonky s ní zůstanou bez plodiny.', () => {
    state.customCrops = state.customCrops.filter(x => x.id !== id);
    beds().forEach(b => { if (b.cropId === id) b.cropId = null; });
    save(); zavri(); kresliPlodiny(); kresliZahonky(); toast('Smazáno');
  });
  const rs = d.querySelector('#e-reset');
  if (rs) rs.onclick = () => { delete state.cropEdits[id]; save(); zavri(); kresliPlodiny(); toast('Vráceno'); };
}

/* --- obchod --- */
function dialogObchodu(id) {
  const o = id ? shopOf(id) : null;
  const d = dialog(`<h2>${o ? 'Upravit obchod' : 'Nový obchod'}</h2>
    <p class="lead">${o ? '' : 'E-shop, zahradnictví nebo soused, co dává sadbu.'}</p>
    <div class="field"><label for="o-n">Název</label><input id="o-n" value="${esc(o?o.nazev:'')}" placeholder="Zahradnictví u nádraží"></div>
    <div class="field"><label for="o-u">Odkaz nebo adresa</label><input id="o-u" value="${esc(o?o.url:'')}" placeholder="https://…"></div>
    <div class="field"><label for="o-i">Ikona</label><input id="o-i" value="${esc(o?(o.ico||'🛒'):'🛒')}" maxlength="3"></div>
    <div class="field"><label for="o-p">Poznámka</label><textarea id="o-p">${esc(o?o.pozn:'')}</textarea></div>
    <div class="dacts"><button class="btn sec" id="o-zrus">Zrušit</button><button class="btn" id="o-ok">Uložit</button></div>`);
  d.querySelector('#o-zrus').onclick = zavri;
  d.querySelector('#o-ok').onclick = () => {
    const nazev = d.querySelector('#o-n').value.trim();
    if (!nazev) { toast('Napiš název'); return; }
    let url = d.querySelector('#o-u').value.trim();
    if (url && !/^https?:\/\//i.test(url) && /\.[a-z]{2,}/i.test(url) && !/\s/.test(url)) url = 'https://' + url;
    const pozn = d.querySelector('#o-p').value.trim(), ico = d.querySelector('#o-i').value.trim() || '🛒';
    if (o) Object.assign(o, { nazev, url, pozn, ico });
    else {
      const nid = 'v' + (state.nextShop = (state.nextShop||1) + 1);
      state.shops[nid] = { id:nid, nazev, url, pozn, ico, vlastni:true };
    }
    save(); zavri(); kresliPlodiny(); toast('Uloženo');
  };
}
