<title>Koza Zahradník</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: pevná aplikační slupka — horní lišta, jedna rolovací plocha,
   dolní navigace. Plán zahrady je mapa přes celou plochu s plovoucím
   ovládáním a vysouvacím panelem. */
:root {
  --bg: #ffffff;
  --bg2: #f3f6f1;
  --card: #ffffff;
  --ink: #0f1a12;
  --ink2: #5c6b5e;
  --ink3: #8a9a8c;
  --line: #e1e8df;
  --line2: #eef2ec;
  --acc: #1e7a3c;
  --acc-dark: #156030;
  --acc-soft: #e4f1e7;
  --acc-ink: #ffffff;
  --earth: #a9663a;
  --earth-soft: #f3e8dd;
  --sun: #d99a1f;
  --sky: #2f7fa8;
  --danger: #c0392b;
  --paper: #fafbf8;
  --dot: #c3d0c1;
  --grid: #e8eee6;
  --house: #8d96a0;
  --house-soft: #e7eaee;
  --r: 16px;
  --r-s: 11px;
  --sh: 0 1px 2px rgba(15,26,18,.05), 0 4px 16px rgba(15,26,18,.06);
  --sh-lift: 0 2px 6px rgba(15,26,18,.1), 0 12px 32px rgba(15,26,18,.14);
  --ui: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11170f; --bg2: #0b100a; --card: #19211700; --card: #192117;
    --ink: #e9efe6; --ink2: #9fb09f; --ink3: #6f8070;
    --line: #2a3528; --line2: #212b20;
    --acc: #4fab6a; --acc-dark: #3d8f55; --acc-soft: #1b2b1f; --acc-ink: #06160a;
    --earth: #c08css; --earth: #c08b5e; --earth-soft: #2b211a;
    --sun: #e0ad42; --sky: #5aa6cd; --danger: #e06153;
    --paper: #141b12; --dot: #36442f; --grid: #1d2619;
    --house: #7e8992; --house-soft: #252d33;
    --sh: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --sh-lift: 0 2px 8px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11170f; --bg2: #0b100a; --card: #192117;
  --ink: #e9efe6; --ink2: #9fb09f; --ink3: #6f8070;
  --line: #2a3528; --line2: #212b20;
  --acc: #4fab6a; --acc-dark: #3d8f55; --acc-soft: #1b2b1f; --acc-ink: #06160a;
  --earth: #c08b5e; --earth-soft: #2b211a;
  --sun: #e0ad42; --sky: #5aa6cd; --danger: #e06153;
  --paper: #141b12; --dot: #36442f; --grid: #1d2619;
  --house: #7e8992; --house-soft: #252d33;
  --sh: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --sh-lift: 0 2px 8px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--ui); font-size: 15px; line-height: 1.45;
  font-weight: 500; -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
h1,h2,h3,h4 { margin: 0; font-weight: 800; letter-spacing: -.02em; }

/* ---------- slupka ---------- */
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  max-width: 640px; margin: 0 auto; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
}
#bar {
  flex: none; height: 56px; display: flex; align-items: center; gap: 12px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line2); z-index: 10;
}
#bar h1 { font-size: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#bar .sub { font-size: 12px; font-weight: 600; color: var(--ink3); letter-spacing: 0; }
.bar-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  color: var(--ink2); flex: none;
}
.bar-btn:active { background: var(--line2); }
.bar-btn svg { width: 21px; height: 21px; }
.bar-mark { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; flex: none; background: var(--acc-dark); display: grid; place-items: center; }
.bar-mark svg { width: 26px; height: 26px; }

#view { flex: 1; min-height: 0; position: relative; }
.scr { position: absolute; inset: 0; display: none; flex-direction: column; }
.scr.on { display: flex; }
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 24px;
}

/* ---------- dolní navigace ---------- */
#nav {
  flex: none; display: flex; background: var(--bg);
  border-top: 1px solid var(--line2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  z-index: 10;
}
#nav button {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 9px 2px 7px; color: var(--ink3);
  font-size: 10.5px; font-weight: 700; letter-spacing: -.01em;
}
#nav button .ni {
  width: 54px; height: 30px; border-radius: 16px; display: grid; place-items: center;
  transition: background .15s;
}
#nav button svg { width: 22px; height: 22px; }
#nav button.on { color: var(--acc); }
#nav button.on .ni { background: var(--acc-soft); }
</style>
<style>

.btn {

.field { margin-bottom: 14px; }

.seg {

}

.pix { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

/* ---------- mapa ---------- */
.map { position: absolute; inset: 0; background: var(--paper); }
#cv { position: absolute; inset: 0; touch-action: none; overflow: hidden; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.m-search {
  position: absolute; top: 12px; left: 12px; right: 12px; z-index: 4;
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px;
  background: var(--card); border-radius: 26px; box-shadow: var(--sh-lift);
  font-size: 15px; font-weight: 700; color: var(--ink); text-align: left;
}
.m-search .si { width: 20px; height: 20px; flex: none; color: var(--acc); }
.m-search .st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-search .sx { width: 36px; height: 36px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; flex: none; color: var(--ink2); }

.m-panel {

  box-shadow: var(--sh); color: var(--ink); display: grid; place-items: center;

}

.m-scale {

}

.m-load {
  position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  font-weight: 700; color: var(--ink2); font-size: 14.5px;
}
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--acc); animation: sp .75s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }

/* vysouvací panel */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card); border-radius: 22px 22px 0 0;
  box-shadow: 0 -2px 10px rgba(15,26,18,.07), 0 -12px 40px rgba(15,26,18,.1);
  display: flex; flex-direction: column; max-height: 82%;

}

.sheet .grip { flex: none; padding: 9px 0 5px; display: grid; place-items: center; }

.sheet .body {
  overflow-y: auto; overscroll-behavior: contain;

}

.tools { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px 14px; padding: 0 4px 2px; }

}
.tool .ti svg { width: 21px; height: 21px; }
.tool .ti i.sw { width: 20px; height: 20px; border-radius: 6px; display: block; }
.tool.on { color: var(--acc); }
.tool.on .ti { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); }

.facts { display: flex; gap: 10px; margin-bottom: 14px; }
.fact { flex: 1; min-width: 0; }
.fact .v { font-size: 21px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.fact .k { font-size: 11px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; margin-top: 1px; }

.parcels { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

.selbar {

  background: var(--acc-soft); border-radius: 14px; padding: 11px 12px;
}

.selbar .sn { display: block; flex: 1; min-width: 0; }
.selbar .sn b { display: block; font-size: 14.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selbar .sn span { font-size: 12px; font-weight: 700; color: var(--ink2); }
</style>
<style>

function save() {
  try { state.view = view; localStorage.setItem('zahradka-v2', JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('zahradka-v2');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        state = Object.assign(state, p);
        if (p.view && isFinite(p.view.scale)) view = p.view;
        if (!state.shops || !Object.keys(state.shops).length) seedShops();
        if (!state.cropPlan) state.cropPlan = {};
        if (!state.cropFoto) state.cropFoto = {};
        if (!state.lokalita) state.lokalita = 'praha';
        if (!Array.isArray(state.vedlejsi)) state.vedlejsi = [];
        if (!Array.isArray(state.customCrops)) state.customCrops = [];
        if (!state.cropEdits) state.cropEdits = {};
        items().forEach(i => {
          if (!i.hnojeni) i.hnojeni = [];
          if (!i.zalivka) i.zalivka = [];
          if (i.rostliny === undefined) i.rostliny = null;
          if (i.thumb !== undefined) delete i.thumb;
          i.fotky = (i.fotky || []).map(f => typeof f === 'string' ? { data:f, datum:'' } : f);
          if (!i.cells) {
            const x = Math.round(i.x||0), y = Math.round(i.y||0);
            const w = Math.max(1, Math.round(i.w||1)), hh = Math.max(1, Math.round(i.h||1));
            i.cells = rectKeys(x, y, x+w, y+hh);
            delete i.x; delete i.y; delete i.w; delete i.h;
          }
        });
        return;
      }
    }
  } catch (e) {}
  // prvni spusteni: prazdna zahrada, uzivatel si nacte svou parcelu
  state.outline = []; state.outlineDone = false; state.items = {}; state.vedlejsi = [];
  seedShops();
}
function seedShops() {
  state.shops = {};
  OBCHODY_ZAKLAD.forEach(o => { state.shops[o.id] = Object.assign({ vlastni:false }, o); });
  state.nextShop = OBCHODY_ZAKLAD.length + 1;
}

function shrinkImage(dataUrl, maxW, cb) {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { cb(c.toDataURL('image/jpeg', 0.75)); } catch (e) { cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

function pixSvg(id) {
  const s = PIX[id];
  if (!s) return '';
  let r = '';
  for (let y = 0; y < s.d.length; y++) {
    const row = s.d[y];
    for (let x = 0; x < row.length; x++) {
      const c = s.p[row[x]];
      if (c) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`;
    }
  }
  return `<svg class="pix" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

/* ============ GEOMETRIE ============
   Obrys zahrady je polygon v metrech, s vrcholy, ktere se daji tahat.
   Prvky (zahon, dum, cesta) jsou mnoziny ctverecku 1 x 1 m, takze muzou mit
   i nepravidelny tvar a daji se po ctverecku pridavat i ubirat. */
function polyArea(pts) {
  if (!pts || pts.length < 3) return 0;
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s) / 2;
}
function pointInPoly(x, y, pts) {
  if (!pts || pts.length < 3) return true;
  let inside = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi) * (y-yi) / (yj-yi) + xi)) inside = !inside;
  }
  return inside;
}
function bbox(pts) {
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return { x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys) };
}

/* --- ctverecky --- */
const ck = (x, y) => x + ',' + y;
const cxy = (k) => { const p = k.split(','); return [ +p[0], +p[1] ]; };
const cellsOf = (it) => (it && it.cells) || [];
const itArea = (it) => cellsOf(it).length;
function itBBox(it) {
  const cs = cellsOf(it);
  if (!cs.length) return { x0:0, y0:0, x1:0, y1:0, w:0, h:0 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const k of cs) {
    const c = cxy(k);
    if (c[0] < x0) x0 = c[0];
    if (c[1] < y0) y0 = c[1];
    if (c[0]+1 > x1) x1 = c[0]+1;
    if (c[1]+1 > y1) y1 = c[1]+1;
  }
  return { x0, y0, x1, y1, w: x1-x0, h: y1-y0 };
}
const isRect = (it) => { const b = itBBox(it); return itArea(it) === b.w * b.h; };
function rectKeys(x0, y0, x1, y1) {
  const out = [];
  for (let y = Math.min(y0,y1); y < Math.max(y0,y1); y++)
    for (let x = Math.min(x0,x1); x < Math.max(x0,x1); x++) out.push(ck(x,y));
  return out;
}
function ownerAt(key) {
  for (const i of items()) if ((i.cells||[]).indexOf(key) >= 0) return i;
  return null;
}
function pruneEmpty() {
  Object.keys(state.items).forEach(id => {
    const it = state.items[id];
    if (!it.cells || !it.cells.length) {
      delete state.items[id];
      if (state.sel === id) state.sel = null;
    }
  });
}
/* Pridani ctverecku jednomu prvku. Co patrilo jinemu, se mu odebere. */
function addCells(it, keys) {
  const mine = new Set(it.cells || []);
  keys.forEach(k => {
    const o = ownerAt(k);
    if (o && o.id !== it.id) o.cells = o.cells.filter(x => x !== k);
    mine.add(k);
  });
  it.cells = [...mine];
  pruneEmpty();
}
function removeCells(keys) {
  keys.forEach(k => { const o = ownerAt(k); if (o) o.cells = o.cells.filter(x => x !== k); });
  pruneEmpty();
}
function moveItemBy(it, dx, dy) {
  const keys = cellsOf(it).map(k => { const c = cxy(k); return ck(c[0]+dx, c[1]+dy); });
  it.cells = [];
  addCells(it, keys);
}
/* Roztahovani za uchyt: nova rada vznikne kopii krajni rady, takze to funguje
   i u nepravidelnych tvaru. Zmensovani krajni radu odebere. */
function stretch(it, side, grow) {
  const b = itBBox(it);
  const cs = cellsOf(it).map(cxy);
  if (grow) {
    let nk = [];
    if (side === 'E') nk = cs.filter(p => p[0] === b.x1-1).map(p => ck(b.x1, p[1]));
    if (side === 'W') nk = cs.filter(p => p[0] === b.x0).map(p => ck(b.x0-1, p[1]));
    if (side === 'S') nk = cs.filter(p => p[1] === b.y1-1).map(p => ck(p[0], b.y1));
    if (side === 'N') nk = cs.filter(p => p[1] === b.y0).map(p => ck(p[0], b.y0-1));
    if (!nk.length) return false;
    addCells(it, nk);
    return true;
  }
  if ((side === 'E' || side === 'W') && b.w <= 1) return false;
  if ((side === 'N' || side === 'S') && b.h <= 1) return false;
  let rm = [];
  if (side === 'E') rm = cs.filter(p => p[0] === b.x1-1);
  if (side === 'W') rm = cs.filter(p => p[0] === b.x0);
  if (side === 'S') rm = cs.filter(p => p[1] === b.y1-1);
  if (side === 'N') rm = cs.filter(p => p[1] === b.y0);
  const rmSet = new Set(rm.map(p => ck(p[0], p[1])));
  const left = cellsOf(it).filter(k => !rmSet.has(k));
  if (!left.length) return false;
  it.cells = left;
  return true;
}
function reshapeRect(it, w, h) {
  const b = itBBox(it);
  it.cells = [];
  addCells(it, rectKeys(b.x0, b.y0, b.x0 + Math.max(1, Math.round(w)), b.y0 + Math.max(1, Math.round(h))));
}
/* Prvek je v zahrade, kdyz lezi v obrysu nebo na nektere vedlejsi parcele */
function itemInside(it) {
  if (!state.outlineDone || state.outline.length < 3) return true;
  const plochy = [state.outline].concat(state.vedlejsi || []);
  const cs = cellsOf(it);
  if (!cs.length) return true;
  let uvnitr = 0;
  cs.forEach(k => {
    const c = cxy(k), x = c[0]+0.5, y = c[1]+0.5;
    if (plochy.some(poly => poly.length >= 3 && pointInPoly(x, y, poly))) uvnitr++;
  });
  return uvnitr / cs.length >= 0.6;
}
/* Hrany unie ctverecku: kreslime linku jen tam, kde vedle neni dalsi ctverecek */
function edgeSegments(it) {
  const s = new Set(cellsOf(it));
  const segs = [];
  s.forEach(k => {
    const c = cxy(k), x = c[0], y = c[1];
    if (!s.has(ck(x, y-1))) segs.push([x, y, x+1, y]);
    if (!s.has(ck(x, y+1))) segs.push([x, y+1, x+1, y+1]);
    if (!s.has(ck(x-1, y))) segs.push([x, y, x, y+1]);
    if (!s.has(ck(x+1, y))) segs.push([x+1, y, x+1, y+1]);
  });
  return segs;
}

/* Maly nahled pudorysu se zvyraznenym zahonem */
function miniPlan(hiId, size) {
  const all = [];
  if (state.outline.length >= 2) all.push(...state.outline);
  items().forEach(i => { const b = itBBox(i); all.push([b.x0,b.y0],[b.x1,b.y1]); });
  if (!all.length) return '';
  const g = bbox(all);
  const gw = Math.max(g.x1-g.x0, 1), gh = Math.max(g.y1-g.y0, 1);
  const it = state.items[hiId];

  // Okno vyrezu: kolem zahonu nechame kontext podle jeho velikosti, ne celou zahradu
  let side, cx, cy, crop_ = false;
  if (it && itArea(it)) {
    const b = itBBox(it);
    const pad = clamp(Math.max(b.w, b.h) * 0.75, 3, 10);
    side = Math.max(b.w, b.h) + pad*2;
    cx = (b.x0+b.x1)/2; cy = (b.y0+b.y1)/2;
    if (side >= Math.max(gw, gh)) {
      side = Math.max(gw, gh) + 2; cx = (g.x0+g.x1)/2; cy = (g.y0+g.y1)/2;
    } else {
      crop_ = true;
      if (side <= gw) cx = clamp(cx, g.x0 + side/2, g.x1 - side/2);
      if (side <= gh) cy = clamp(cy, g.y0 + side/2, g.y1 - side/2);
    }
  } else {
    side = Math.max(gw, gh) + 2; cx = (g.x0+g.x1)/2; cy = (g.y0+g.y1)/2;
  }
  const wx0 = cx - side/2, wy0 = cy - side/2;
  const s = size / side;
  const X = (x) => ((x-wx0)*s).toFixed(1), Y = (y) => ((y-wy0)*s).toFixed(1);

  const parts = [`<rect width="${size}" height="${size}" fill="var(--paper)"/>`];
  if (state.outlineDone && state.outline.length >= 3) {
    parts.push(`<polygon points="${state.outline.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="var(--acc-soft)" stroke="var(--acc)" stroke-width="1.6"/>`);
  }
  const zo = { paved:0, house:1, bed:2 }, ov = (s+0.5).toFixed(1);
  // kreslime jen to, co do vyrezu zasahuje
  items().filter(i => {
    const b = itBBox(i);
    return b.x1 > wx0 && b.x0 < wx0+side && b.y1 > wy0 && b.y0 < wy0+side;
  }).sort((x,y)=>(zo[x.typ]||0)-(zo[y.typ]||0)).forEach(i => {
    const hi = i.id === hiId, d = PRVKY[i.typ] || PRVKY.bed;
    const c = crop(i.cropId);
    let fp = '';
    cellsOf(i).forEach(k => { const q = cxy(k); fp += `M${X(q[0])} ${Y(q[1])}h${ov}v${ov}h-${ov}Z`; });
    const fill = hi ? 'var(--warn)' : ((i.typ === 'bed' && c) ? 'var(--acc)' : d.fill);
    parts.push(`<path d="${fp}" fill="${fill}" fill-opacity="${hi?1:0.8}"/>`);
    if (!hi) parts.push(`<path d="${fp}" fill="none" stroke="${d.line}" stroke-width="0.7" opacity=".5"/>`);
  });
  if (it && itArea(it)) {
    const b = itBBox(it);
    parts.push(`<rect x="${X(b.x0)}" y="${Y(b.y0)}" width="${(b.w*s).toFixed(1)}" height="${(b.h*s).toFixed(1)}" fill="none" stroke="var(--warn)" stroke-width="2.4" rx="2"/>`);
  }
  if (crop_) {
    parts.push(`<text x="${size-3}" y="${size-3}" text-anchor="end" font-size="7.5" font-weight="800" fill="var(--ink3)">${Math.round(side)} m</text>`);
  }
  return `<svg class="mini" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-label="Poloha v zahradě">${parts.join('')}</svg>`;
}
const cropFotky = (id) => (state.cropFoto && state.cropFoto[id]) || [];
const shops = () => Object.values(state.shops || {});
const shopOf = (id) => (state.shops || {})[id] || null;
const planOf = (cropId) => (state.cropPlan || {})[cropId] || { shops:[], odruda:'' };
function setPlan(cropId, patch) {
  if (!state.cropPlan) state.cropPlan = {};
  const p = state.cropPlan[cropId] || { shops:[], odruda:'' };
  state.cropPlan[cropId] = Object.assign(p, patch);
  save();
}
function lastFert(it) {
  const h = (it.hnojeni || []).filter(x => x && x.datum).slice().sort((a,b) => a.datum < b.datum ? 1 : -1);
  return h[0] || null;
}
/* Rozdil v kalendarnich dnech, ne v hodinach: dnesni zapis musi dat 0 */
function dnuOd(datum) {
  const q = String(datum || '').slice(0,10).split('-').map(Number);
  if (q.length !== 3 || !q[0] || !q[1] || !q[2]) return null;
  const a = new Date(q[0], q[1]-1, q[2]);
  if (isNaN(a)) return null;
  const n = new Date();
  const b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
/* Zahon s plodinou, ktery nebyl hnojen pres rok, si rika o pozornost */
function hnojeniZanedbano(it) {
  if (!crop(it.cropId)) return false;
  const lf = lastFert(it);
  if (!lf) return true;
  const d = dnuOd(lf.datum);
  return d != null && d > 365;
}


/* ============ KATASTR ============
   Obrys zahrady z verejnych sluzeb CUZK, bez klice a bez registrace.

   1) adresa + PSC -> souradnice (Nominatim, ma importovana adresni mista z RUIAN)
   2) parcely v okoli            (inspire-cp-wfs, typenames cp:CadastralParcel)
   3) budovy v okoli             (inspire-CPX-wfs, typenames cp-ext:Building)

   Parcela, na ktere stoji budova, je zastavena plocha. Parcela bez budovy je
   zahrada nebo travni porost - a presne ta nas zajima. */
const CUZK_CP  = 'https://services.cuzk.cz/wfs/inspire-cp-wfs.asp';
const CUZK_CPX = 'https://services.cuzk.cz/wfs/inspire-CPX-wfs.asp';
const CRS84 = 'http://www.opengis.net/def/crs/EPSG/0/4326';
const CP_NS = 'http://inspire.ec.europa.eu/schemas/cp/4.0';
const CPX_NS = 'http://services.cuzk.cz/xsd/inspire/cp-ext/4.0';

/* V aplikaci jde pozadavek pres nativni most, ktery obchazi CORS. */
async function httpGet(url, accept) {
  if (window.KozaNative && typeof window.KozaNative.get === 'function') {
    const r = window.KozaNative.get(url, accept || '');
    if (r == null || r === '') throw new Error('prázdná odpověď');
    if (r.indexOf('KOZA_ERR:') === 0) throw new Error(r.slice(9));
    return r;
  }
  const res = await fetch(url, accept ? { headers: { 'Accept': accept } } : undefined);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

async function geokoduj(dotaz) {
  const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cz&q='
    + encodeURIComponent(dotaz);
  const j = JSON.parse(await httpGet(u, 'application/json'));
  if (!j || !j.length) return null;
  return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon), nazev: j[0].display_name };
}

/* Chyba je jen tehdy, kdyz je ExceptionReport korenem dokumentu. Sluzba totiz
   k platne odpovedi pripojuje truncatedResponse s ExceptionReport uvnitr. */
function chybaSluzby(xml) {
  if (!xml) return 'prázdná odpověď';
  let doc;
  try { doc = new DOMParser().parseFromString(xml, 'application/xml'); }
  catch (q) { return 'odpověď nejde přečíst'; }
  const root = doc.documentElement;
  if (!root || doc.querySelector('parsererror')) return 'odpověď nejde přečíst';
  if (root.localName !== 'ExceptionReport') return null;
  const t = root.getElementsByTagNameNS('*', 'ExceptionText');
  if (t.length) return (t[0].textContent || '').trim().slice(0, 200);
  return 'služba vrátila chybové hlášení';
}

/* Souradnice ze znacky: poradi os overujeme podle rozsahu CR */
function paryZTextu(txt) {
  const c = (txt || '').trim().split(/\s+/).map(Number);
  const out = [];
  for (let k = 0; k + 1 < c.length; k += 2) {
    const a = c[k], b = c[k+1];
    const ok = (a > 48 && a < 52 && b > 12 && b < 19);
    out.push(ok ? [a, b] : [b, a]);
  }
  return out;
}

/* Parcely: pole polygonu, kazdy { body:[[lat,lon]], cislo, vymera } */
function parsujParcely(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const cleny = doc.getElementsByTagNameNS('*', 'CadastralParcel');
  for (let i = 0; i < cleny.length; i++) {
    const el = cleny[i];
    const pl = el.getElementsByTagNameNS('*', 'posList');
    if (!pl.length) continue;
    const body = paryZTextu(pl[0].textContent);
    if (body.length < 4) continue;
    const lab = el.getElementsByTagNameNS('*', 'label');
    const ar = el.getElementsByTagNameNS('*', 'areaValue');
    out.push({
      body,
      cislo: lab.length ? (lab[0].textContent || '').trim() : '',
      vymera: ar.length ? parseFloat(ar[0].textContent) : null,
    });
  }
  return out;
}

/* Budovy: jen poloha symbolu a natoceni, pudorys sluzba nedava */
function parsujBudovy(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const cleny = doc.getElementsByTagNameNS('*', 'Building');
  for (let i = 0; i < cleny.length; i++) {
    const pos = cleny[i].getElementsByTagNameNS('*', 'pos');
    if (!pos.length) continue;
    const p = paryZTextu(pos[0].textContent);
    if (!p.length) continue;
    const rot = cleny[i].getElementsByTagNameNS('*', 'rotation');
    out.push({ lat: p[0][0], lon: p[0][1], uhel: rot.length ? parseFloat(rot[0].textContent) || 0 : 0 });
  }
  return out;
}

const vPolygonu = (lat, lon, body) => pointInPoly(lon, lat, body.map(q => [q[1], q[0]]));

/* Sousedni parcely sdili hranu, ale ne vzdy i lomovy bod. Proto meríme
   vzdalenost vrcholu jedne parcely od hran te druhe. */
function vzdalenostOdUsecky(p, a, b) {
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const L = dx*dx + dy*dy;
  const t = L ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L)) : 0;
  return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy));
}
function sousedi(a, b, tol) {
  tol = tol || 1.0;
  const lat0 = a[0][0];
  const naM = (p) => [ (p[1]) * 111320 * Math.cos(lat0*Math.PI/180), p[0] * 110540 ];
  const A = a.map(naM), B = b.map(naM);
  for (const dvojice of [[A,B],[B,A]]) {
    const X = dvojice[0], Y = dvojice[1];
    for (const q of X) {
      for (let i = 0; i < Y.length; i++) {
        if (vzdalenostOdUsecky(q, Y[i], Y[(i+1) % Y.length]) < tol) return true;
      }
    }
  }
  return false;
}
/* 23/1 a 23/2 jsou dily tehoz puvodniho pozemku, obvykle jednoho vlastnika */
const kmenCisla = (c) => String(c || '').split('/')[0].trim();

/* Natoceni: najdeme smer, ve kterem ma parcela nejmensi opsany obdelnik,
   a postavime ji na vysku - na telefonu se tak vyuzije cela obrazovka. */
function hezkeNatoceni(body) {
  let nej = { uhel: 0, plocha: Infinity, w: 0, h: 0 };
  for (let i = 0; i < body.length; i++) {
    const a = body[i], b = body[(i+1) % body.length];
    const uhel = Math.atan2(b[1]-a[1], b[0]-a[0]);
    const ot = body.map(p => otoc(p, -uhel));
    const xs = ot.map(p=>p[0]), ys = ot.map(p=>p[1]);
    const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
    if (w*h < nej.plocha) nej = { uhel, plocha: w*h, w, h };
  }
  // naPlan otaci o +uhel, merili jsme o -uhel; na vysku = delsi strana svisle
  return nej.w > nej.h ? -nej.uhel + Math.PI/2 : -nej.uhel;
}
const otoc = (p, u) => [ p[0]*Math.cos(u) - p[1]*Math.sin(u), p[0]*Math.sin(u) + p[1]*Math.cos(u) ];

/* Prevod stupnu na metry kolem referencniho bodu, pak natoceni a posun do pocatku */
function naPlan(body, lat0, lon0, uhel) {
  const mLat = 110540, mLon = 111320 * Math.cos(lat0 * Math.PI / 180);
  let m = body.map(p => [ (p[1]-lon0)*mLon, -(p[0]-lat0)*mLat ]);
  if (uhel) m = m.map(p => otoc(p, uhel));
  return m;
}
function doPocatku(sada) {
  const vse = [].concat(...sada);
  const x0 = Math.min(...vse.map(p=>p[0])), y0 = Math.min(...vse.map(p=>p[1]));
  return sada.map(poly => poly.map(p => [
    Math.round((p[0]-x0)*10)/10, Math.round((p[1]-y0)*10)/10 ]));
}
function bezDuplicitnihoKonce(m) {
  if (m.length > 2) {
    const a = m[0], b = m[m.length-1];
    if (Math.abs(a[0]-b[0]) < 0.2 && Math.abs(a[1]-b[1]) < 0.2) m.pop();
  }
  return m;
}

let katStav = { stav:'idle', text:'' };

async function nactiParcelu(dotaz) {
  katStav = { stav:'hledam', text:'Hledám adresu…' };
  kresliMapu();
  const m = await geokoduj(dotaz);
  if (!m) {
    katStav = { stav:'chyba', text:'Adresu „' + dotaz + '" jsem nenašel. Zkus doplnit PSČ nebo obec.' };
    kresliMapu(); return;
  }

  katStav = { stav:'hledam', text:'Stahuji parcely z katastru…' };
  kresliMapu();
  // asi 90 x 90 m. Vetsi vyrez v zastavbe narazi na strop poctu parcel
  // a hledana zahrada se do odpovedi vubec nedostane.
  const d = 0.00042;
  const dLon = d / Math.cos(m.lat * Math.PI / 180);
  const bbox = [ m.lat-d, m.lon-dLon, m.lat+d, m.lon+dLon ].map(x=>x.toFixed(6)).join(',');
  const uP = CUZK_CP + '?service=WFS&version=2.0.0&request=GetFeature'
    + '&typenames=' + encodeURIComponent('cp:CadastralParcel')
    + '&namespaces=' + encodeURIComponent('xmlns(cp,' + CP_NS + ')')
    + '&count=60&srsName=' + encodeURIComponent(CRS84)
    + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
  const xmlP = await httpGet(uP, 'application/xml');
  const chyba = chybaSluzby(xmlP);
  if (chyba) { katStav = { stav:'chyba', text:'Katastr odmítl dotaz: ' + chyba }; kresliMapu(); return; }
  const parcely = parsujParcely(xmlP);
  if (!parcely.length) {
    katStav = { stav:'chyba', text:'Katastr tu nenašel parcely. Může jít o území bez digitální mapy.' };
    kresliMapu(); return;
  }

  // budovy jsou nepovinne: kdyz sluzba nedopovi, jedeme dal bez nich
  let budovy = [];
  try {
    const uB = CUZK_CPX + '?service=WFS&version=2.0.0&request=GetFeature'
      + '&typenames=' + encodeURIComponent('cp-ext:Building')
      + '&namespaces=' + encodeURIComponent('xmlns(cp-ext,' + CPX_NS + ')')
      + '&count=60&srsName=' + encodeURIComponent(CRS84)
      + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
    const xmlB = await httpGet(uB, 'application/xml');
    if (!chybaSluzby(xmlB)) budovy = parsujBudovy(xmlB);
  } catch (q) {}

  // ke kazde parcele poznamename, jestli na ni stoji budova
  parcely.forEach(p => {
    p.zastavena = budovy.some(b => vPolygonu(b.lat, b.lon, p.body));
    p.budovy = budovy.filter(b => vPolygonu(b.lat, b.lon, p.body));
  });

  const adresni = parcely.findIndex(p => vPolygonu(m.lat, m.lon, p.body));
  if (adresni < 0) {
    katStav = { stav:'chyba', text:'Adresu jsem našel, ale nepadla do žádné parcely. Zkus přesnější adresu.' };
    kresliMapu(); return;
  }

  // Sousedni parcela bez budovy muze byt zahrada, ale taky ulice nebo
  // verejna zelen. Rozhoduje kmen cisla: 23/2 patri k domu na 23/1.
  const adr = parcely[adresni];
  const adrKmen = kmenCisla(adr.cislo);
  parcely.forEach((q, i) => {
    q.sousedi = i === adresni || sousedi(q.body, adr.body);
    q.stejnyKmen = kmenCisla(q.cislo) === adrKmen;
  });
  const vybrane = new Set([adresni]);
  parcely.forEach((q, i) => {
    if (i === adresni || q.zastavena || !q.sousedi) return;
    if (q.stejnyKmen) vybrane.add(i);
  });
  // kdyz se podle cisla nic nenaslo, vezmeme jedinou rozumne velkou sousedni
  if (vybrane.size === 1) {
    const kand = parcely.map((q,i)=>({q,i}))
      .filter(o => o.i !== adresni && !o.q.zastavena && o.q.sousedi
                   && o.q.vymera && o.q.vymera <= Math.max(1200, (adr.vymera||300) * 4));
    if (kand.length === 1) vybrane.add(kand[0].i);
  }

  const nabidka = parcely.map((q,i) => ({ q, i }))
    .filter(o => o.i === adresni || (o.q.sousedi && (!o.q.vymera || o.q.vymera < 8000)))
    .sort((x,y) => (x.i === adresni ? -1 : y.i === adresni ? 1
      : (y.q.stejnyKmen - x.q.stejnyKmen) || ((x.q.vymera||0) - (y.q.vymera||0))));
  state.katParcely = nabidka.map(o => ({
    cislo: o.q.cislo, vymera: o.q.vymera, zastavena: o.q.zastavena,
    stejnyKmen: o.q.stejnyKmen, adresni: o.i === adresni,
    body: o.q.body, budovy: o.q.budovy, vybrana: vybrane.has(o.i),
  }));
  state.katStred = { lat: m.lat, lon: m.lon };
  state.katObec = (m.nazev || '').split(',').slice(0,3).join(',').trim();
  state.adresa = dotaz;
  postavZahradu();
  katStav = { stav:'vyber', text:'' };
  state.panelAdresa = false;
  save(); kresliMapu();
  requestAnimationFrame(() => fitView());
}

/* Z vybranych parcel postavi novou prazdnou zahradu: obrys, dum, zadne zahony */
function postavZahradu() {
  const vyb = (state.katParcely || []).filter(p => p.vybrana);
  if (!vyb.length) return;
  // uplne novy plan: nic z predchozi zahrady nezustava
  state.outline = []; state.outlineDone = false; state.vedlejsi = [];
  state.items = {}; state.nextId = 1;
  state.sel = null; state.selVert = null; state.tool = 'bed';
  const s = state.katStred;

  // natoceni pocitame z nejvetsi vybrane parcely
  const hlavni = vyb.slice().sort((a,b) => plochaStupnu(b.body) - plochaStupnu(a.body))[0];
  const uhel = hezkeNatoceni(naPlan(hlavni.body, s.lat, s.lon, 0));

  const sada = vyb.map(p => naPlan(p.body, s.lat, s.lon, uhel));
  const budovyBody = [];
  vyb.forEach(p => (p.budovy || []).forEach(b => {
    budovyBody.push(naPlan([[b.lat, b.lon]], s.lat, s.lon, uhel)[0]);
  }));
  const vsechno = doPocatku(sada.concat(budovyBody.map(b => [b])));
  const obrysy = vsechno.slice(0, sada.length).map(bezDuplicitnihoKonce);
  const domy = vsechno.slice(sada.length).map(a => a[0]);

  // obrysem je nejvetsi parcela bez budovy, tedy zahrada. Zastavene az potom.
  const zast = vyb.map(p => !!p.zastavena);
  const poradi = obrysy.map((o,i) => ({ o, z: zast[i] }));
  poradi.sort((a,b) => (a.z === b.z) ? polyArea(b.o) - polyArea(a.o) : (a.z ? 1 : -1));
  obrysy.length = 0;
  poradi.forEach(q => obrysy.push(q.o));
  state.outline = obrysy[0];
  state.outlineDone = true;
  state.vedlejsi = obrysy.slice(1);

  // nova zahrada: zadne zahony, jen dum podle katastru
  state.items = {};
  state.nextId = 1;
  state.sel = null; state.selVert = null;
  domy.forEach((d, i) => {
    const x = Math.max(0, Math.round(d[0]) - 3), y = Math.max(0, Math.round(d[1]) - 3);
    const id = 'p' + state.nextId++;
    state.items[id] = { id, typ:'house', cells: rectKeys(x, y, x+7, y+7),
      nazev: domy.length > 1 ? 'Dům ' + (i+1) : 'Dům',
      cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[], zalivka:[], rostliny:null };
  });
}
function plochaStupnu(body) {
  let s = 0;
  for (let i = 0; i < body.length; i++) {
    const a = body[i], b = body[(i+1) % body.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s)/2;
}

function nactiObrys() {
  const a = (el('addr-input').value || '').trim();
  const psc = ((el('psc-input') || {}).value || '').trim();
  if (!a) { toast('Napiš ulici a číslo popisné'); return; }
  state.adresa = a; state.psc = psc; save();
  nactiParcelu(psc ? a + ', ' + psc : a).catch(e => {
    katStav = { stav:'blokovano', text: String((e && e.message) || e) };
    kresliMapu();
  });
}
function prepniParcelu(i) {
  const p = (state.katParcely || [])[i];
  if (!p) return;
  p.vybrana = !p.vybrana;
  if (!(state.katParcely || []).some(q => q.vybrana)) { p.vybrana = true; return; }
  postavZahradu();
  save(); kresliMapu();
  requestAnimationFrame(() => fitView());
}
function ukazkovyObrys() {
  state.outline = [[0,0],[28,0],[28,30],[22,38],[0,38]];
  state.outlineDone = true; state.sel = null; state.selVert = null;
  state.vedlejsi = []; state.katParcely = null;
  state.items = {}; state.nextId = 1;
  const id = 'p' + state.nextId++;
  state.items[id] = { id, typ:'house', cells: rectKeys(2,2,13,11), nazev:'Dům',
    cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[], zalivka:[], rostliny:null };
  katStav = { stav:'ok', text:'Ukázková parcela 1040 m². Záhony si nakresli sám.' };
  save(); kresliMapu();
  requestAnimationFrame(() => fitView());
}

/* ============ SLUPKA ============ */

const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT = null;
function toast(zprava) {
  let t = el('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = zprava; t.style.opacity = '1';
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

/* ============ OBRAZOVKA: ZAHRADA (mapa) ============ */
const NASTROJE = [
  { id:'pan',     popis:'Ruka',  ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V7.5a1.8 1.8 0 0 0-3.6 0M14.4 10V5.5a1.8 1.8 0 0 0-3.6 0V11M10.8 11V6.5a1.8 1.8 0 0 0-3.6 0v8.8a5.7 5.7 0 0 0 5.7 5.7h1.5a5.7 5.7 0 0 0 5.7-5.7v-3.6a1.8 1.8 0 0 0-3.6 0"/></svg>' },
  { id:'outline', popis:'Obrys', ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 6.5 20 9v7.5L13 20 4 17z"/><circle cx="4" cy="6.5" r="1.8" fill="currentColor"/><circle cx="20" cy="9" r="1.8" fill="currentColor"/></svg>' },

  { id:'house',   popis:'Dům',   sw:'var(--house)' },
  { id:'paved',   popis:'Cesta', sw:'var(--house-soft)' },

];
const RADY = {
  pan: 'Klepni na prvek a vyber ho. Tažením posuneš, úchyty na okrajích roztáhneš.',
  outline: 'Klepej na tečky po obvodu. Vrcholy se dají tahat, kroužkem na hraně vložíš nový.',
  bed: 'Klepnutím přidáš čtvereček záhonu, tažením celý blok.',
  house: 'Tažením vykresli obdélník domu nebo skleníku.',

  erase: 'Klepáním nebo tažením ubíráš čtverečky.',

function kresliMapu() {
  const s = el('s-map');
  const plocha = polyArea(state.outline);
  const zahony = beds().reduce((a,b) => a + itArea(b), 0);
  const vyb = state.sel ? state.items[state.sel] : null;
  if (state.sel && !vyb) state.sel = null;
  const prazdno = !state.outline.length && !items().length;
  const nacitam = katStav.stav === 'hledam';

  s.innerHTML = `
    <div class="map">
      <div id="cv"><svg id="svg" aria-label="Plán zahrady"></svg></div>

      ${prazdno ? `<div class="empty" style="position:absolute;inset:0;display:grid;place-content:center;z-index:2">
        <div class="ei">${pixSvg('konev')}</div>
        <h3>Zatím prázdná zahrada</h3>
        <p>Načti svou parcelu z katastru<br>podle adresy.</p>
      </div>` : ''}

      ${nacitam ? `<div class="m-load"><div class="spin"></div><span>${esc(katStav.text)}</span></div>` : ''}

      ${state.panel ? '' : `<button class="m-search ${state.adresa ? '' : 'plain'}" id="otevri-adresu">
        <span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="10.5" r="3"/><path d="M12 21s7-5.6 7-10.5a7 7 0 1 0-14 0C5 15.4 12 21 12 21z"/></svg></span>
        <span class="st">${state.adresa ? esc(state.adresa) : 'Najít mou parcelu'}</span>
        <span class="sx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>`}

      ${state.panel ? panelAdresy() : ''}

      <div class="m-zoom" id="m-zoom">
        <button id="z-in" aria-label="Přiblížit">+</button>
        <button id="z-out" aria-label="Oddálit">−</button>
        <button id="z-fit" aria-label="Celá zahrada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>

      <div class="m-scale" id="m-scale"><span class="b" id="sc-b"></span><span id="sc-t">5 m</span></div>

      <div class="sheet" id="sheet">
        <div class="grip" id="grip"><i></i></div>
        <div class="body">
          <div class="tools">
            ${NASTROJE.map(t=>`<button class="tool ${state.tool===t.id?'on':''}" data-tool="${t.id}">
              <span class="ti">${t.sw ? `<i class="sw" style="background:${t.sw}"></i>` : t.ico}</span>${t.popis}</button>`).join('')}
          </div>

          ${vyb ? vybranyPrvek(vyb) : ''}

          <div class="facts">
            <div class="fact"><div class="v">${plocha ? fmtA(plocha) : '—'}</div><div class="k">Zahrada</div></div>
            <div class="fact"><div class="v">${zahony ? fmtA(zahony) : '—'}</div><div class="k">Záhony</div></div>
            <div class="fact"><div class="v">${beds().length}</div><div class="k">Záhonků</div></div>
          </div>

          ${katStav.stav === 'vyber' && state.katParcely ? `
            <div class="sec-h" style="margin-top:4px"><h2>Co patří k zahradě</h2></div>
            <div class="parcels">
              ${state.katParcely.map((q,i)=>`<button class="parcel ${q.vybrana?'on':''}" data-parcela="${i}">
                <span class="pn">${esc(q.cislo || '—')}</span>
                <span class="pm">${q.vymera ? Math.round(q.vymera)+' m²' : ''}${q.zastavena ? ' · dům' : (q.stejnyKmen ? ' · zahrada' : '')}</span>
              </button>`).join('')}
            </div>
            <p class="note">${esc(state.katObec || '')} · klepnutím přidáš nebo odebereš</p>
          ` : `<p class="note">${esc(RADY[state.tool] || '')}</p>`}

          ${state.tool === 'outline' && state.outline.length ? `<div class="dacts" style="margin-top:14px">
            ${!state.outlineDone && state.outline.length >= 3 ? `<button class="btn sm" id="o-close">Uzavřít obrys</button>` : ''}
            ${state.selVert != null && state.outline.length > 3 ? `<button class="btn sm sec" id="o-del">Smazat vrchol</button>` : ''}
            <button class="btn sm sec" id="o-undo">Zpět</button>
          </div>` : ''}
        </div>
      </div>
    </div>
  `;

  const oa = el('otevri-adresu');
  if (oa) oa.onclick = () => { state.panel = true; save(); kresliMapu(); };
  if (state.panel) napojPanel();

  s.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    state.tool = b.dataset.tool;
    if (state.tool !== 'outline') state.selVert = null;
    if (state.tool !== 'pan') state.sel = null;
    save(); kresliMapu();
  });
  s.querySelectorAll('[data-parcela]').forEach(b => b.onclick = () => prepniParcelu(Number(b.dataset.parcela)));

  if (vyb) {
    el('v-edit').onclick = () => dialogPrvku(vyb.id);
    el('v-off').onclick = () => { state.sel = null; save(); kresliMapu(); };
  }
  const oc = el('o-close'); if (oc) oc.onclick = () => { state.outlineDone = true; save(); kresliMapu(); toast('Obrys uzavřen'); };
  const od = el('o-del'); if (od) od.onclick = () => { state.outline.splice(state.selVert,1); state.selVert = null; save(); kresliMapu(); };
  const ou = el('o-undo'); if (ou) ou.onclick = () => {
    state.outline.pop(); state.selVert = null;
    if (state.outline.length < 3) state.outlineDone = false;
    save(); kresliMapu();
  };

  el('z-in').onclick  = () => { const r = cvRect(); zoomAt(1.3, r.width/2, r.height/2); };
  el('z-out').onclick = () => { const r = cvRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
  el('z-fit').onclick = () => fitView();

  napojPlatno();
  posadPanel();
  requestAnimationFrame(() => { posadPanel(); kresliPlatno(); });
}

function vybranyPrvek(it) {
  const c = crop(it.cropId), b = itBBox(it);
  return `<div class="selbar">
    <span class="si">${c ? cropArt(c) : (it.typ==='house' ? ikonaDomu() : ikonaPlochy())}</span>
    <span class="sn"><b>${esc(c ? c.nazev : it.nazev)}</b><span>${fmtA(itArea(it))} · ${fmtDim(b.w,b.h)}</span></span>
    <button class="btn sm" id="v-edit">Upravit</button>
    <button class="btn sm sec" id="v-off" style="width:44px;padding:0">×</button>
  </div>`;
}
const ikonaDomu = () => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--house)" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20H3z"/></svg>';
const ikonaPlochy = () => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink3)" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';

/* panel pro hledání adresy */

    <div class="ph"><h3>Najít parcelu</h3>
      <button class="bar-btn" id="p-zavri" aria-label="Zavřít"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

function napojPanel() {
  el('p-zavri').onclick = () => { state.panel = false; save(); kresliMapu(); };
  el('p-hledat').onclick = () => {
    const a = el('f-adr').value.trim(), psc = el('f-psc').value.trim();
    if (!a) { toast('Napiš ulici a číslo popisné'); return; }
    state.adresa = a; state.psc = psc; save();
    nactiParcelu(psc ? a + ', ' + psc : a).catch(e => {
      katStav = { stav:'chyba', text: String((e && e.message) || e) };
      kresliMapu();
    });

/* výsuvný panel: posadíme ho tak, aby byl vidět obsah, ale mapa zůstala velká */
function posadPanel() {
  const sh = el('sheet'), cv = el('cv'), zo = el('m-zoom'), sc = el('m-scale');
  if (!sh || !cv) return;
  const vyska = Math.min(sh.scrollHeight, Math.round(cv.clientHeight * 0.46));
  sh.style.height = vyska + 'px';
  if (zo) zo.style.bottom = (vyska + 14) + 'px';
  if (sc) sc.style.bottom = (vyska + 20) + 'px';
}

/* --- prepocty mezi metry a pixely --- */
function cvRect() { const c = el('cv'); return c ? c.getBoundingClientRect() : { width:0, height:0, left:0, top:0 }; }
function w2s(x, y) { return [ (x - view.ox) * view.scale, (y - view.oy) * view.scale ]; }
function s2w(px, py) { return [ px / view.scale + view.ox, py / view.scale + view.oy ]; }
function snapW(x, y) { return [ Math.round(x/snapStep)*snapStep, Math.round(y/snapStep)*snapStep ]; }
function cellAt(px, py) { const w = s2w(px, py); return ck(Math.floor(w[0]), Math.floor(w[1])); }

function panelVyska() {
  const sh = el('sheet');
  return sh ? sh.offsetHeight : 0;
}
function fitView() {
  let pts = [];
  if (state.outline.length >= 2) {
    pts = state.outline.slice();
    (state.vedlejsi || []).forEach(v => { if (v.length >= 2) pts = pts.concat(v); });
  } else {
    pts = items().flatMap(i => { const b = itBBox(i); return [[b.x0,b.y0],[b.x1,b.y1]]; });
  }
  const r = cvRect();
  if (!pts.length) { kresliPlatno(); return; }
  // plátno ještě nemá rozměry (právě se překreslilo) - zkusíme to v dalším snímku
  if (!r.width || !r.height) {
    kresliPlatno();
    if (!fitView._znovu) {
      fitView._znovu = true;
      requestAnimationFrame(() => { fitView._znovu = false; fitView(); });
    }
    return;
  }
  const b = bbox(pts);
  // mapu zakryva nahore pilulka s adresou a dole vysouvaci panel,
  // zahrada se musi vejit mezi ne
  const shora = el('otevri-adresu') || el('p-zavri') ? 78 : 14;
  const zdola = panelVyska();
  const uzitna = Math.max(120, r.height - zdola - shora);
  const pad = 3;
  const w = Math.max(b.x1-b.x0, 4) + pad*2, h = Math.max(b.y1-b.y0, 4) + pad*2;
  view.scale = clamp(Math.min(r.width/w, uzitna/h), 1.2, 60);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - (shora + uzitna/2)/view.scale;
  save(); kresliPlatno();
}
function centerOn(it) {
  const b = itBBox(it), r = cvRect();
  if (!r.width) return;
  const pad = 6;
  const w = b.w + pad*2, hh = b.h + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/hh), 1.2, 30);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); kresliPlatno();
}
function zoomAt(f, px, py) {
  const w = s2w(px, py);
  view.scale = clamp(view.scale * f, 1.2, 60);
  view.ox = w[0] - px/view.scale;
  view.oy = w[1] - py/view.scale;
  save(); kresliPlatno();
}

/* --- uchyty pro roztahovani --- */
function handlesOf(it) {
  const b = itBBox(it);
  return [
    { side:'N', p: w2s((b.x0+b.x1)/2, b.y0), ax:'v' },
    { side:'S', p: w2s((b.x0+b.x1)/2, b.y1), ax:'v' },
    { side:'W', p: w2s(b.x0, (b.y0+b.y1)/2), ax:'h' },
    { side:'E', p: w2s(b.x1, (b.y0+b.y1)/2), ax:'h' },
  ];
}

/* --- kresleni --- */
let preview = null;
let rafId = null;
function scheduleRender() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = null; kresliPlatno(); }); }

function kresliPlatno() {
  const cv = el('cv'), svg = el('svg');
  if (!cv || !svg) return;
  const W = cv.clientWidth, H = cv.clientHeight;

  snapStep = 1;
  const dotStep = view.scale >= 9 ? 1 : (view.scale >= 3.5 ? 5 : 10);
  const tile = dotStep * view.scale, tile5 = dotStep * 5 * view.scale;
  const px = -view.ox * view.scale, py = -view.oy * view.scale;
  cv.style.backgroundImage =
    'radial-gradient(circle, var(--dot) 1.3px, transparent 1.9px),' +
    'linear-gradient(to right, var(--grid) 1px, transparent 1px),' +
    'linear-gradient(to bottom, var(--grid) 1px, transparent 1px)';
  cv.style.backgroundSize = `${tile}px ${tile}px, ${tile5}px ${tile5}px, ${tile5}px ${tile5}px`;
  cv.style.backgroundPosition = `${px - tile/2}px ${py - tile/2}px, ${px}px ${py}px, ${px}px ${py}px`;

  const sb = el('sc-b'), sbl = el('sc-t');
  if (sb) {
    let mm = 5;
    for (const cand of [1,2,5,10,20,50,100]) { mm = cand; if (cand*view.scale >= 46) break; }
    sb.style.width = (mm*view.scale) + 'px';
    sbl.textContent = mm + ' m';
  }

  const parts = [];
  // dalsi vybrane parcely pod hlavnim obrysem
  (state.vedlejsi || []).forEach(poly => {
    if (poly.length < 3) return;
    const ps = poly.map(q => w2s(q[0],q[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    parts.push(`<polygon points="${ps}" fill="var(--acc-soft)" fill-opacity="0.38" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="6 4"/>`);
  });
  // obrys parcely
  if (state.outline.length >= 2) {
    const pstr = state.outline.map(p => w2s(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    if (state.outlineDone && state.outline.length >= 3) {
      parts.push(`<polygon points="${pstr}" fill="var(--acc-soft)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`);
    } else {
      parts.push(`<polyline points="${pstr}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>`);
    }
  }
  // prvky ze ctverecku
  const zo = { paved:0, house:1, bed:2 };
  const sorted = items().slice().sort((a,b) => (zo[a.typ]||0) - (zo[b.typ]||0));
  const s = view.scale, ov = 0.6;
  sorted.forEach(it => {
    const d = PRVKY[it.typ] || PRVKY.bed;
    const c = crop(it.cropId);
    const out = !itemInside(it);
    const fill = (it.typ === 'bed' && c) ? 'var(--acc)' : d.fill;
    let fp = '';
    cellsOf(it).forEach(k => {
      const cc = cxy(k), sp = w2s(cc[0], cc[1]);
      fp += `M${sp[0].toFixed(1)} ${sp[1].toFixed(1)}h${(s+ov).toFixed(1)}v${(s+ov).toFixed(1)}h${(-(s+ov)).toFixed(1)}Z`;
    });
    parts.push(`<path d="${fp}" fill="${fill}" fill-opacity="${it.typ==='bed'?0.92:0.95}"/>`);
    let ep = '';
    edgeSegments(it).forEach(g => {
      const a = w2s(g[0], g[1]), b2 = w2s(g[2], g[3]);
      ep += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}`;
    });
    parts.push(`<path d="${ep}" fill="none" stroke="${out?'var(--danger)':d.line}" stroke-width="${out?2.5:1.6}" stroke-linecap="square" ${out?'stroke-dasharray="5 4"':''}/>`);

    const b = itBBox(it);
    const sp0 = w2s(b.x0, b.y0), bw = b.w*s, bh = b.h*s;
    if (bw > 34 && bh > 24 && it.typ === 'bed' && c) {
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${(sp0[1]+bh/2).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${Math.min(24, bh*0.55).toFixed(0)}">${c.emoji}</text>`);
    }
    if (bw > 52 && bh > 16) {
      const col = it.typ === 'bed' ? '#ffffff' : 'var(--ink)';
      const ty = (it.typ === 'bed' && c && bh > 42) ? sp0[1] + bh - 7 : sp0[1] + bh/2 + 4;
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${col}" style="paint-order:stroke" stroke="${it.typ==='bed'?'rgba(0,0,0,.3)':'rgba(255,255,255,.45)'}" stroke-width="2.2">${esc(it.nazev)}</text>`);
    }
  });
  // vybrany prvek: ramec a uchyty
  const sel = state.sel ? state.items[state.sel] : null;
  if (sel && state.tool === 'pan') {
    const b = itBBox(sel), sp = w2s(b.x0, b.y0);
    parts.push(`<rect x="${(sp[0]-3).toFixed(1)}" y="${(sp[1]-3).toFixed(1)}" width="${(b.w*s+6).toFixed(1)}" height="${(b.h*s+6).toFixed(1)}" fill="none" stroke="var(--acc-dark)" stroke-width="2" stroke-dasharray="6 4" rx="4"/>`);
    handlesOf(sel).forEach(h => {
      parts.push(`<circle cx="${h.p[0].toFixed(1)}" cy="${h.p[1].toFixed(1)}" r="9.5" fill="var(--card)" stroke="var(--acc-dark)" stroke-width="2.5"/>`);
      const l = 4;
      parts.push(h.ax === 'h'
        ? `<path d="M${(h.p[0]).toFixed(1)} ${(h.p[1]-l).toFixed(1)}v${l*2}" stroke="var(--acc-dark)" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M${(h.p[0]-l).toFixed(1)} ${(h.p[1]).toFixed(1)}h${l*2}" stroke="var(--acc-dark)" stroke-width="2.5" stroke-linecap="round"/>`);
    });
  }
  // vrcholy obrysu
  if (state.tool === 'outline') {
    const n = state.outline.length;
    if (n >= 2) {
      const lim = (state.outlineDone && n >= 3) ? n : n-1;
      for (let i = 0; i < lim; i++) {
        const a = state.outline[i], b = state.outline[(i+1) % n];
        const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
        if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
        const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
        parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="var(--paper)" fill-opacity="0.9" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="3 2.5" data-mid="${i}"/>`);
      }
    }
    state.outline.forEach((p, i) => {
      const sp = w2s(p[0], p[1]);
      const on = state.selVert === i;
      parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="${on?8:6.5}" fill="${on?'var(--acc)':'var(--card)'}" stroke="var(--acc-dark)" stroke-width="2.5"/>`);
      if (i === 0 && !state.outlineDone && state.outline.length >= 3) {
        parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="12" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="3 3"/>`);
      }
    });
  }
  // nahled tazeneho bloku
  if (preview && preview.w > 0 && preview.h > 0) {
    const d = PRVKY[preview.prvek] || PRVKY.bed;
    const sp = w2s(preview.x, preview.y);
    parts.push(`<rect x="${sp[0].toFixed(1)}" y="${sp[1].toFixed(1)}" width="${(preview.w*s).toFixed(1)}" height="${(preview.h*s).toFixed(1)}" fill="${d.fill}" fill-opacity="0.55" stroke="${d.line}" stroke-width="2" stroke-dasharray="6 4"/>`);
    parts.push(`<text x="${(sp[0] + preview.w*s/2).toFixed(1)}" y="${(sp[1] - 7).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--ink)">${preview.w} × ${preview.h} m</text>`);
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = parts.join('');
}

/* --- gesta --- */
let ptrs = new Map(), gest = null;
function napojPlatno() {
  const cv = el('cv'); if (!cv || cv.dataset.bound) return;
  cv.dataset.bound = '1';
  const local = (e) => { const r = cvRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    const p = local(e);
    ptrs.set(e.pointerId, p);

    if (ptrs.size === 2) {
      const a = [...ptrs.values()];
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      gest = { type:'pinch', d0: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1, s0: view.scale, w0: s2w(mid.x, mid.y) };
      preview = null; return;
    }

    if (state.tool === 'outline') {
      const hv = state.outline.findIndex(q => { const sp = w2s(q[0],q[1]); return Math.hypot(sp[0]-p.x, sp[1]-p.y) <= 17; });
      if (hv >= 0) { gest = { type:'vertex', i:hv, start:p, moved:false }; return; }
      const n = state.outline.length;
      if (n >= 2) {
        const lim = (state.outlineDone && n >= 3) ? n : n-1;
        for (let i = 0; i < lim; i++) {
          const a = state.outline[i], b = state.outline[(i+1) % n];
          const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
          if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
          const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
          if (Math.hypot(mx-p.x, my-p.y) <= 15) { gest = { type:'insert', i, start:p, moved:false }; return; }
        }
      }
      gest = { type:'tapAdd', start:p, moved:false }; return;
    }

    if (state.tool === 'erase') {
      gest = { type:'erase', start:p, moved:false, done:new Set() };
      const k = cellAt(p.x, p.y); gest.done.add(k); removeCells([k]); scheduleRender(); return;
    }

    if (state.tool === 'bed' || state.tool === 'house' || state.tool === 'paved') {
      const w = s2w(p.x, p.y);
      gest = { type:'rect', prvek: state.tool, ax: Math.floor(w[0]), ay: Math.floor(w[1]), start:p, moved:false };
      return;
    }

    // ruka
    const sel = state.sel ? state.items[state.sel] : null;
    if (sel) {
      const h = handlesOf(sel).find(h => Math.hypot(h.p[0]-p.x, h.p[1]-p.y) <= 18);
      if (h) { gest = { type:'stretch', id:sel.id, side:h.side, start:p, applied:0, moved:false }; return; }
    }
    const k = cellAt(p.x, p.y);
    const own = ownerAt(k);
    if (own) { gest = { type:'move', id:own.id, start:p, last:{dx:0,dy:0}, moved:false }; return; }
    gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false };
  });

  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.set(e.pointerId, p);
    if (!gest) return;
    if (gest.type !== 'pinch' && !gest.moved && Math.hypot(p.x-gest.start.x, p.y-gest.start.y) > 7) gest.moved = true;

    if (gest.type === 'pinch') {
      const a = [...ptrs.values()]; if (a.length < 2) return;
      const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1;
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      view.scale = clamp(gest.s0 * (d/gest.d0), 1.2, 60);
      view.ox = gest.w0[0] - mid.x/view.scale;
      view.oy = gest.w0[1] - mid.y/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'pan' && gest.moved) {
      view.ox = gest.o0.ox - (p.x - gest.start.x)/view.scale;
      view.oy = gest.o0.oy - (p.y - gest.start.y)/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'erase') {
      const k = cellAt(p.x, p.y);
      if (!gest.done.has(k)) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }
    if (gest.type === 'rect') {
      const w = s2w(p.x, p.y);
      const bx = Math.floor(w[0]), by = Math.floor(w[1]);
      const x0 = Math.min(gest.ax, bx), y0 = Math.min(gest.ay, by);
      preview = { prvek:gest.prvek, x:x0, y:y0, w: Math.abs(bx-gest.ax)+1, h: Math.abs(by-gest.ay)+1 };
      scheduleRender(); return;
    }
    if (gest.type === 'vertex' && gest.moved) {
      state.outline[gest.i] = snapW(...s2w(p.x, p.y));
      scheduleRender(); return;
    }
    if (gest.type === 'stretch') {
      const it = state.items[gest.id]; if (!it) return;
      const side = gest.side;
      const d = (side === 'E' || side === 'W')
        ? (p.x - gest.start.x)/view.scale
        : (p.y - gest.start.y)/view.scale;
      const want = Math.round((side === 'W' || side === 'N') ? -d : d);
      let guard = 0;
      while (gest.applied < want && guard++ < 80) { if (!stretch(it, side, true)) break; gest.applied++; }
      guard = 0;
      while (gest.applied > want && guard++ < 80) { if (!stretch(it, side, false)) break; gest.applied--; }
      scheduleRender(); return;
    }
    if (gest.type === 'move' && gest.moved) {
      const it = state.items[gest.id]; if (!it) return;
      const dx = Math.round((p.x - gest.start.x)/view.scale);
      const dy = Math.round((p.y - gest.start.y)/view.scale);
      if (dx !== gest.last.dx || dy !== gest.last.dy) {
        moveItemBy(it, dx - gest.last.dx, dy - gest.last.dy);
        gest.last = { dx, dy };
        scheduleRender();
      }
      return;
    }
  });

  const finish = (e) => {
    ptrs.delete(e.pointerId);
    if (!gest) return;
    const g = gest;
    if (ptrs.size > 0 && g.type === 'pinch') return;
    gest = null;

    if (g.type === 'pinch') { save(); kresliPlatno(); return; }

    if (g.type === 'tapAdd' && !g.moved) {
      const w = snapW(...s2w(g.start.x, g.start.y));
      if (!state.outlineDone && state.outline.length >= 3) {
        const f = w2s(state.outline[0][0], state.outline[0][1]);
        if (Math.hypot(f[0]-g.start.x, f[1]-g.start.y) <= 19) {
          state.outlineDone = true; save(); kresliMapu(); toast('Obrys uzavřen'); return;
        }
      }
      if (state.outlineDone) { state.selVert = null; save(); kresliMapu(); return; }
      state.outline.push(w); state.selVert = null; save(); kresliMapu(); return;
    }
    if (g.type === 'insert' && !g.moved) {
      const a = state.outline[g.i], b = state.outline[(g.i+1) % state.outline.length];
      state.outline.splice(g.i+1, 0, snapW((a[0]+b[0])/2, (a[1]+b[1])/2));
      state.selVert = g.i+1;
      save(); kresliMapu(); toast('Vrchol vložen'); return;
    }
    if (g.type === 'vertex') {
      if (g.moved) { save(); kresliMapu(); }
      else { state.selVert = (state.selVert === g.i) ? null : g.i; save(); kresliMapu(); }
      return;
    }
    if (g.type === 'erase') { save(); kresliMapu(); return; }

    if (g.type === 'rect') {
      const pv = preview; preview = null;
      const w = s2w(g.start.x, g.start.y);
      const box = pv || { prvek:g.prvek, x:Math.floor(w[0]), y:Math.floor(w[1]), w:1, h:1 };
      const keys = rectKeys(box.x, box.y, box.x+box.w, box.y+box.h);
      // ctverecky vedle sebe patri k jednomu prvku stejneho typu
      const sousedi = new Set();
      keys.forEach(k => {
        const c = cxy(k);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(dd => {
          const o = ownerAt(ck(c[0]+dd[0], c[1]+dd[1]));
          if (o && o.typ === box.prvek) sousedi.add(o.id);
        });
      });
      let target = null;
      if (sousedi.size) {
        const ids = [...sousedi];
        target = state.items[ids[0]];
        ids.slice(1).forEach(id => { const o = state.items[id]; if (o) { addCells(target, o.cells.slice()); } });
      } else {
        const id = 'p' + state.nextId++;
        const n = items().filter(i => i.typ === box.prvek).length + 1;
        target = state.items[id] = { id, typ:box.prvek, cells:[], nazev: PRVKY[box.prvek].nazev + ' ' + n,
          cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[] };
      }
      addCells(target, keys);
      const fresh = !sousedi.size;
      state.sel = null;
      save(); kresliMapu();
      if (fresh && box.prvek === 'bed') dialogPrvku(target.id);
      return;
    }
    if (g.type === 'stretch') { save(); kresliMapu(); return; }
    if (g.type === 'move') {
      if (g.moved) { save(); kresliMapu(); }
      else { state.sel = g.id; save(); kresliMapu(); }
      return;
    }
    if (g.type === 'pan') {
      if (g.moved) save();
      else if (state.sel) { state.sel = null; save(); kresliMapu(); }
      return;
    }
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', finish);

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cvRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

}

  const lw = lastWater(b), lf = lastFert(b);
  const dnes = lw && dnuOd(lw) === 0;
  return `<div class="card">
    ${fs.length ? `<div class="photo-strip">
      ${fs.map((f,i)=>`<figure data-foto="${b.id}|${i}"><img class="photo" src="${f.data}" alt="">
        <figcaption>${esc(relDays(f.datum))}</figcaption></figure>`).join('')}
    </div>` : `<button class="addphoto" data-addfoto="${b.id}">${pixSvg('foto')}Vyfotit záhon</button>`}

    <div class="row">
      <span class="thumb">${c ? cropArt(c) : ikonaPlochy()}</span>
      <span class="mid"><b>${esc(c ? c.nazev : b.nazev)}</b><span>${esc(b.nazev)} · ${fmtA(itArea(b))}</span></span>
      <button class="act ${dnes?'done':''}" data-zalij="${b.id}" aria-label="Zalít">${pixSvg('konev')}</button>
    </div>

    ${pr != null ? `<div class="count">
      <button data-minus="${b.id}" aria-label="Ubrat">−</button>
      <span class="cv"><b>${pr}</b><span>${pr===1?'rostlina':(pr<5?'rostliny':'rostlin')}</span></span>
      <button data-plus="${b.id}" aria-label="Přidat">+</button>
    </div>` : ''}

    <div class="tags">
      ${lw ? `<span class="tag">${pixSvg('konev')}${esc(relDays(lw))}</span>` : ''}
      ${lf ? `<span class="tag">${pixSvg('hnojivo')}${esc(relDays(lf.datum))}</span>` : ''}
      ${!itemInside(b) ? `<span class="tag warn">mimo zahradu</span>` : ''}

      <button class="tag" data-upravit="${b.id}">Upravit</button>
      ${c ? `<button class="tag" data-plodina="${c.id}">O plodině</button>` : ''}
    </div>
  </div>`;
}

function napojZahonky(s) {
  s.querySelectorAll('[data-zalij]').forEach(b => b.onclick = () => { quickWater(b.dataset.zalij); kresliZahonky(); });
  s.querySelectorAll('[data-hnoj]').forEach(b => b.onclick = () => { quickFert(b.dataset.hnoj); kresliZahonky(); });
  s.querySelectorAll('[data-minus]').forEach(b => b.onclick = () => { zmenRostliny(b.dataset.minus, -1); kresliZahonky(); });
  s.querySelectorAll('[data-plus]').forEach(b => b.onclick = () => { zmenRostliny(b.dataset.plus, 1); kresliZahonky(); });
  s.querySelectorAll('[data-upravit]').forEach(b => b.onclick = () => dialogPrvku(b.dataset.upravit));
  s.querySelectorAll('[data-plodina]').forEach(b => b.onclick = () => dialogPlodiny(b.dataset.plodina));

}

function kresliKalendar() {
  const s = el('s-cal');
  const m = (state.calMonth ?? new Date().getMonth()) + 1;
  const moje = beds().map(b => ({ b, c: crop(b.cropId) })).filter(o => o.c);
  const ukMoje = [];
  moje.forEach(o => ukonyOf(o.c).filter(u => u.m === m).forEach(u => ukMoje.push({ ...u, c:o.c, b:o.b })));
  const ukOst = [];
  allCrops().forEach(c => {
    if (moje.some(o => o.c.id === c.id)) return;

  s.innerHTML = `<div class="scroll">

  s.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { state.calMonth = Number(b.dataset.m); save(); kresliKalendar(); });
  s.querySelectorAll('[data-crop]').forEach(b => b.onclick = () => dialogPlodiny(b.dataset.crop));
}

/* ============ DIALOGY ============ */
function dialog(obsah) {
  zavri();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="dh"><i></i></div><div class="dc">${obsah}</div></div>`;
  ov.addEventListener('pointerdown', e => { if (e.target === ov) zavri(); });
  document.body.appendChild(ov);
  return ov;
}
function zavri() { const o = el('ov'); if (o) o.remove(); }
function potvrd(nadpis, text, ano) {
  const d = dialog(`<h2>${esc(nadpis)}</h2><p class="lead">${esc(text)}</p>
    <div class="dacts"><button class="btn sec" id="c-ne">Zrušit</button>
    <button class="btn" id="c-ano" style="background:var(--danger)">Potvrdit</button></div>`);
  d.querySelector('#c-ne').onclick = zavri;
  d.querySelector('#c-ano').onclick = () => { zavri(); ano(); };
}

const fertSeznam = (it) => fotkyRadky((it.hnojeni||[]).slice().sort((a,b)=>a.datum<b.datum?1:-1).map(f => {

const fotoSeznam = (it) => fotkyRadky(fotky(it).map(f => {

const fotkyRadky = (a) => a.join('');

/* --- fotky --- */
let fotoCil = null, fotoPotom = null;
function pridejFotku(id, potom) {
  fotoCil = id; fotoPotom = potom || null;
  let inp = el('inp-foto');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'inp-foto'; inp.hidden = true;
    inp.setAttribute('capture','environment');
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f || !fotoCil) return;
      const it = state.items[fotoCil]; if (!it) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 1100, (data) => {
        it.fotky = it.fotky || [];
        it.fotky.push({ data, datum: todayISO() });
        save(); kresliZahonky(); toast('Fotka přidána');
        if (fotoPotom) fotoPotom();
      });
      r.readAsDataURL(f);
    };
  }
  inp.click();
}
function prohlizecFotek(bedId, idx) {
  const it = state.items[bedId]; if (!it) return;
  const fs = fotky(it); if (!fs.length) return;
  let i = clamp(idx, 0, fs.length-1);
  const kresli = () => {
    const f = fs[i];
    const d = dialog(`<h2>${esc(it.nazev)}</h2>
      <p class="lead">${esc(formatDate(f.datum))} · ${esc(relDays(f.datum))} · ${i+1} z ${fs.length}</p>
      <img src="${f.data}" style="width:100%;border-radius:var(--r);display:block" alt="">
      <div class="dacts"><button class="btn sec" id="f-st" ${i>=fs.length-1?'disabled':''}>Starší</button>
      <button class="btn sec" id="f-no" ${i===0?'disabled':''}>Novější</button></div>
      <div class="dacts"><button class="btn" id="f-ok">Zavřít</button></div>`);
    d.querySelector('#f-ok').onclick = zavri;
    const a = d.querySelector('#f-st'), b = d.querySelector('#f-no');
    if (a) a.onclick = () => { if (i<fs.length-1){i++;kresli();} };
    if (b) b.onclick = () => { if (i>0){i--;kresli();} };
  };
  kresli();
}

let cfotoCil = null, cfotoPotom = null;
function addCropFoto(cropId, potom) {
  cfotoCil = cropId; cfotoPotom = potom || null;
  let inp = el('inp-cfoto');
  if (!inp) {
    inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.id='inp-cfoto'; inp.hidden=true;
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value='';
      if (!f || !cfotoCil) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 900, (data) => {
        if (!state.cropFoto) state.cropFoto = {};
        state.cropFoto[cfotoCil] = (state.cropFoto[cfotoCil]||[]).concat([data]);
        save(); kresliPlodiny(); toast('Fotka přidána');
        if (cfotoPotom) cfotoPotom();
      });
      r.readAsDataURL(f);
    };
  }
  inp.click();
}

    </div></div>`;
  const d = dialog(`
    <h2>${novy ? 'Nová plodina' : 'Upravit ' + esc(c.nazev)}</h2>
    <p class="lead">${novy ? 'Měsíce se propíšou do kalendáře.' : (vlastni ? 'Tvoje plodina.' : 'Úpravy se uloží jen u tebe.')}</p>
    <div class="row2">
      <div class="field" style="flex:0 0 88px"><label for="e-emoji">Značka</label><input id="e-emoji" value="${esc(c.emoji)}" maxlength="3"></div>
      <div class="field"><label for="e-nazev">Název</label><input id="e-nazev" value="${esc(c.nazev)}" placeholder="Pastiňák"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="e-lat">Latinsky</label><input id="e-lat" value="${esc(c.lat)}"></div>
      <div class="field"><label for="e-kat">Kategorie</label><input id="e-kat" list="kats" value="${esc(c.kat)}">
        <datalist id="kats">${kategorie().filter(k=>k!=='Vše').map(k=>`<option value="${esc(k)}">`).join('')}</datalist></div>
    </div>
    ${mes('sow','Měsíce výsevu')}${mes('plant','Měsíce výsadby')}${mes('harvest','Měsíce sklizně')}
    <div class="row2">
      <div class="field"><label for="e-hust">Rostlin na m²</label><input type="number" id="e-hust" step="0.1" min="0.1" value="${c.hustota||9}"></div>
      <div class="field"><label for="e-roz">Rozestup</label><input id="e-roz" value="${esc(c.rozestup)}" placeholder="30 × 40 cm"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="e-hl">Hloubka</label><input id="e-hl" value="${esc(c.hloubka)}"></div>
      <div class="field"><label for="e-sl">Stanoviště</label><input id="e-sl" value="${esc(c.slunce)}"></div>
    </div>
    <div class="field"><label for="e-poz">Na co pozor</label><textarea id="e-poz">${esc(c.pozor)}</textarea></div>
    <div class="field"><label for="e-rad">Jak na to</label><textarea id="e-rad">${esc(c.rady)}</textarea></div>
    <div class="field"><label for="e-zal">Zálivka</label><textarea id="e-zal">${esc(c.zaliv)}</textarea></div>
    <div class="field"><label for="e-sou">Sousedé</label><textarea id="e-sou">${esc(c.sousedi)}</textarea></div>
    <div class="field"><label>Úkony</label><div id="e-ukony">${(c.ukony||[]).map(radekEditoru).join('')}</div>
      <button class="btn sm sec wide" id="e-ukon-add" style="margin-top:8px">Přidat úkon</button>
      ${!(c.ukony||[]).length ? `<p class="note">Bez vlastních úkonů se do kalendáře propíše prostý Výsev, Výsadba a Sklizeň podle měsíců.</p>` : ''}</div>
    <div class="dacts"><button class="btn sec" id="e-zrus">Zrušit</button><button class="btn" id="e-ok">Uložit</button></div>
    ${!novy && vlastni ? `<div class="dacts"><button class="btn sec wide" id="e-smaz" style="color:var(--danger)">Smazat plodinu</button></div>` : ''}
    ${!novy && !vlastni && jeUpravena(id) ? `<div class="dacts"><button class="btn sec wide" id="e-reset">Vrátit původní</button></div>` : ''}`);

  d.querySelectorAll('[data-mg]').forEach(b => b.onclick = () => {
    const k = b.dataset.mg, m = Number(b.dataset.mi);
    c[k] = c[k] || [];
    const i = c[k].indexOf(m);
    if (i>=0) c[k].splice(i,1); else c[k].push(m);
    const on = c[k].includes(m);
    b.style.background = on ? 'var(--acc)' : ''; b.style.borderColor = on ? 'var(--acc)' : '';
    b.style.color = on ? 'var(--acc-ink)' : '';
  });
  const sez = d.querySelector('#e-ukony');
  const napojUkony = () => sez.querySelectorAll('[data-ur]').forEach(b => b.onclick = () => { b.closest('.ur').remove(); });
  d.querySelector('#e-ukon-add').onclick = () => {
    sez.insertAdjacentHTML('beforeend', radekEditoru({ m:new Date().getMonth()+1, t:'', typ:'care' }));
    napojUkony();
  };
  napojUkony();
  d.querySelector('#e-zrus').onclick = zavri;
  d.querySelector('#e-ok').onclick = () => {
    const q = (x) => d.querySelector(x);
    const nazev = q('#e-nazev').value.trim();
    if (!nazev) { toast('Napiš název plodiny'); return; }
    const ukony = [];
    sez.querySelectorAll('.ur').forEach(r => {
      const t = r.querySelector('[data-ut]').value.trim(); if (!t) return;
      const typ = r.querySelector('[data-uk]').value;
      ukony.push({ m:Number(r.querySelector('[data-um]').value), t, typ, ic: IKONY_UKONU[typ]||'✂️' });
    });
    const data = { nazev, lat:q('#e-lat').value.trim(), emoji:q('#e-emoji').value.trim()||'🌱',
      kat:q('#e-kat').value.trim()||'Ostatní',
      sow:(c.sow||[]).slice().sort((a,b)=>a-b), plant:(c.plant||[]).slice().sort((a,b)=>a-b),
      harvest:(c.harvest||[]).slice().sort((a,b)=>a-b),
      hustota:Math.max(0.1, parseFloat(q('#e-hust').value)||9),
      rozestup:q('#e-roz').value.trim(), hloubka:q('#e-hl').value.trim(), slunce:q('#e-sl').value.trim(),
      pozor:q('#e-poz').value.trim(), rady:q('#e-rad').value.trim(),
      zaliv:q('#e-zal').value.trim(), sousedi:q('#e-sou').value.trim(), ukony };
    if (novy) {
      state.customCrops = (state.customCrops||[]).concat([Object.assign({ id:'u'+Date.now().toString(36) }, data)]);
    } else if (vlastni) {
      const i = state.customCrops.findIndex(x => x.id === id);
      if (i>=0) state.customCrops[i] = Object.assign({ id }, data);
    } else {
      state.cropEdits = state.cropEdits || {};
      state.cropEdits[id] = data;
    }
    save(); zavri(); kresliPlodiny(); kresliZahonky(); toast(novy ? 'Plodina přidána' : 'Uloženo');
  };
  const sm = d.querySelector('#e-smaz');
  if (sm) sm.onclick = () => potvrd('Smazat '+c.nazev+'?','Záhonky s ní zůstanou bez plodiny.', () => {
    state.customCrops = state.customCrops.filter(x => x.id !== id);
    beds().forEach(b => { if (b.cropId === id) b.cropId = null; });
    save(); zavri(); kresliPlodiny(); kresliZahonky(); toast('Smazáno');
  });
  const rs = d.querySelector('#e-reset');
  if (rs) rs.onclick = () => { delete state.cropEdits[id]; save(); zavri(); kresliPlodiny(); toast('Vráceno'); };
}
function radekEditoru(u) {
  return `<div class="ur" style="display:flex;gap:6px;margin-bottom:7px">
    <select data-um style="flex:0 0 76px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 6px;font-size:13px;font-weight:600">
      ${MESICE.map((n,i)=>`<option value="${i+1}" ${u.m===i+1?'selected':''}>${n.slice(0,3)}</option>`).join('')}</select>
    <select data-uk style="flex:0 0 96px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 6px;font-size:13px;font-weight:600">
      ${Object.keys(TYP_LABEL).map(k=>`<option value="${k}" ${u.typ===k?'selected':''}>${TYP_LABEL[k]}</option>`).join('')}</select>
    <input data-ut value="${esc(u.t)}" placeholder="Co udělat" style="flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:13.5px;font-weight:600">
    <button class="tag" data-ur style="flex:0 0 36px;justify-content:center">×</button></div>`;
}

/* --- obchod --- */
function dialogObchodu(id) {
  const o = id ? shopOf(id) : null;
  const d = dialog(`<h2>${o ? 'Upravit obchod' : 'Nový obchod'}</h2>
    <p class="lead">${o ? '' : 'E-shop, zahradnictví nebo soused, co dává sadbu.'}</p>
    <div class="field"><label for="o-n">Název</label><input id="o-n" value="${esc(o?o.nazev:'')}" placeholder="Zahradnictví u nádraží"></div>
    <div class="field"><label for="o-u">Odkaz nebo adresa</label><input id="o-u" value="${esc(o?o.url:'')}" placeholder="https://…"></div>
    <div class="field"><label for="o-i">Ikona</label><input id="o-i" value="${esc(o?(o.ico||'🛒'):'🛒')}" maxlength="3"></div>
    <div class="field"><label for="o-p">Poznámka</label><textarea id="o-p">${esc(o?o.pozn:'')}</textarea></div>
    <div class="dacts"><button class="btn sec" id="o-zrus">Zrušit</button><button class="btn" id="o-ok">Uložit</button></div>`);
  d.querySelector('#o-zrus').onclick = zavri;
  d.querySelector('#o-ok').onclick = () => {
    const nazev = d.querySelector('#o-n').value.trim();
    if (!nazev) { toast('Napiš název'); return; }
    let url = d.querySelector('#o-u').value.trim();
    if (url && !/^https?:\/\//i.test(url) && /\.[a-z]{2,}/i.test(url) && !/\s/.test(url)) url = 'https://' + url;
    const pozn = d.querySelector('#o-p').value.trim(), ico = d.querySelector('#o-i').value.trim() || '🛒';
    if (o) Object.assign(o, { nazev, url, pozn, ico });
    else {
      const nid = 'v' + (state.nextShop = (state.nextShop||1) + 1);
      state.shops[nid] = { id:nid, nazev, url, pozn, ico, vlastni:true };
    }
    save(); zavri(); kresliPlodiny(); toast('Uloženo');
  };
}

/* ============ START ============ */
load();
el('bar-mark').innerHTML = LOGO_KOZEL;
el('bar-theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const tmavy = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', tmavy ? 'light' : 'dark');
  state.theme = tmavy ? 'light' : 'dark'; save();
  if (state.tab === 'map') kresliPlatno();
};
if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => prepni(b.dataset.tab));
document.addEventListener('keydown', e => { if (e.key === 'Escape') zavri(); });
window.addEventListener('resize', () => { if (state.tab === 'map') { posadPanel(); scheduleRender(); } });
prepni(state.tab || 'map');
if (!state.view) requestAnimationFrame(() => requestAnimationFrame(() => fitView()));

</script>
