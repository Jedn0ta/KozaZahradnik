<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Koza Zahradník</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: mobilní aplikace s dolní navigací; plánovač je tečkovaný papír v metrech s panningem a zoomem */
:root {
  --bg: #f4f6f1;
  --surface: #ffffff;
  --surface-2: #eef1e9;
  --fg: #26301f;
  --fg-soft: #5d6b52;
  --fg-faint: #8a9680;
  --line: #d9e0cf;
  --accent: #5a8c3e;
  --accent-deep: #3f6a29;
  --accent-soft: #e4efd6;
  --soil: #a9794f;
  --soil-soft: #efe2d3;
  --sky: #5b9bc4;
  --sun: #e4a93c;
  --warn: #c7622d;
  --danger: #b23b3b;
  --paper: #fbfbf7;
  --dot: #b4c0a2;
  --grid5: #e7ecde;
  --house: #868b95;
  --house-fill: #dde0e6;
  --paved: #bcae97;
  --paved-fill: #ece5d8;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 10px rgba(40,56,28,.08);
  --shadow-up: 0 -2px 14px rgba(40,56,28,.07);
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Nunito Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1f17;
    --surface: #242b1f;
    --surface-2: #2d3626;
    --fg: #e8ecdf;
    --fg-soft: #a8b399;
    --fg-faint: #78836a;
    --line: #38412e;
    --accent: #7fb45c;
    --accent-deep: #9fcd7d;
    --accent-soft: #313d24;
    --soil: #c49468;
    --soil-soft: #3a3127;
    --sky: #6fb0d8;
    --sun: #e8b857;
    --warn: #e0824a;
    --danger: #e06a6a;
    --paper: #1e2419;
    --dot: #4a5740;
    --grid5: #2b3324;
    --house: #7f8794;
    --house-fill: #333a46;
    --paved: #8c7f6a;
    --paved-fill: #342e25;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
    --shadow-up: 0 -2px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1f17;
  --surface: #242b1f;
  --surface-2: #2d3626;
  --fg: #e8ecdf;
  --fg-soft: #a8b399;
  --fg-faint: #78836a;
  --line: #38412e;
  --accent: #7fb45c;
  --accent-deep: #9fcd7d;
  --accent-soft: #313d24;
  --soil: #c49468;
  --soil-soft: #3a3127;
  --sky: #6fb0d8;
  --sun: #e8b857;
  --warn: #e0824a;
  --danger: #e06a6a;
  --paper: #1e2419;
  --dot: #4a5740;
  --grid5: #2b3324;
  --house: #7f8794;
  --house-fill: #333a46;
  --paved: #8c7f6a;
  --paved-fill: #342e25;
  --shadow: 0 2px 12px rgba(0,0,0,.3);
  --shadow-up: 0 -2px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16.5px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
button { font-family: inherit; cursor: pointer; }

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

/* ---- Top bar ---- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-block: 12px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 10px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 25;
  background: var(--surface);
}
.topbar .mark {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--accent), var(--accent-deep));
  display: grid; place-items: center; overflow: hidden;
}
.topbar .mark svg { width: 25px; height: 25px; }
.topbar h1 { font-size: 18.5px; letter-spacing: -.015em; white-space: nowrap; }
.topbar .sub { font-size: 11.5px; color: var(--fg-faint); font-weight: 600; letter-spacing: .02em; }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 10px; display: grid; place-items: center; color: var(--fg-soft);
}
.icon-btn svg { width: 18px; height: 18px; }

/* ---- Screen area ---- */
main {
  flex: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 90px;
}
.screen { display: none; }
.screen.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen.active { animation: none; } }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px 12px; }
.section-head h2 { font-size: 25px; letter-spacing: -.015em; }
.section-head .count { font-size: 12.5px; color: var(--fg-faint); font-weight: 700; }
.lead { color: var(--fg-soft); font-size: 13.5px; margin: -6px 2px 16px; }

/* ---- Buttons ---- */
.btn {
  border: none; border-radius: 12px; padding: 15px 20px; font-weight: 800; font-size: 16px;
  background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: 7px;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.sm { padding: 12px 16px; font-size: 14.5px; }
.btn svg { width: 16px; height: 16px; }
.btn[disabled] { opacity: .45; pointer-events: none; }


/* ---- Mapove rozhrani pudorysu ---- */
.mapa {
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  margin-top: -16px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  position: relative;
}
#canvas {
  position: relative; height: clamp(340px, 58vh, 560px);
  touch-action: none; background-color: var(--paper); overflow: hidden;
}

.map-top {
  position: absolute; top: 12px; left: 12px; right: 12px; z-index: 3;
  display: flex; gap: 8px;
}
.fab-wide {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
  padding: 13px 17px; box-shadow: 0 3px 14px rgba(20,30,12,.16);
  font-weight: 700; font-size: 14.5px; color: var(--fg); text-align: left;
}
.fab-wide.on { border-color: var(--accent); color: var(--accent-deep); }
.fab-wide .fw-ico { font-size: 17px; flex: none; color: var(--accent); }
.fab-wide .fw-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.adresa-panel {
  position: absolute; top: 66px; left: 12px; right: 12px; z-index: 4;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px; box-shadow: 0 8px 26px rgba(20,30,12,.22);
}

.map-side {
  position: absolute; right: 12px; bottom: 14px; z-index: 3;
  display: flex; flex-direction: column; gap: 9px;
}
.fab {
  width: 48px; height: 48px; border-radius: 15px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font-size: 23px; font-weight: 800;
  display: grid; place-items: center; line-height: 1; box-shadow: 0 3px 12px rgba(20,30,12,.16);
}
.fab svg { width: 21px; height: 21px; }

.map-tools {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  padding: 11px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.map-tools::-webkit-scrollbar { display: none; }
.mt {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: none; border: none; padding: 4px 6px; min-width: 62px;
  color: var(--fg-faint); font-size: 11.5px; font-weight: 800;
}
.mt .mt-ico {
  width: 46px; height: 46px; border-radius: 15px; background: var(--surface-2);
  border: 1px solid var(--line); display: grid; place-items: center; color: var(--fg-soft);
}
.mt .mt-ico svg { width: 21px; height: 21px; }
.mt .mt-ico i.sw { width: 19px; height: 19px; border-radius: 5px; display: block; }
.mt.active { color: var(--accent-deep); }
.mt.active .mt-ico { background: var(--accent); border-color: var(--accent); color: #fff; }

.cv-load {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 13px;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  font-weight: 800; font-size: 14px; color: var(--fg-soft);
}
.spin {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3.5px solid var(--line); border-top-color: var(--accent);
  animation: sp .8s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
.cv-empty .ce-ico { width: 60px; height: 60px; margin: 0 auto 10px; }
.cv-empty .ce-ico svg { width: 100%; height: 100%; image-rendering: pixelated; }

.parcel-pick {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 13px; margin-top: 14px;
}
.parcel-pick .pp-head { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-faint); margin-bottom: 10px; }
.pp-list { display: flex; gap: 8px; flex-wrap: wrap; }
.pp {
  border: 2px solid var(--line); background: var(--bg); border-radius: 13px;
  padding: 10px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
}
.pp.on { border-color: var(--accent); background: var(--accent-soft); }
.pp .pp-no { font-weight: 800; font-size: 15px; color: var(--fg); }
.pp .pp-m { font-size: 11.5px; font-weight: 700; color: var(--fg-faint); }
.pp.on .pp-m { color: var(--accent-deep); }
.pp-note { font-size: 12px; color: var(--fg-faint); margin: 10px 2px 0; }

.stat-row { display: flex; gap: 8px; margin-top: 14px; }
.map-hint { font-size: 13px; color: var(--fg-faint); margin: 12px 2px 0; line-height: 1.5; }

/* ---- Plánovač (starší části) ---- */
.addr-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px; margin-bottom: 12px;
}
.addr-row { display: flex; gap: 8px; }
.addr-row input {
  flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px;
}
.addr-row input::placeholder { color: var(--fg-faint); }
.addr-note { font-size: 11.5px; color: var(--fg-faint); margin: 8px 2px 0; line-height: 1.45; }

.toolrow { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 7px; margin-bottom: 9px; scrollbar-width: none; }
.toolrow::-webkit-scrollbar { display: none; }
.tool {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg-soft);
  border-radius: 12px; padding: 12px 16px; font-weight: 800; font-size: 14.5px;
  display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; flex: none;
}
.tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tool svg { width: 15px; height: 15px; }
.tool i.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }

#cv-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cv-empty {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: 24px; pointer-events: none;
}
.cv-empty div { max-width: 270px; }
.cv-empty .ce-ico { font-size: 34px; margin-bottom: 8px; }
.cv-empty h3 { font-size: 16px; margin-bottom: 5px; }
.cv-empty p { font-size: 13px; color: var(--fg-soft); margin: 0; }
.scalebar {
  position: absolute; left: 10px; bottom: 10px; pointer-events: none;
  font-size: 10.5px; font-weight: 800; color: var(--fg-soft);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  padding: 4px 7px; border-radius: 7px; display: flex; align-items: flex-end; gap: 7px;
}
.scalebar .bar { height: 7px; border-left: 2px solid var(--fg-soft); border-right: 2px solid var(--fg-soft); border-bottom: 2px solid var(--fg-soft); }
.stat { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; }
.stat .s-val { font-family: var(--font-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .s-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--fg-faint); margin-top: 1px; }
.actrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
.selbar {
  display: flex; align-items: center; gap: 10px; margin-top: 11px;
  background: var(--surface); border: 1px solid var(--accent); border-left-width: 4px;
  border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 10px 11px;
}
.selbar .sl-ico { font-size: 20px; flex: none; }
.selbar .sl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.selbar .sl-name { font-weight: 800; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selbar .sl-meta { font-size: 11.5px; color: var(--fg-faint); font-weight: 700; }
.hint { font-size: 12.5px; color: var(--fg-faint); margin: 11px 2px 0; line-height: 1.5; }

/* ---- Záhonky ---- */
.bed-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
}
.bed-card .bc-head { display: flex; align-items: center; gap: 12px; }
.mini-wrap { flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 3px; line-height: 0; display: grid; place-items: center; width: 80px; height: 80px; }
.mini { display: block; }
.bed-card .swatch { width: 32px; height: 32px; border-radius: 8px; background: var(--soil); display: grid; place-items: center; font-size: 17px; flex: none; }
.bed-card .swatch.planted { background: var(--accent-soft); }
.bed-card h3 { font-size: 19px; }
.bed-card .bc-meta { font-size: 12px; color: var(--fg-faint); font-weight: 600; }
.bed-card .bc-crop { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; flex-wrap: wrap; }
.bed-card .bc-crop.empty { color: var(--fg-faint); }
.bed-card .bc-actions { display: flex; gap: 8px; margin-top: 10px; }
.photo-strip {
  display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin: -14px -14px 12px; padding: 0 14px; scrollbar-width: none;
}
.photo-strip::-webkit-scrollbar { display: none; }
.photo-strip .ps-item {
  margin: 0; flex: none; scroll-snap-align: start; position: relative;
  width: 86%; max-width: 420px; border-radius: 0 0 10px 10px; overflow: hidden;
}
.photo-strip .ps-item:first-child { border-radius: 13px 13px 10px 10px; }
.photo-strip .ps-item img { width: 100%; height: 168px; object-fit: cover; display: block; }
.photo-strip .ps-item figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to top, rgba(0,0,0,.72), transparent);
  color: #fff; font-size: 11.5px; font-weight: 700; padding: 18px 10px 7px;
}
.photo-strip .ps-add {
  flex: none; width: 72px; align-self: stretch; border: 1.5px dashed var(--line);
  background: var(--bg); color: var(--fg-faint); border-radius: 10px; font-size: 24px;
}
.photo-strip-add {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  margin-bottom: 12px; padding: 13px; border: 1.5px dashed var(--line); background: var(--bg);
  border-radius: var(--radius-sm); color: var(--fg-soft); font-weight: 700; font-size: 13.5px;
}
.photo-strip-add .psa-ico { font-size: 17px; }
.foto-row {
  display: flex; gap: 10px; align-items: center; background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px; margin-bottom: 7px;
}
.foto-row img { width: 72px; height: 54px; object-fit: cover; border-radius: 7px; flex: none; }
.foto-row .fr-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.foto-row .fr-date { font-weight: 800; font-size: 13px; }
.foto-row .fr-rel { font-size: 11.5px; color: var(--fg-faint); font-weight: 700; }
.bc-quick { display: flex; gap: 8px; margin-top: 10px; }
.qa-ico { display: inline-flex; width: 30px; height: 30px; flex: none; }
.qa-ico svg { width: 100%; height: 100%; }
.bc-water { display: flex; align-items: center; gap: 6px; }
.bw-ico { display: inline-flex; width: 15px; height: 15px; flex: none; }
.bw-ico svg { width: 100%; height: 100%; }
.rostliny {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px;
}
.r-btn {
  width: 52px; height: 52px; flex: none; border-radius: 13px; border: 2px solid var(--accent);
  background: var(--surface); color: var(--accent-deep); font-size: 26px; font-weight: 800; line-height: 1;
  display: grid; place-items: center;
}
.r-btn:active { transform: translateY(1px); }
.r-val { font-size: 15px; font-variant-numeric: tabular-nums; flex: 1; text-align: center; }
.r-val strong { font-size: 26px; font-family: var(--font-display); display: block; }
.r-note { font-size: 11px; color: var(--fg-faint); font-weight: 700; margin-left: auto; }
.r-reset { margin-left: auto; border: none; background: none; color: var(--accent-deep); font-size: 11.5px; font-weight: 800; text-decoration: underline; }
.cc-cam {
  position: absolute; right: 7px; bottom: 7px; font-size: 13px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  border-radius: 7px; padding: 3px 6px; line-height: 1;
}
.crop-card .cc-top { display: block; }
.crop-card .cc-top svg { width: 100%; height: 100%; display: block; }
.art-emoji { display: grid; place-items: center; width: 100%; height: 100%; font-size: 40px; }
.pix { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.bc-sprite {
  width: 58px; height: 58px; flex: none; border-radius: 13px; overflow: hidden;
  background: var(--accent-soft); border: 1px solid var(--line); padding: 3px;
}
.odznaky { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.odznak {
  display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px;
  font-size: 13px; font-weight: 700; color: var(--fg-soft);
}
.odznak.zly { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.o-ico { display: inline-flex; width: 18px; height: 18px; flex: none; }
.cc-cam { width: 26px; height: 26px; padding: 3px; display: grid; place-items: center; }
.psa-ico { display: inline-flex; width: 26px; height: 26px; }
.crop-card .cc-top { padding: 8px; }
.crop-card .cc-top .pix { width: 100%; height: 100%; }
.detail-hero .pix { width: auto; height: 100%; margin: 0 auto; }
.detail-hero { position: relative; }
.detail-hero svg { width: 100%; height: 100%; display: block; }
.qa {
  flex: 1; border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-deep);
  border-radius: 14px; padding: 16px 8px; font-weight: 800; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 62px;
}
.qa:active { transform: translateY(1px); }
.loc-pick { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 11px 12px 8px; margin-bottom: 13px; }
.live-ok { font-size: 12px; font-weight: 700; color: var(--accent-deep); line-height: 1.45; }

function pixSvg(id) {
  const s = PIX[id];
  if (!s) return '';
  let r = '';
  for (let y = 0; y < s.d.length; y++) {
    const row = s.d[y];
    for (let x = 0; x < row.length; x++) {
      const c = s.p[row[x]];
      if (c) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`;
    }
  }
  return `<svg class="pix" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

/* ============ GEOMETRIE ============
   Obrys zahrady je polygon v metrech, s vrcholy, ktere se daji tahat.
   Prvky (zahon, dum, cesta) jsou mnoziny ctverecku 1 x 1 m, takze muzou mit
   i nepravidelny tvar a daji se po ctverecku pridavat i ubirat. */
function polyArea(pts) {
  if (!pts || pts.length < 3) return 0;
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s) / 2;
}
function pointInPoly(x, y, pts) {
  if (!pts || pts.length < 3) return true;
  let inside = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi) * (y-yi) / (yj-yi) + xi)) inside = !inside;
  }
  return inside;
}
function bbox(pts) {
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return { x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys) };
}

/* --- ctverecky --- */
const ck = (x, y) => x + ',' + y;
const cxy = (k) => { const p = k.split(','); return [ +p[0], +p[1] ]; };
const cellsOf = (it) => (it && it.cells) || [];
const itArea = (it) => cellsOf(it).length;
function itBBox(it) {
  const cs = cellsOf(it);
  if (!cs.length) return { x0:0, y0:0, x1:0, y1:0, w:0, h:0 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const k of cs) {
    const c = cxy(k);
    if (c[0] < x0) x0 = c[0];
    if (c[1] < y0) y0 = c[1];
    if (c[0]+1 > x1) x1 = c[0]+1;
    if (c[1]+1 > y1) y1 = c[1]+1;
  }
  return { x0, y0, x1, y1, w: x1-x0, h: y1-y0 };
}
const isRect = (it) => { const b = itBBox(it); return itArea(it) === b.w * b.h; };
function rectKeys(x0, y0, x1, y1) {
  const out = [];
  for (let y = Math.min(y0,y1); y < Math.max(y0,y1); y++)
    for (let x = Math.min(x0,x1); x < Math.max(x0,x1); x++) out.push(ck(x,y));
  return out;
}
function ownerAt(key) {
  for (const i of items()) if ((i.cells||[]).indexOf(key) >= 0) return i;
  return null;
}
function pruneEmpty() {
  Object.keys(state.items).forEach(id => {
    const it = state.items[id];
    if (!it.cells || !it.cells.length) {
      delete state.items[id];
      if (state.sel === id) state.sel = null;
    }
  });
}
/* Pridani ctverecku jednomu prvku. Co patrilo jinemu, se mu odebere. */
function addCells(it, keys) {
  const mine = new Set(it.cells || []);
  keys.forEach(k => {
    const o = ownerAt(k);
    if (o && o.id !== it.id) o.cells = o.cells.filter(x => x !== k);
    mine.add(k);
  });
  it.cells = [...mine];
  pruneEmpty();
}
function removeCells(keys) {
  keys.forEach(k => { const o = ownerAt(k); if (o) o.cells = o.cells.filter(x => x !== k); });
  pruneEmpty();
}
function moveItemBy(it, dx, dy) {
  const keys = cellsOf(it).map(k => { const c = cxy(k); return ck(c[0]+dx, c[1]+dy); });
  it.cells = [];
  addCells(it, keys);
}
/* Roztahovani za uchyt: nova rada vznikne kopii krajni rady, takze to funguje
   i u nepravidelnych tvaru. Zmensovani krajni radu odebere. */
function stretch(it, side, grow) {
  const b = itBBox(it);
  const cs = cellsOf(it).map(cxy);
  if (grow) {
    let nk = [];
    if (side === 'E') nk = cs.filter(p => p[0] === b.x1-1).map(p => ck(b.x1, p[1]));
    if (side === 'W') nk = cs.filter(p => p[0] === b.x0).map(p => ck(b.x0-1, p[1]));
    if (side === 'S') nk = cs.filter(p => p[1] === b.y1-1).map(p => ck(p[0], b.y1));
    if (side === 'N') nk = cs.filter(p => p[1] === b.y0).map(p => ck(p[0], b.y0-1));
    if (!nk.length) return false;
    addCells(it, nk);
    return true;
  }
  if ((side === 'E' || side === 'W') && b.w <= 1) return false;
  if ((side === 'N' || side === 'S') && b.h <= 1) return false;
  let rm = [];
  if (side === 'E') rm = cs.filter(p => p[0] === b.x1-1);
  if (side === 'W') rm = cs.filter(p => p[0] === b.x0);
  if (side === 'S') rm = cs.filter(p => p[1] === b.y1-1);
  if (side === 'N') rm = cs.filter(p => p[1] === b.y0);
  const rmSet = new Set(rm.map(p => ck(p[0], p[1])));
  const left = cellsOf(it).filter(k => !rmSet.has(k));
  if (!left.length) return false;
  it.cells = left;
  return true;
}
function reshapeRect(it, w, h) {
  const b = itBBox(it);
  it.cells = [];
  addCells(it, rectKeys(b.x0, b.y0, b.x0 + Math.max(1, Math.round(w)), b.y0 + Math.max(1, Math.round(h))));
}
/* Prvek je v zahrade, kdyz lezi v obrysu nebo na nektere vedlejsi parcele */
function itemInside(it) {
  if (!state.outlineDone || state.outline.length < 3) return true;
  const plochy = [state.outline].concat(state.vedlejsi || []);
  const cs = cellsOf(it);
  if (!cs.length) return true;
  let uvnitr = 0;
  cs.forEach(k => {
    const c = cxy(k), x = c[0]+0.5, y = c[1]+0.5;
    if (plochy.some(poly => poly.length >= 3 && pointInPoly(x, y, poly))) uvnitr++;
  });
  return uvnitr / cs.length >= 0.6;
}
/* Hrany unie ctverecku: kreslime linku jen tam, kde vedle neni dalsi ctverecek */
function edgeSegments(it) {
  const s = new Set(cellsOf(it));
  const segs = [];
  s.forEach(k => {
    const c = cxy(k), x = c[0], y = c[1];
    if (!s.has(ck(x, y-1))) segs.push([x, y, x+1, y]);
    if (!s.has(ck(x, y+1))) segs.push([x, y+1, x+1, y+1]);
    if (!s.has(ck(x-1, y))) segs.push([x, y, x, y+1]);
    if (!s.has(ck(x+1, y))) segs.push([x+1, y, x+1, y+1]);
  });
  return segs;
}

/* ---- ziva predpoved z Open-Meteo ----
   Bez API klice, data CC BY 4.0. V publikovanem artefaktu je sitovy pozadavek
   zakazany, takze to tise selze a appka pouzije ulozena data. Kdekoli jinde
   (vlastni hosting, WebView v aplikaci) to bezi naplno. */
const DNY_KR = ['Ne','Po','Út','St','Čt','Pá','So'];
let liveStav = { stav:'idle', chyba:'' };

async function nactiZivePocasi(dotaz) {
  liveStav = { stav:'nacitam', chyba:'' };
  renderWeather();
  try {
    const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=cs&format=json&name='
      + encodeURIComponent(dotaz));
    if (!g.ok) throw new Error('geo ' + g.status);
    const gj = await g.json();
    if (!gj.results || !gj.results.length) {
      liveStav = { stav:'nenalezeno', chyba:'Obec „' + dotaz + '" jsem nenašel. Zkus název bez čísla popisného.' };
      renderWeather(); return;
    }
    const m = gj.results[0];
    const f = await fetch('https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + m.latitude + '&longitude=' + m.longitude
      + '&current=temperature_2m'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum'
      + '&timezone=auto&forecast_days=6');
    if (!f.ok) throw new Error('fc ' + f.status);
    const fj = await f.json();
    const d = fj.daily;
    const dny = d.time.slice(0,6).map((iso,i) => {
      const dt = new Date(iso + 'T12:00:00');
      return {
        d: DNY_KR[dt.getDay()],

function zalivkaStav() {
  const w = lok(), dny = w.dny, out = [];

  } else if (dny.slice(1,4).every(d => maMm ? d.mm < 1.5 : d.p < 25)) {

  }
  // nejdele nezality zahon, kdyz se neblizi dest
  if (dny.slice(0,4).every(d => (d.mm != null ? d.mm < 2 : d.p < 30))) {
    const poradi = beds().filter(x => crop(x.cropId)).map(x => {
      const lw = lastWater(x);
      return { b:x, d: lw ? (dnuOd(lw) == null ? 999 : dnuOd(lw)) : 999 };
    }).sort((x,y) => y.d - x.d);
    if (poradi.length && poradi[0].d >= 3) {
      const n = poradi[0];
      out.push({ alert:true, ic:'\ud83d\udebf', title:`Nejd\u00e9le bez vody: ${n.b.nazev}`,
        sub: n.d > 900

          : `Naposledy zalito p\u0159ed ${n.d} dny. Po zal\u00e9v\u00e1n\u00ed klepni na Zalito u z\u00e1honku.` });
    }
  }
  const dest = dny.slice(2).find(d => (d.mm != null && d.mm >= 2) || d.p >= 50);
  if (dest) {
    out.push({ alert:false, ic:'\ud83c\udf27\ufe0f', title:`D\u00e9\u0161\u0165 p\u0159ijde ${dest.d} ${dest.datum}`,
      sub:`${dest.mm != null && dest.mm > 0 ? fmtN(dest.mm) + ' mm' : dest.p + ' % \u0161ance'} sr\u00e1\u017eek. A\u017e do t\u00e9 doby po\u010d\u00edtej se zal\u00e9v\u00e1n\u00edm.` });
  }
  const mraz = dny.filter(d => d.min <= 4);
  if (mraz.length) {
    const nej = mraz.reduce((x,y) => x.min < y.min ? x : y);
    out.push({ alert:true, ic:'\ud83e\udd76', title:`Chladn\u00e9 noci, a\u017e ${fmtN(nej.min)} \u00b0C`,
      sub:`${mraz.map(d=>d.d).join(', ')} spadne no\u010dn\u00ed teplota k\u00a0nule. Hroz\u00ed p\u0159\u00edzemn\u00ed mraz\u00edk \u2014 zakryj citliv\u00e9 plodiny netkanou textili\u00ed a d\u00fdn\u011b rad\u011bji sklid\u00ed.` });
  }
  const skok = dny[0].max - dny[1].max;
  if (skok >= 7) {
    out.push({ alert:true, ic:'\ud83d\udcc9', title:`Z\u00edtra ochlazen\u00ed o ${Math.round(skok)} \u00b0C`,
      sub:`Dnes ${fmtN(dny[0].max)} \u00b0C, z\u00edtra u\u017e jen ${fmtN(dny[1].max)} \u00b0C. Co chce\u0161 sklidit v teple, sklid\u00ed dnes.` });
  }
  const m = new Date().getMonth()+1;
  const sklizen = beds().filter(x => { const c = crop(x.cropId); return c && c.harvest.includes(m); });
  if (sklizen.length) {
    out.push({ alert:false, ic:'\ud83e\uddfa', title:`${sklizen.length}\u00d7 plodina ke skliznI`.replace('skliznI','sklizni'),
      sub: sklizen.map(x=>crop(x.cropId).nazev).join(', ') + ' \u2014 tento m\u011bs\u00edc je \u010das skl\u00edzet.' });
  }
  return out;
}

function miniPlan(hiId, size) {
  const all = [];
  if (state.outline.length >= 2) all.push(...state.outline);
  items().forEach(i => { const b = itBBox(i); all.push([b.x0,b.y0],[b.x1,b.y1]); });
  if (!all.length) return '';
  const g = bbox(all);
  const gw = Math.max(g.x1-g.x0, 1), gh = Math.max(g.y1-g.y0, 1);
  const it = state.items[hiId];

  // Okno vyrezu: kolem zahonu nechame kontext podle jeho velikosti, ne celou zahradu
  let side, cx, cy, crop_ = false;
  if (it && itArea(it)) {
    const b = itBBox(it);
    const pad = clamp(Math.max(b.w, b.h) * 0.75, 3, 10);
    side = Math.max(b.w, b.h) + pad*2;
    cx = (b.x0+b.x1)/2; cy = (b.y0+b.y1)/2;
    if (side >= Math.max(gw, gh)) {
      side = Math.max(gw, gh) + 2; cx = (g.x0+g.x1)/2; cy = (g.y0+g.y1)/2;
    } else {
      crop_ = true;
      if (side <= gw) cx = clamp(cx, g.x0 + side/2, g.x1 - side/2);
      if (side <= gh) cy = clamp(cy, g.y0 + side/2, g.y1 - side/2);
    }
  } else {
    side = Math.max(gw, gh) + 2; cx = (g.x0+g.x1)/2; cy = (g.y0+g.y1)/2;
  }
  const wx0 = cx - side/2, wy0 = cy - side/2;
  const s = size / side;
  const X = (x) => ((x-wx0)*s).toFixed(1), Y = (y) => ((y-wy0)*s).toFixed(1);

  const parts = [`<rect width="${size}" height="${size}" fill="var(--paper)"/>`];
  if (state.outlineDone && state.outline.length >= 3) {
    parts.push(`<polygon points="${state.outline.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>`);
  }
  const zo = { paved:0, house:1, bed:2 }, ov = (s+0.5).toFixed(1);
  // kreslime jen to, co do vyrezu zasahuje
  items().filter(i => {
    const b = itBBox(i);
    return b.x1 > wx0 && b.x0 < wx0+side && b.y1 > wy0 && b.y0 < wy0+side;
  }).sort((x,y)=>(zo[x.typ]||0)-(zo[y.typ]||0)).forEach(i => {
    const hi = i.id === hiId, d = PRVKY[i.typ] || PRVKY.bed;
    const c = crop(i.cropId);
    let fp = '';
    cellsOf(i).forEach(k => { const q = cxy(k); fp += `M${X(q[0])} ${Y(q[1])}h${ov}v${ov}h-${ov}Z`; });
    const fill = hi ? 'var(--warn)' : ((i.typ === 'bed' && c) ? 'var(--accent)' : d.fill);
    parts.push(`<path d="${fp}" fill="${fill}" fill-opacity="${hi?1:0.8}"/>`);
    if (!hi) parts.push(`<path d="${fp}" fill="none" stroke="${d.line}" stroke-width="0.7" opacity=".5"/>`);
  });
  if (it && itArea(it)) {
    const b = itBBox(it);
    parts.push(`<rect x="${X(b.x0)}" y="${Y(b.y0)}" width="${(b.w*s).toFixed(1)}" height="${(b.h*s).toFixed(1)}" fill="none" stroke="var(--warn)" stroke-width="2.4" rx="2"/>`);
  }
  if (crop_) {
    parts.push(`<text x="${size-3}" y="${size-3}" text-anchor="end" font-size="7.5" font-weight="800" fill="var(--fg-faint)">${Math.round(side)} m</text>`);
  }
  return `<svg class="mini" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-label="Poloha v zahradě">${parts.join('')}</svg>`;
}

/* Rozdil v kalendarnich dnech, ne v hodinach: dnesni zapis musi dat 0 */
function dnuOd(datum) {

const CUZK_CP  = 'https://services.cuzk.cz/wfs/inspire-cp-wfs.asp';
const CUZK_CPX = 'https://services.cuzk.cz/wfs/inspire-CPX-wfs.asp';

/* V aplikaci jde pozadavek pres nativni most, ktery obchazi CORS. */
async function httpGet(url, accept) {
  if (window.KozaNative && typeof window.KozaNative.get === 'function') {
    const r = window.KozaNative.get(url, accept || '');
    if (r == null || r === '') throw new Error('prázdná odpověď');
    if (r.indexOf('KOZA_ERR:') === 0) throw new Error(r.slice(9));
    return r;
  }
  const res = await fetch(url, accept ? { headers: { 'Accept': accept } } : undefined);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

async function geokoduj(dotaz) {
  const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cz&q='
    + encodeURIComponent(dotaz);
  const j = JSON.parse(await httpGet(u, 'application/json'));
  if (!j || !j.length) return null;
  return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon), nazev: j[0].display_name };
}

/* Chyba je jen tehdy, kdyz je ExceptionReport korenem dokumentu. Sluzba totiz
   k platne odpovedi pripojuje truncatedResponse s ExceptionReport uvnitr. */
function chybaSluzby(xml) {
  if (!xml) return 'prázdná odpověď';
  let doc;
  try { doc = new DOMParser().parseFromString(xml, 'application/xml'); }
  catch (q) { return 'odpověď nejde přečíst'; }
  const root = doc.documentElement;
  if (!root || doc.querySelector('parsererror')) return 'odpověď nejde přečíst';
  if (root.localName !== 'ExceptionReport') return null;
  const t = root.getElementsByTagNameNS('*', 'ExceptionText');
  if (t.length) return (t[0].textContent || '').trim().slice(0, 200);
  return 'služba vrátila chybové hlášení';
}

/* Souradnice ze znacky: poradi os overujeme podle rozsahu CR */
function paryZTextu(txt) {
  const c = (txt || '').trim().split(/\s+/).map(Number);
  const out = [];
  for (let k = 0; k + 1 < c.length; k += 2) {
    const a = c[k], b = c[k+1];
    const ok = (a > 48 && a < 52 && b > 12 && b < 19);
    out.push(ok ? [a, b] : [b, a]);
  }
  return out;
}

/* Parcely: pole polygonu, kazdy { body:[[lat,lon]], cislo, vymera } */
function parsujParcely(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const cleny = doc.getElementsByTagNameNS('*', 'CadastralParcel');
  for (let i = 0; i < cleny.length; i++) {
    const el = cleny[i];
    const pl = el.getElementsByTagNameNS('*', 'posList');
    if (!pl.length) continue;
    const body = paryZTextu(pl[0].textContent);
    if (body.length < 4) continue;
    const lab = el.getElementsByTagNameNS('*', 'label');
    const ar = el.getElementsByTagNameNS('*', 'areaValue');
    out.push({
      body,
      cislo: lab.length ? (lab[0].textContent || '').trim() : '',
      vymera: ar.length ? parseFloat(ar[0].textContent) : null,
    });
  }
  return out;
}

/* Budovy: jen poloha symbolu a natoceni, pudorys sluzba nedava */
function parsujBudovy(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const cleny = doc.getElementsByTagNameNS('*', 'Building');
  for (let i = 0; i < cleny.length; i++) {
    const pos = cleny[i].getElementsByTagNameNS('*', 'pos');
    if (!pos.length) continue;
    const p = paryZTextu(pos[0].textContent);
    if (!p.length) continue;
    const rot = cleny[i].getElementsByTagNameNS('*', 'rotation');
    out.push({ lat: p[0][0], lon: p[0][1], uhel: rot.length ? parseFloat(rot[0].textContent) || 0 : 0 });
  }
  return out;
}

const vPolygonu = (lat, lon, body) => pointInPoly(lon, lat, body.map(q => [q[1], q[0]]));

/* Sousedni parcely sdili hranu, ale ne vzdy i lomovy bod. Proto meríme
   vzdalenost vrcholu jedne parcely od hran te druhe. */
function vzdalenostOdUsecky(p, a, b) {
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const L = dx*dx + dy*dy;
  const t = L ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L)) : 0;
  return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy));
}
function sousedi(a, b, tol) {
  tol = tol || 1.0;
  const lat0 = a[0][0];
  const naM = (p) => [ (p[1]) * 111320 * Math.cos(lat0*Math.PI/180), p[0] * 110540 ];
  const A = a.map(naM), B = b.map(naM);
  for (const dvojice of [[A,B],[B,A]]) {
    const X = dvojice[0], Y = dvojice[1];
    for (const q of X) {
      for (let i = 0; i < Y.length; i++) {
        if (vzdalenostOdUsecky(q, Y[i], Y[(i+1) % Y.length]) < tol) return true;
      }
    }
  }
  return false;
}
/* 23/1 a 23/2 jsou dily tehoz puvodniho pozemku, obvykle jednoho vlastnika */
const kmenCisla = (c) => String(c || '').split('/')[0].trim();

/* Natoceni: najdeme smer, ve kterem ma parcela nejmensi opsany obdelnik,
   a postavime ji na vysku - na telefonu se tak vyuzije cela obrazovka. */
function hezkeNatoceni(body) {
  let nej = { uhel: 0, plocha: Infinity, w: 0, h: 0 };
  for (let i = 0; i < body.length; i++) {
    const a = body[i], b = body[(i+1) % body.length];
    const uhel = Math.atan2(b[1]-a[1], b[0]-a[0]);
    const ot = body.map(p => otoc(p, -uhel));
    const xs = ot.map(p=>p[0]), ys = ot.map(p=>p[1]);
    const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
    if (w*h < nej.plocha) nej = { uhel, plocha: w*h, w, h };
  }
  // naPlan otaci o +uhel, merili jsme o -uhel; na vysku = delsi strana svisle
  return nej.w > nej.h ? -nej.uhel + Math.PI/2 : -nej.uhel;
}
const otoc = (p, u) => [ p[0]*Math.cos(u) - p[1]*Math.sin(u), p[0]*Math.sin(u) + p[1]*Math.cos(u) ];

/* Prevod stupnu na metry kolem referencniho bodu, pak natoceni a posun do pocatku */
function naPlan(body, lat0, lon0, uhel) {
  const mLat = 110540, mLon = 111320 * Math.cos(lat0 * Math.PI / 180);
  let m = body.map(p => [ (p[1]-lon0)*mLon, -(p[0]-lat0)*mLat ]);
  if (uhel) m = m.map(p => otoc(p, uhel));
  return m;
}
function doPocatku(sada) {
  const vse = [].concat(...sada);
  const x0 = Math.min(...vse.map(p=>p[0])), y0 = Math.min(...vse.map(p=>p[1]));
  return sada.map(poly => poly.map(p => [
    Math.round((p[0]-x0)*10)/10, Math.round((p[1]-y0)*10)/10 ]));
}
function bezDuplicitnihoKonce(m) {
  if (m.length > 2) {
    const a = m[0], b = m[m.length-1];
    if (Math.abs(a[0]-b[0]) < 0.2 && Math.abs(a[1]-b[1]) < 0.2) m.pop();
  }
  return m;
}

let katStav = { stav:'idle', text:'' };

async function nactiParcelu(dotaz) {
  katStav = { stav:'hledam', text:'Hledám adresu…' };
  renderGarden();
  const m = await geokoduj(dotaz);
  if (!m) {
    katStav = { stav:'chyba', text:'Adresu „' + dotaz + '" jsem nenašel. Zkus doplnit PSČ nebo obec.' };
    renderGarden(); return;
  }

  katStav = { stav:'hledam', text:'Stahuji parcely z katastru…' };
  renderGarden();
  // asi 90 x 90 m. Vetsi vyrez v zastavbe narazi na strop poctu parcel
  // a hledana zahrada se do odpovedi vubec nedostane.
  const d = 0.00042;
  const dLon = d / Math.cos(m.lat * Math.PI / 180);
  const bbox = [ m.lat-d, m.lon-dLon, m.lat+d, m.lon+dLon ].map(x=>x.toFixed(6)).join(',');
  const uP = CUZK_CP + '?service=WFS&version=2.0.0&request=GetFeature'
    + '&typenames=' + encodeURIComponent('cp:CadastralParcel')
    + '&namespaces=' + encodeURIComponent('xmlns(cp,' + CP_NS + ')')
    + '&count=60&srsName=' + encodeURIComponent(CRS84)
    + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
  const xmlP = await httpGet(uP, 'application/xml');
  const chyba = chybaSluzby(xmlP);
  if (chyba) { katStav = { stav:'chyba', text:'Katastr odmítl dotaz: ' + chyba }; renderGarden(); return; }
  const parcely = parsujParcely(xmlP);
  if (!parcely.length) {
    katStav = { stav:'chyba', text:'Katastr tu nenašel parcely. Může jít o území bez digitální mapy.' };
    renderGarden(); return;
  }

  // budovy jsou nepovinne: kdyz sluzba nedopovi, jedeme dal bez nich
  let budovy = [];
  try {
    const uB = CUZK_CPX + '?service=WFS&version=2.0.0&request=GetFeature'
      + '&typenames=' + encodeURIComponent('cp-ext:Building')
      + '&namespaces=' + encodeURIComponent('xmlns(cp-ext,' + CPX_NS + ')')
      + '&count=60&srsName=' + encodeURIComponent(CRS84)
      + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
    const xmlB = await httpGet(uB, 'application/xml');
    if (!chybaSluzby(xmlB)) budovy = parsujBudovy(xmlB);
  } catch (q) {}

  // ke kazde parcele poznamename, jestli na ni stoji budova
  parcely.forEach(p => {
    p.zastavena = budovy.some(b => vPolygonu(b.lat, b.lon, p.body));
    p.budovy = budovy.filter(b => vPolygonu(b.lat, b.lon, p.body));
  });

  const adresni = parcely.findIndex(p => vPolygonu(m.lat, m.lon, p.body));
  if (adresni < 0) {
    katStav = { stav:'chyba', text:'Adresu jsem našel, ale nepadla do žádné parcely. Zkus přesnější adresu.' };
    renderGarden(); return;
  }

  // Sousedni parcela bez budovy muze byt zahrada, ale taky ulice nebo
  // verejna zelen. Rozhoduje kmen cisla: 23/2 patri k domu na 23/1.
  const adr = parcely[adresni];
  const adrKmen = kmenCisla(adr.cislo);
  parcely.forEach((q, i) => {
    q.sousedi = i === adresni || sousedi(q.body, adr.body);
    q.stejnyKmen = kmenCisla(q.cislo) === adrKmen;
  });
  const vybrane = new Set([adresni]);
  parcely.forEach((q, i) => {
    if (i === adresni || q.zastavena || !q.sousedi) return;
    if (q.stejnyKmen) vybrane.add(i);
  });
  // kdyz se podle cisla nic nenaslo, vezmeme jedinou rozumne velkou sousedni
  if (vybrane.size === 1) {
    const kand = parcely.map((q,i)=>({q,i}))
      .filter(o => o.i !== adresni && !o.q.zastavena && o.q.sousedi
                   && o.q.vymera && o.q.vymera <= Math.max(1200, (adr.vymera||300) * 4));
    if (kand.length === 1) vybrane.add(kand[0].i);
  }

  const nabidka = parcely.map((q,i) => ({ q, i }))
    .filter(o => o.i === adresni || (o.q.sousedi && (!o.q.vymera || o.q.vymera < 8000)))
    .sort((x,y) => (x.i === adresni ? -1 : y.i === adresni ? 1
      : (y.q.stejnyKmen - x.q.stejnyKmen) || ((x.q.vymera||0) - (y.q.vymera||0))));
  state.katParcely = nabidka.map(o => ({
    cislo: o.q.cislo, vymera: o.q.vymera, zastavena: o.q.zastavena,
    stejnyKmen: o.q.stejnyKmen, adresni: o.i === adresni,
    body: o.q.body, budovy: o.q.budovy, vybrana: vybrane.has(o.i),
  }));
  state.katStred = { lat: m.lat, lon: m.lon };
  state.katObec = (m.nazev || '').split(',').slice(0,3).join(',').trim();
  state.adresa = dotaz;
  postavZahradu();
  katStav = { stav:'vyber', text:'' };
  state.panelAdresa = false;
  save(); renderGarden();
  requestAnimationFrame(() => fitView());
}

/* Z vybranych parcel postavi novou prazdnou zahradu: obrys, dum, zadne zahony */
function postavZahradu() {
  const vyb = (state.katParcely || []).filter(p => p.vybrana);
  if (!vyb.length) return;
  const s = state.katStred;

  // natoceni pocitame z nejvetsi vybrane parcely
  const hlavni = vyb.slice().sort((a,b) => plochaStupnu(b.body) - plochaStupnu(a.body))[0];
  const uhel = hezkeNatoceni(naPlan(hlavni.body, s.lat, s.lon, 0));

  const sada = vyb.map(p => naPlan(p.body, s.lat, s.lon, uhel));
  const budovyBody = [];
  vyb.forEach(p => (p.budovy || []).forEach(b => {
    budovyBody.push(naPlan([[b.lat, b.lon]], s.lat, s.lon, uhel)[0]);
  }));
  const vsechno = doPocatku(sada.concat(budovyBody.map(b => [b])));
  const obrysy = vsechno.slice(0, sada.length).map(bezDuplicitnihoKonce);
  const domy = vsechno.slice(sada.length).map(a => a[0]);

  // obrysem je nejvetsi parcela bez budovy, tedy zahrada. Zastavene az potom.
  const zast = vyb.map(p => !!p.zastavena);
  const poradi = obrysy.map((o,i) => ({ o, z: zast[i] }));
  poradi.sort((a,b) => (a.z === b.z) ? polyArea(b.o) - polyArea(a.o) : (a.z ? 1 : -1));
  obrysy.length = 0;
  poradi.forEach(q => obrysy.push(q.o));
  state.outline = obrysy[0];
  state.outlineDone = true;
  state.vedlejsi = obrysy.slice(1);

  // nova zahrada: zadne zahony, jen dum podle katastru
  state.items = {};
  state.nextId = 1;
  state.sel = null; state.selVert = null;
  domy.forEach((d, i) => {
    const x = Math.max(0, Math.round(d[0]) - 3), y = Math.max(0, Math.round(d[1]) - 3);
    const id = 'p' + state.nextId++;
    state.items[id] = { id, typ:'house', cells: rectKeys(x, y, x+7, y+7),
      nazev: domy.length > 1 ? 'Dům ' + (i+1) : 'Dům',
      cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[], zalivka:[], rostliny:null };
  });
}
function plochaStupnu(body) {
  let s = 0;
  for (let i = 0; i < body.length; i++) {
    const a = body[i], b = body[(i+1) % body.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s)/2;
}

function nactiObrys() {
  const a = (el('addr-input').value || '').trim();
  const psc = ((el('psc-input') || {}).value || '').trim();
  if (!a) { toast('Napiš ulici a číslo popisné'); return; }
  state.adresa = a; state.psc = psc; save();
  nactiParcelu(psc ? a + ', ' + psc : a).catch(e => {
    katStav = { stav:'blokovano', text: String((e && e.message) || e) };
    renderGarden();
  });
}
function prepniParcelu(i) {
  const p = (state.katParcely || [])[i];
  if (!p) return;
  p.vybrana = !p.vybrana;
  if (!(state.katParcely || []).some(q => q.vybrana)) { p.vybrana = true; return; }
  postavZahradu();
  save(); renderGarden();
  requestAnimationFrame(() => fitView());
}
function ukazkovyObrys() {
  state.outline = [[0,0],[28,0],[28,30],[22,38],[0,38]];
  state.outlineDone = true; state.sel = null; state.selVert = null;
  state.vedlejsi = []; state.katParcely = null;
  state.items = {}; state.nextId = 1;
  const id = 'p' + state.nextId++;
  state.items[id] = { id, typ:'house', cells: rectKeys(2,2,13,11), nazev:'Dům',
    cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[], zalivka:[], rostliny:null };
  katStav = { stav:'ok', text:'Ukázková parcela 1040 m². Záhony si nakresli sám.' };
  save(); renderGarden();
  requestAnimationFrame(() => fitView());
}

    const pi = el('psc-input');
    if (pi) pi.onchange = () => { state.psc = pi.value.trim(); save(); };
    el('addr-demo').onclick = () => confirmDialog('Načíst ukázkovou parcelu?','Přepíše to současnou zahradu.', () => {
      ukazkovyObrys(); state.panelAdresa = false; save(); renderGarden();
    });
  }
  el('screen-garden').querySelectorAll('[data-parcela]').forEach(b =>
    b.onclick = () => prepniParcelu(Number(b.dataset.parcela)));
  el('screen-garden').querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    state.tool = b.dataset.tool;
    if (state.tool !== 'outline') state.selVert = null;
    if (state.tool !== 'pan') state.sel = null;
    save(); renderGarden();
  });
  if (sel) {
    el('sel-edit').onclick = () => openItemModal(sel.id);
    el('sel-off').onclick = () => { state.sel = null; save(); renderGarden(); };
  }
  const oc = el('o-close'); if (oc) oc.onclick = () => { state.outlineDone = true; save(); renderGarden(); toast('Obrys uzavřen'); };
  const odv = el('o-delvert'); if (odv) odv.onclick = () => {
    state.outline.splice(state.selVert, 1); state.selVert = null; save(); renderGarden();
  };
  const ou = el('o-undo'); if (ou) ou.onclick = () => {
    state.outline.pop(); state.selVert = null;
    if (state.outline.length < 3) state.outlineDone = false;
    save(); renderGarden();
  };
  el('g-empty').onclick = () => confirmDialog('Nová prázdná zahrada?','Smaže se obrys, dům i všechny záhonky.', () => {
    state.outline = []; state.outlineDone = false; state.items = {}; state.nextId = 1;
    state.sel = null; state.selVert = null; state.vedlejsi = []; state.katParcely = null;
    katStav = { stav:'idle', text:'' };
    view = { ox:-3, oy:-3, scale:11 };
    state.tool = 'outline'; save(); renderGarden(); toast('Můžeš kreslit');
  });

  bindCanvas();
  renderCanvas();
}

/* --- prepocty mezi metry a pixely --- */
function cvRect() { const c = el('canvas'); return c ? c.getBoundingClientRect() : { width:0, height:0, left:0, top:0 }; }
function w2s(x, y) { return [ (x - view.ox) * view.scale, (y - view.oy) * view.scale ]; }
function s2w(px, py) { return [ px / view.scale + view.ox, py / view.scale + view.oy ]; }
function snapW(x, y) { return [ Math.round(x/snapStep)*snapStep, Math.round(y/snapStep)*snapStep ]; }
function cellAt(px, py) { const w = s2w(px, py); return ck(Math.floor(w[0]), Math.floor(w[1])); }

function fitView() {
  let pts = [];
  if (state.outline.length >= 2) {
    pts = state.outline.slice();
    (state.vedlejsi || []).forEach(v => { if (v.length >= 2) pts = pts.concat(v); });
  } else {
    pts = items().flatMap(i => { const b = itBBox(i); return [[b.x0,b.y0],[b.x1,b.y1]]; });
  }
  const r = cvRect();
  if (!pts.length) { renderCanvas(); return; }
  // plátno ještě nemá rozměry (právě se překreslilo) - zkusíme to v dalším snímku
  if (!r.width || !r.height) {
    renderCanvas();
    if (!fitView._znovu) {
      fitView._znovu = true;
      requestAnimationFrame(() => { fitView._znovu = false; fitView(); });
    }
    return;
  }
  const b = bbox(pts);
  const pad = 3;
  const w = Math.max(b.x1-b.x0, 4) + pad*2, h = Math.max(b.y1-b.y0, 4) + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/h), 1.2, 60);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); renderCanvas();
}
function centerOn(it) {
  const b = itBBox(it), r = cvRect();
  if (!r.width) return;
  const pad = 6;
  const w = b.w + pad*2, hh = b.h + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/hh), 1.2, 30);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); renderCanvas();
}
function zoomAt(f, px, py) {
  const w = s2w(px, py);
  view.scale = clamp(view.scale * f, 1.2, 60);
  view.ox = w[0] - px/view.scale;
  view.oy = w[1] - py/view.scale;
  save(); renderCanvas();
}

/* --- uchyty pro roztahovani --- */
function handlesOf(it) {
  const b = itBBox(it);
  return [
    { side:'N', p: w2s((b.x0+b.x1)/2, b.y0), ax:'v' },
    { side:'S', p: w2s((b.x0+b.x1)/2, b.y1), ax:'v' },
    { side:'W', p: w2s(b.x0, (b.y0+b.y1)/2), ax:'h' },
    { side:'E', p: w2s(b.x1, (b.y0+b.y1)/2), ax:'h' },
  ];
}

/* --- kresleni --- */
let preview = null;
let rafId = null;
function scheduleRender() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = null; renderCanvas(); }); }

function renderCanvas() {
  const cv = el('canvas'), svg = el('cv-svg');
  if (!cv || !svg) return;
  const W = cv.clientWidth, H = cv.clientHeight;

  snapStep = 1;
  const dotStep = view.scale >= 9 ? 1 : (view.scale >= 3.5 ? 5 : 10);
  const tile = dotStep * view.scale, tile5 = dotStep * 5 * view.scale;
  const px = -view.ox * view.scale, py = -view.oy * view.scale;
  cv.style.backgroundImage =
    'radial-gradient(circle, var(--dot) 1.3px, transparent 1.9px),' +
    'linear-gradient(to right, var(--grid5) 1px, transparent 1px),' +
    'linear-gradient(to bottom, var(--grid5) 1px, transparent 1px)';
  cv.style.backgroundSize = `${tile}px ${tile}px, ${tile5}px ${tile5}px, ${tile5}px ${tile5}px`;
  cv.style.backgroundPosition = `${px - tile/2}px ${py - tile/2}px, ${px}px ${py}px, ${px}px ${py}px`;

  const sb = el('sb-bar'), sbl = el('sb-lbl');
  if (sb) {
    let mm = 5;
    for (const cand of [1,2,5,10,20,50,100]) { mm = cand; if (cand*view.scale >= 46) break; }
    sb.style.width = (mm*view.scale) + 'px';
    sbl.textContent = mm + ' m';
  }

  const parts = [];
  // dalsi vybrane parcely pod hlavnim obrysem
  (state.vedlejsi || []).forEach(poly => {
    if (poly.length < 3) return;
    const ps = poly.map(q => w2s(q[0],q[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    parts.push(`<polygon points="${ps}" fill="var(--accent-soft)" fill-opacity="0.38" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="6 4"/>`);
  });
  // obrys parcely
  if (state.outline.length >= 2) {
    const pstr = state.outline.map(p => w2s(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    if (state.outlineDone && state.outline.length >= 3) {
      parts.push(`<polygon points="${pstr}" fill="var(--accent-soft)" fill-opacity="0.5" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`);
    } else {
      parts.push(`<polyline points="${pstr}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>`);
    }
  }
  // prvky ze ctverecku
  const zo = { paved:0, house:1, bed:2 };
  const sorted = items().slice().sort((a,b) => (zo[a.typ]||0) - (zo[b.typ]||0));
  const s = view.scale, ov = 0.6;
  sorted.forEach(it => {
    const d = PRVKY[it.typ] || PRVKY.bed;
    const c = crop(it.cropId);
    const out = !itemInside(it);
    const fill = (it.typ === 'bed' && c) ? 'var(--accent)' : d.fill;
    let fp = '';
    cellsOf(it).forEach(k => {
      const cc = cxy(k), sp = w2s(cc[0], cc[1]);
      fp += `M${sp[0].toFixed(1)} ${sp[1].toFixed(1)}h${(s+ov).toFixed(1)}v${(s+ov).toFixed(1)}h${(-(s+ov)).toFixed(1)}Z`;
    });
    parts.push(`<path d="${fp}" fill="${fill}" fill-opacity="${it.typ==='bed'?0.92:0.95}"/>`);
    let ep = '';
    edgeSegments(it).forEach(g => {
      const a = w2s(g[0], g[1]), b2 = w2s(g[2], g[3]);
      ep += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}`;
    });
    parts.push(`<path d="${ep}" fill="none" stroke="${out?'var(--danger)':d.line}" stroke-width="${out?2.5:1.6}" stroke-linecap="square" ${out?'stroke-dasharray="5 4"':''}/>`);

    const b = itBBox(it);
    const sp0 = w2s(b.x0, b.y0), bw = b.w*s, bh = b.h*s;
    if (bw > 34 && bh > 24 && it.typ === 'bed' && c) {
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${(sp0[1]+bh/2).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${Math.min(24, bh*0.55).toFixed(0)}">${c.emoji}</text>`);
    }
    if (bw > 52 && bh > 16) {
      const col = it.typ === 'bed' ? '#ffffff' : 'var(--fg)';
      const ty = (it.typ === 'bed' && c && bh > 42) ? sp0[1] + bh - 7 : sp0[1] + bh/2 + 4;
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${col}" style="paint-order:stroke" stroke="${it.typ==='bed'?'rgba(0,0,0,.3)':'rgba(255,255,255,.45)'}" stroke-width="2.2">${esc(it.nazev)}</text>`);
    }
  });
  // vybrany prvek: ramec a uchyty
  const sel = state.sel ? state.items[state.sel] : null;
  if (sel && state.tool === 'pan') {
    const b = itBBox(sel), sp = w2s(b.x0, b.y0);
    parts.push(`<rect x="${(sp[0]-3).toFixed(1)}" y="${(sp[1]-3).toFixed(1)}" width="${(b.w*s+6).toFixed(1)}" height="${(b.h*s+6).toFixed(1)}" fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-dasharray="6 4" rx="4"/>`);
    handlesOf(sel).forEach(h => {
      parts.push(`<circle cx="${h.p[0].toFixed(1)}" cy="${h.p[1].toFixed(1)}" r="9.5" fill="var(--surface)" stroke="var(--accent-deep)" stroke-width="2.5"/>`);
      const l = 4;
      parts.push(h.ax === 'h'
        ? `<path d="M${(h.p[0]).toFixed(1)} ${(h.p[1]-l).toFixed(1)}v${l*2}" stroke="var(--accent-deep)" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M${(h.p[0]-l).toFixed(1)} ${(h.p[1]).toFixed(1)}h${l*2}" stroke="var(--accent-deep)" stroke-width="2.5" stroke-linecap="round"/>`);
    });
  }
  // vrcholy obrysu
  if (state.tool === 'outline') {
    const n = state.outline.length;
    if (n >= 2) {
      const lim = (state.outlineDone && n >= 3) ? n : n-1;
      for (let i = 0; i < lim; i++) {
        const a = state.outline[i], b = state.outline[(i+1) % n];
        const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
        if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
        const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
        parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="var(--paper)" fill-opacity="0.9" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="3 2.5" data-mid="${i}"/>`);
      }
    }
    state.outline.forEach((p, i) => {
      const sp = w2s(p[0], p[1]);
      const on = state.selVert === i;
      parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="${on?8:6.5}" fill="${on?'var(--accent)':'var(--surface)'}" stroke="var(--accent-deep)" stroke-width="2.5"/>`);
      if (i === 0 && !state.outlineDone && state.outline.length >= 3) {
        parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="12" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`);
      }
    });
  }
  // nahled tazeneho bloku
  if (preview && preview.w > 0 && preview.h > 0) {
    const d = PRVKY[preview.prvek] || PRVKY.bed;
    const sp = w2s(preview.x, preview.y);
    parts.push(`<rect x="${sp[0].toFixed(1)}" y="${sp[1].toFixed(1)}" width="${(preview.w*s).toFixed(1)}" height="${(preview.h*s).toFixed(1)}" fill="${d.fill}" fill-opacity="0.55" stroke="${d.line}" stroke-width="2" stroke-dasharray="6 4"/>`);
    parts.push(`<text x="${(sp[0] + preview.w*s/2).toFixed(1)}" y="${(sp[1] - 7).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--fg)">${preview.w} × ${preview.h} m</text>`);
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = parts.join('');
}

/* --- gesta --- */
let ptrs = new Map(), gest = null;
function bindCanvas() {
  const cv = el('canvas'); if (!cv || cv.dataset.bound) return;
  cv.dataset.bound = '1';
  const local = (e) => { const r = cvRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    const p = local(e);
    ptrs.set(e.pointerId, p);

    if (ptrs.size === 2) {
      const a = [...ptrs.values()];
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      gest = { type:'pinch', d0: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1, s0: view.scale, w0: s2w(mid.x, mid.y) };
      preview = null; return;
    }

    if (state.tool === 'outline') {
      const hv = state.outline.findIndex(q => { const sp = w2s(q[0],q[1]); return Math.hypot(sp[0]-p.x, sp[1]-p.y) <= 17; });
      if (hv >= 0) { gest = { type:'vertex', i:hv, start:p, moved:false }; return; }
      const n = state.outline.length;
      if (n >= 2) {
        const lim = (state.outlineDone && n >= 3) ? n : n-1;
        for (let i = 0; i < lim; i++) {
          const a = state.outline[i], b = state.outline[(i+1) % n];
          const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
          if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
          const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
          if (Math.hypot(mx-p.x, my-p.y) <= 15) { gest = { type:'insert', i, start:p, moved:false }; return; }
        }
      }
      gest = { type:'tapAdd', start:p, moved:false }; return;
    }

    if (state.tool === 'erase') {
      gest = { type:'erase', start:p, moved:false, done:new Set() };
      const k = cellAt(p.x, p.y); gest.done.add(k); removeCells([k]); scheduleRender(); return;
    }

    if (state.tool === 'bed' || state.tool === 'house' || state.tool === 'paved') {
      const w = s2w(p.x, p.y);
      gest = { type:'rect', prvek: state.tool, ax: Math.floor(w[0]), ay: Math.floor(w[1]), start:p, moved:false };
      return;
    }

    // ruka
    const sel = state.sel ? state.items[state.sel] : null;
    if (sel) {
      const h = handlesOf(sel).find(h => Math.hypot(h.p[0]-p.x, h.p[1]-p.y) <= 18);
      if (h) { gest = { type:'stretch', id:sel.id, side:h.side, start:p, applied:0, moved:false }; return; }
    }
    const k = cellAt(p.x, p.y);
    const own = ownerAt(k);
    if (own) { gest = { type:'move', id:own.id, start:p, last:{dx:0,dy:0}, moved:false }; return; }
    gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false };
  });

  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.set(e.pointerId, p);
    if (!gest) return;
    if (gest.type !== 'pinch' && !gest.moved && Math.hypot(p.x-gest.start.x, p.y-gest.start.y) > 7) gest.moved = true;

    if (gest.type === 'pinch') {
      const a = [...ptrs.values()]; if (a.length < 2) return;
      const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1;
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      view.scale = clamp(gest.s0 * (d/gest.d0), 1.2, 60);
      view.ox = gest.w0[0] - mid.x/view.scale;
      view.oy = gest.w0[1] - mid.y/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'pan' && gest.moved) {
      view.ox = gest.o0.ox - (p.x - gest.start.x)/view.scale;
      view.oy = gest.o0.oy - (p.y - gest.start.y)/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'erase') {
      const k = cellAt(p.x, p.y);
      if (!gest.done.has(k)) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }
    if (gest.type === 'rect') {
      const w = s2w(p.x, p.y);
      const bx = Math.floor(w[0]), by = Math.floor(w[1]);
      const x0 = Math.min(gest.ax, bx), y0 = Math.min(gest.ay, by);
      preview = { prvek:gest.prvek, x:x0, y:y0, w: Math.abs(bx-gest.ax)+1, h: Math.abs(by-gest.ay)+1 };
      scheduleRender(); return;
    }
    if (gest.type === 'vertex' && gest.moved) {
      state.outline[gest.i] = snapW(...s2w(p.x, p.y));
      scheduleRender(); return;
    }
    if (gest.type === 'stretch') {
      const it = state.items[gest.id]; if (!it) return;
      const side = gest.side;
      const d = (side === 'E' || side === 'W')
        ? (p.x - gest.start.x)/view.scale
        : (p.y - gest.start.y)/view.scale;
      const want = Math.round((side === 'W' || side === 'N') ? -d : d);
      let guard = 0;
      while (gest.applied < want && guard++ < 80) { if (!stretch(it, side, true)) break; gest.applied++; }
      guard = 0;
      while (gest.applied > want && guard++ < 80) { if (!stretch(it, side, false)) break; gest.applied--; }
      scheduleRender(); return;
    }
    if (gest.type === 'move' && gest.moved) {
      const it = state.items[gest.id]; if (!it) return;
      const dx = Math.round((p.x - gest.start.x)/view.scale);
      const dy = Math.round((p.y - gest.start.y)/view.scale);
      if (dx !== gest.last.dx || dy !== gest.last.dy) {
        moveItemBy(it, dx - gest.last.dx, dy - gest.last.dy);
        gest.last = { dx, dy };
        scheduleRender();
      }
      return;
    }
  });

  const finish = (e) => {
    ptrs.delete(e.pointerId);
    if (!gest) return;
    const g = gest;
    if (ptrs.size > 0 && g.type === 'pinch') return;
    gest = null;

    if (g.type === 'pinch') { save(); renderCanvas(); return; }

    if (g.type === 'tapAdd' && !g.moved) {
      const w = snapW(...s2w(g.start.x, g.start.y));
      if (!state.outlineDone && state.outline.length >= 3) {
        const f = w2s(state.outline[0][0], state.outline[0][1]);
        if (Math.hypot(f[0]-g.start.x, f[1]-g.start.y) <= 19) {
          state.outlineDone = true; save(); renderGarden(); toast('Obrys uzavřen'); return;
        }
      }
      if (state.outlineDone) { state.selVert = null; save(); renderGarden(); return; }
      state.outline.push(w); state.selVert = null; save(); renderGarden(); return;
    }
    if (g.type === 'insert' && !g.moved) {
      const a = state.outline[g.i], b = state.outline[(g.i+1) % state.outline.length];
      state.outline.splice(g.i+1, 0, snapW((a[0]+b[0])/2, (a[1]+b[1])/2));
      state.selVert = g.i+1;
      save(); renderGarden(); toast('Vrchol vložen'); return;
    }
    if (g.type === 'vertex') {
      if (g.moved) { save(); renderGarden(); }
      else { state.selVert = (state.selVert === g.i) ? null : g.i; save(); renderGarden(); }
      return;
    }
    if (g.type === 'erase') { save(); renderGarden(); return; }

    if (g.type === 'rect') {
      const pv = preview; preview = null;
      const w = s2w(g.start.x, g.start.y);
      const box = pv || { prvek:g.prvek, x:Math.floor(w[0]), y:Math.floor(w[1]), w:1, h:1 };
      const keys = rectKeys(box.x, box.y, box.x+box.w, box.y+box.h);
      // ctverecky vedle sebe patri k jednomu prvku stejneho typu
      const sousedi = new Set();
      keys.forEach(k => {
        const c = cxy(k);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(dd => {
          const o = ownerAt(ck(c[0]+dd[0], c[1]+dd[1]));
          if (o && o.typ === box.prvek) sousedi.add(o.id);
        });
      });
      let target = null;
      if (sousedi.size) {
        const ids = [...sousedi];
        target = state.items[ids[0]];
        ids.slice(1).forEach(id => { const o = state.items[id]; if (o) { addCells(target, o.cells.slice()); } });
      } else {
        const id = 'p' + state.nextId++;
        const n = items().filter(i => i.typ === box.prvek).length + 1;
        target = state.items[id] = { id, typ:box.prvek, cells:[], nazev: PRVKY[box.prvek].nazev + ' ' + n,
          cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[] };
      }
      addCells(target, keys);
      const fresh = !sousedi.size;
      state.sel = null;
      save(); renderGarden();
      if (fresh && box.prvek === 'bed') openItemModal(target.id);
      return;
    }
    if (g.type === 'stretch') { save(); renderGarden(); return; }
    if (g.type === 'move') {
      if (g.moved) { save(); renderGarden(); }
      else { state.sel = g.id; save(); renderGarden(); }
      return;
    }
    if (g.type === 'pan') {
      if (g.moved) save();
      else if (state.sel) { state.sel = null; save(); renderGarden(); }
      return;
    }
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', finish);

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cvRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

  el('zoom-in').onclick = () => { const r = cvRect(); zoomAt(1.3, r.width/2, r.height/2); };
  el('zoom-out').onclick = () => { const r = cvRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
  el('zoom-fit').onclick = () => fitView();
}

/* ============ OBRAZOVKA: KALENDAR ============ */
function renderCalendar() {
  const m = state.calMonth + 1;
  const mine = beds().map(b => ({ b, c: crop(b.cropId) })).filter(o => o.c);
  const mineTasks = [];
  mine.forEach(o => ukonyOf(o.c).filter(u=>u.m===m).forEach(u => mineTasks.push({ ...u, crop:o.c, bed:o.b })));
  const otherTasks = [];
  allCrops().forEach(c => {
    if (mine.some(o => o.c.id === c.id)) return;
    ukonyOf(c).filter(u=>u.m===m).forEach(u => otherTasks.push({ ...u, crop:c, bed:null }));
  });
  const order = { soil:0, sow:1, plant:2, care:3, harvest:4 };
  mineTasks.sort((a,b)=>order[a.typ]-order[b.typ]);
  otherTasks.sort((a,b)=>order[a.typ]-order[b.typ]);

  el('screen-calendar').innerHTML = `
    <div class="cal-nav">
      <button id="cal-prev" aria-label="Předchozí měsíc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>${MESICE[state.calMonth][0].toUpperCase()+MESICE[state.calMonth].slice(1)}</h2>
      <button id="cal-next" aria-label="Další měsíc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    ${mineTasks.length ? `
      <div class="task-group">
        <div class="tg-label">Co dělat na mých záhonech · ${mineTasks.length}</div>
        ${mineTasks.map(t => taskHTML(t, true)).join('')}
      </div>` : `
      <div class="task-group">
        <div class="tg-label">Moje záhonky</div>
        <div class="task" style="border-left-color:var(--line)">
          <div class="t-icon" style="background:var(--surface-2)">😌</div>
          <div class="t-body"><div class="t-title">V ${MESICE[state.calMonth]}u tu nic nečeká</div>
          <div class="t-sub">Na plodinách, které pěstuješ, není tento měsíc žádný úkon.</div></div>
        </div>
      </div>`}
    <div class="task-group">
      <div class="tg-label">Co se dá dělat navíc · ${otherTasks.length}</div>
      ${otherTasks.length ? otherTasks.map(t => taskHTML(t, false)).join('')
        : `<p class="hint">Pro ostatní plodiny v seznamu není v tomto měsíci nic naplánováno.</p>`}
    </div>
  `;
  el('cal-prev').onclick = () => { state.calMonth = (state.calMonth+11)%12; save(); renderCalendar(); };
  el('cal-next').onclick = () => { state.calMonth = (state.calMonth+1)%12; save(); renderCalendar(); };
  el('screen-calendar').querySelectorAll('[data-crop]').forEach(b => b.onclick = () => openCropDetail(b.dataset.crop));
}
function taskHTML(t, mine) {
  return `<div class="task ${t.typ}" data-crop="${t.crop.id}" role="button" tabindex="0">
    <div class="t-icon">${t.ic}</div>
    <div class="t-body">
      <div class="t-title">${esc(t.t)}</div>

      <div class="t-when">${TYP_LABEL[t.typ]}${mine?'':' · nepěstuješ'}</div>

  back.addEventListener('pointerdown', e => { if (e.target === back) closeModal(); });

        </div>
      </div>` : ''}

      <button class="btn ghost" id="i-del">Smazat</button>
      <button class="btn" id="i-save">Uložit</button>
    </div>
  `);
  const m = back.querySelector('.modal');
  if (isBed) {
    m.querySelectorAll('[data-fert-rm]').forEach(b => b.onclick = () => {
      it.hnojeni.splice(Number(b.dataset.fertRm),1); save(); openItemModal(id); renderBeds();
    });
    m.querySelector('#foto-add').onclick = () => m.querySelector('#foto-input').click();
    m.querySelector('#foto-input').onchange = (e) => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 1100, (data) => {
        it.fotky = it.fotky || [];
        it.fotky.push({ data, datum: todayISO() });
        save(); openItemModal(id); renderBeds();
      });
      r.readAsDataURL(file);
    };
    m.querySelectorAll('[data-foto-rm]').forEach(b => b.onclick = () => {
      it.fotky.splice(Number(b.dataset.fotoRm), 1); save(); openItemModal(id); renderBeds();
    });
    m.querySelector('#fert-add').onclick = () => {
      const datum = m.querySelector('#f-fdatum').value;
      const co = m.querySelector('#f-fco').value;
      if (!datum) { toast('Vyber datum hnojení'); return; }
      it.hnojeni = it.hnojeni || [];
      it.hnojeni.push({ datum, co, mnozstvi: m.querySelector('#f-fmn').value.trim(), pozn: m.querySelector('#f-fpozn').value.trim() });
      save(); openItemModal(id); renderBeds(); toast('Hnojení zapsáno');
    };
  }
  m.querySelector('#i-save').onclick = () => {
    it.nazev = m.querySelector('#f-nazev').value || it.nazev;
    if (rect) {
      const nw = parseInt(m.querySelector('#f-w').value, 10), nh = parseInt(m.querySelector('#f-h').value, 10);
      if (isFinite(nw) && nw > 0 && isFinite(nh) && nh > 0 && (nw !== ib.w || nh !== ib.h)) reshapeRect(it, nw, nh);
    }
    if (isBed) {
      const rf = m.querySelector('#f-rost');
      if (rf) {
        const rv = parseInt(rf.value, 10);
        it.rostliny = (isFinite(rv) && rv >= 0 && rv !== odhadRostlin(it)) ? rv : null;
      }
      it.cropId = m.querySelector('#f-crop').value || null;
      it.datumVysadby = m.querySelector('#f-datum').value;
      it.poznamka = m.querySelector('#f-pozn').value;
    }
    save(); closeModal(); renderGarden(); renderBeds(); toast('Uloženo');
  };
  m.querySelector('#i-del').onclick = () => {
    delete state.items[id];
    save(); closeModal(); renderGarden(); renderBeds(); toast('Smazáno');
  };
}

function shrinkImage(dataUrl, maxW, cb) {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { cb(c.toDataURL('image/jpeg', 0.75)); } catch (e) { cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

  });
  el('screen-shops').innerHTML = `
    <div class="section-head"><h2>Nákup osiva</h2><span class="count">${sh.length} obchodů</span></div>

    <div class="section-head" style="margin-bottom:9px"><h2 style="font-size:17px">Co kde koupit</h2><span class="count">${planovane.length}</span></div>
    ${planovane.length ? planovane.map(c => {
      const p = planOf(c.id);
      const list = p.shops.map(shopOf).filter(Boolean);
      const kdeRoste = beds().filter(b => b.cropId === c.id);
      return `<div class="buy-row" data-crop="${c.id}" role="button" tabindex="0">
        <span class="br-emoji">${c.emoji}</span>

            list.length
              ? list.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nazev)}</a>`).join(' · ')
              : 'Zdroj osiva nezadaný'
          }</div>
          ${kdeRoste.length ? `<div class="br-src" style="color:var(--fg-faint)">Pěstuješ na: ${kdeRoste.map(b=>esc(b.nazev)).join(', ')}</div>` : ''}
        </span>
      </div>`;
    }).join('') : `<p class="hint" style="margin-top:0">Jak budeš osazovat záhonky, plodiny se objeví tady.</p>`}

    <div class="section-head" style="margin-top:22px;margin-bottom:9px"><h2 style="font-size:17px">Obchody</h2></div>
    ${sh.map(s => `
      <div class="shop-card">
        <div class="sh-head">
          <div class="sh-ico">${esc(s.ico || '🛒')}</div>
          <div style="flex:1;min-width:0">
            <h3>${esc(s.nazev)}</h3>
            <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//,''))}</a>
          </div>
        </div>
        ${s.pozn ? `<div class="sh-pozn">${esc(s.pozn)}</div>` : ''}
        <div class="sh-act">
          <button class="btn sm ghost" data-shop-edit="${s.id}">Upravit</button>
          <button class="btn sm ghost" data-shop-del="${s.id}">Odebrat</button>
        </div>
      </div>`).join('')}
    <div class="actrow">
      <button class="btn" id="shop-add">Přidat obchod</button>
      ${sh.length ? '' : `<button class="btn ghost" id="shop-reset">Obnovit výchozí seznam</button>`}
    </div>
    <p class="hint">Obchody si uprav podle sebe.</p>
  `;
  el('screen-shops').querySelectorAll('[data-crop]').forEach(b => b.onclick = () => openCropDetail(b.dataset.crop));
  el('screen-shops').querySelectorAll('[data-shop-edit]').forEach(b => b.onclick = () => openShopModal(b.dataset.shopEdit));
  el('screen-shops').querySelectorAll('[data-shop-del]').forEach(b => b.onclick = () => {
    const s = shopOf(b.dataset.shopDel); if (!s) return;
    confirmDialog('Odebrat ' + s.nazev + '?', 'Zmizí ze seznamu i od plodin, kde je přiřazený.', () => {
      delete state.shops[s.id];
      Object.keys(state.cropPlan || {}).forEach(k => {
        state.cropPlan[k].shops = (state.cropPlan[k].shops || []).filter(x => x !== s.id);
      });
      save(); renderShops(); renderBeds(); toast('Obchod odebrán');

  const rs = el('shop-reset');
  if (rs) rs.onclick = () => { seedShops(); save(); renderShops(); toast('Výchozí obchody obnoveny'); };

function openShopModal(id) {
  const s = id ? shopOf(id) : null;
  const back = openModal(`
    <h2>${s ? 'Upravit obchod' : 'Nový obchod'}</h2>
    <p class="m-lead">${s ? 'Změň, co potřebuješ.' : 'Přidej e-shop, zahradnictví nebo místo, odkud bereš osivo.'}</p>
    <div class="field"><label for="f-sn">Název</label><input id="f-sn" value="${esc(s?s.nazev:'')}" placeholder="Zahradnictví u nádraží"></div>

    <div class="field"><label for="f-si">Ikona</label><input id="f-si" value="${esc(s?(s.ico||'🛒'):'🛒')}" maxlength="3"></div>
    <div class="field"><label for="f-sp">Poznámka</label><textarea id="f-sp" placeholder="Co tam berou, jaké mají ceny, kdy mívají sadbu…">${esc(s?s.pozn:'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" id="s-cancel">Zrušit</button>
      <button class="btn" id="s-save">Uložit</button>
    </div>
  `);
  const m = back.querySelector('.modal');
  m.querySelector('#s-cancel').onclick = closeModal;
  m.querySelector('#s-save').onclick = () => {
    const nazev = m.querySelector('#f-sn').value.trim();
    if (!nazev) { toast('Napiš název obchodu'); return; }
    let url = m.querySelector('#f-su').value.trim();
    if (url && !/^https?:\/\//i.test(url) && /\.[a-z]{2,}/i.test(url) && !/\s/.test(url)) url = 'https://' + url;
    const pozn = m.querySelector('#f-sp').value.trim();
    const ico = m.querySelector('#f-si').value.trim() || '🛒';
    if (s) { Object.assign(s, { nazev, url, pozn, ico }); }
    else {
      const nid = 'v' + (state.nextShop = (state.nextShop || 1) + 1);
      state.shops[nid] = { id:nid, nazev, url, pozn, ico, vlastni:true };
    }
    save(); closeModal(); renderShops(); renderBeds(); toast('Obchod uložen');
  };
}
