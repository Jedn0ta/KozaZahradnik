/* Lišta je dole, kartička nad ní. Zoom a měřítko posadíme nad obojí. */
function posadPanel() {
  const bar = el('mbar'), sh = el('msheet'), zo = el('m-zoom'), sc = el('m-scale');
  if (!bar) return;
  const hb = bar.offsetHeight || 0;
  let hs = 0;
  if (sh) { sh.style.bottom = hb + 'px'; hs = sh.offsetHeight || 0; }
  if (zo) zo.style.bottom = (hb + hs + 14) + 'px';
  if (sc) sc.style.bottom = (hb + hs + 20) + 'px';
}

/* --- prepocty mezi metry a pixely --- */
function cvRect() { const c = el('cv'); return c ? c.getBoundingClientRect() : { width:0, height:0, left:0, top:0 }; }
function w2s(x, y) { return [ (x - view.ox) * view.scale, (y - view.oy) * view.scale ]; }
function s2w(px, py) { return [ px / view.scale + view.ox, py / view.scale + view.oy ]; }
function snapW(x, y) { return [ Math.round(x/snapStep)*snapStep, Math.round(y/snapStep)*snapStep ]; }
function cellAt(px, py) { const w = s2w(px, py); return ck(Math.floor(w[0]), Math.floor(w[1])); }

function panelVyska() {
  const bar = el('mbar'), sh = el('msheet');
  return (bar ? bar.offsetHeight : 0) + (sh ? sh.offsetHeight : 0);
}
function fitView() {
  let pts = [];
  if (state.outline.length >= 2) {
    pts = state.outline.slice();
    (state.vedlejsi || []).forEach(v => { if (v.length >= 2) pts = pts.concat(v); });
  } else {
    pts = items().flatMap(i => { const b = itBBox(i); return [[b.x0,b.y0],[b.x1,b.y1]]; });
  }
  const r = cvRect();
  if (!pts.length) { kresliPlatno(); return; }
  // plátno ještě nemá rozměry (právě se překreslilo) - zkusíme to v dalším snímku
  if (!r.width || !r.height) {
    kresliPlatno();
    if (!fitView._znovu) {
      fitView._znovu = true;
      requestAnimationFrame(() => { fitView._znovu = false; fitView(); });
    }
    return;
  }
  const b = bbox(pts);
  // mapu zakryva nahore pilulka s adresou a dole vysouvaci panel,
  // zahrada se musi vejit mezi ne
  const shora = (el('otevri-adresu') || el('p-zavri') || el('m-hotovo')) ? 80 : 14;
  const zdola = panelVyska();
  const uzitna = Math.max(120, r.height - zdola - shora);
  const pad = 3;
  const w = Math.max(b.x1-b.x0, 4) + pad*2, h = Math.max(b.y1-b.y0, 4) + pad*2;
  view.scale = clamp(Math.min(r.width/w, uzitna/h), 1.2, 60);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - (shora + uzitna/2)/view.scale;
  save(); kresliPlatno();
}
function centerOn(it) {
  const b = itBBox(it), r = cvRect();
  if (!r.width) return;
  const pad = 6;
  const w = b.w + pad*2, hh = b.h + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/hh), 1.2, 30);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); kresliPlatno();
}
function zoomAt(f, px, py) {
  const w = s2w(px, py);
  view.scale = clamp(view.scale * f, 1.2, 60);
  view.ox = w[0] - px/view.scale;
  view.oy = w[1] - py/view.scale;
  save(); kresliPlatno();
}

/* --- uchyty pro roztahovani --- */
function handlesOf(it) {
  const b = itBBox(it);
  return [
    { side:'N', p: w2s((b.x0+b.x1)/2, b.y0), ax:'v' },
    { side:'S', p: w2s((b.x0+b.x1)/2, b.y1), ax:'v' },
    { side:'W', p: w2s(b.x0, (b.y0+b.y1)/2), ax:'h' },
    { side:'E', p: w2s(b.x1, (b.y0+b.y1)/2), ax:'h' },
  ];
}

/* --- kresleni --- */
let preview = null;
let rafId = null;
function scheduleRender() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = null; kresliPlatno(); }); }

function kresliPlatno() {
  const cv = el('cv'), svg = el('svg');
  if (!cv || !svg) return;
  const W = cv.clientWidth, H = cv.clientHeight;

  snapStep = 1;
  const dotStep = view.scale >= 9 ? 1 : (view.scale >= 3.5 ? 5 : 10);
  const tile = dotStep * view.scale, tile5 = dotStep * 5 * view.scale;
  const px = -view.ox * view.scale, py = -view.oy * view.scale;
  cv.style.backgroundImage =
    'radial-gradient(circle, var(--dot) 1.3px, transparent 1.9px),' +
    'linear-gradient(to right, var(--grid) 1px, transparent 1px),' +
    'linear-gradient(to bottom, var(--grid) 1px, transparent 1px)';
  cv.style.backgroundSize = `${tile}px ${tile}px, ${tile5}px ${tile5}px, ${tile5}px ${tile5}px`;
  cv.style.backgroundPosition = `${px - tile/2}px ${py - tile/2}px, ${px}px ${py}px, ${px}px ${py}px`;

  const sb = el('sc-b'), sbl = el('sc-t');
  if (sb) {
    let mm = 5;
    for (const cand of [1,2,5,10,20,50,100]) { mm = cand; if (cand*view.scale >= 46) break; }
    sb.style.width = (mm*view.scale) + 'px';
    sbl.textContent = mm + ' m';
  }

  const parts = [];
  // dalsi vybrane parcely pod hlavnim obrysem
  (state.vedlejsi || []).forEach(poly => {
    if (poly.length < 3) return;
    const ps = poly.map(q => w2s(q[0],q[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    parts.push(`<polygon points="${ps}" fill="var(--acc-soft)" fill-opacity="0.38" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="6 4"/>`);
  });
  // obrys parcely
  if (state.outline.length >= 2) {
    const pstr = state.outline.map(p => w2s(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    if (state.outlineDone && state.outline.length >= 3) {
      parts.push(`<polygon points="${pstr}" fill="var(--acc-soft)" fill-opacity="0.5" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`);
    } else {
      parts.push(`<polyline points="${pstr}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>`);
    }
  }
  // prvky ze ctverecku
  const zo = { paved:0, house:1, bed:2, raised:3, trough:4, pot:5 };
  const sorted = items().slice().sort((a,b) => (zo[a.typ]||0) - (zo[b.typ]||0));
  const s = view.scale, ov = 0.6;
  sorted.forEach(it => {
    const d = PRVKY[it.typ] || PRVKY.bed;
    const c = crop(it.cropId);
    const out = !itemInside(it);
    const fill = (roste(it) && c) ? 'var(--acc)' : d.fill;
    let fp = '', sach = '';
    cellsOf(it).forEach(k => {
      const cc = cxy(k), sp = w2s(cc[0], cc[1]);
      const d2 = `M${sp[0].toFixed(1)} ${sp[1].toFixed(1)}h${(s+ov).toFixed(1)}v${(s+ov).toFixed(1)}h${(-(s+ov)).toFixed(1)}Z`;
      fp += d2;
      if ((cc[0] + cc[1]) % 2) sach += d2;   // sachovnice: plocha vypada jako dlazdice
    });
    parts.push(`<path d="${fp}" fill="${fill}" fill-opacity="${roste(it)?0.92:0.95}"/>`);
    if (s >= 6) parts.push(`<path d="${sach}" fill="#000" fill-opacity="0.08"/>`);
    let ep = '';
    edgeSegments(it).forEach(g => {
      const a = w2s(g[0], g[1]), b2 = w2s(g[2], g[3]);
      ep += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}`;
    });
    parts.push(`<path d="${ep}" fill="none" stroke="${out?'var(--danger)':d.line}" stroke-width="${out?2.5:1.6}" stroke-linecap="square" ${out?'stroke-dasharray="5 4"':''}/>`);

    const b = itBBox(it);
    const sp0 = w2s(b.x0, b.y0), bw = b.w*s, bh = b.h*s;
    // pixelartovy obrazek: plodina, kdyz tam neco roste, jinak obrazek prvku
    const znak = cropPixId(c) || (!c ? d.pix : null);
    const vel = Math.min(bw * 0.72, bh * 0.72, 56);
    if (bw > 20 && bh > 18 && znak && vel >= 11) {
      parts.push(pixInto(znak, sp0[0] + (bw - vel)/2, sp0[1] + (bh - vel)/2 - (bh > 48 ? 5 : 0), vel));
    } else if (bw > 30 && bh > 26 && c) {
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${(sp0[1]+bh/2).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${Math.min(24, bh*0.5).toFixed(0)}">${c.emoji}</text>`);
    }
    if (bw > 52 && bh > 16) {
      const col = roste(it) ? '#ffffff' : 'var(--ink)';
      const ty = (bh > 48 && znak) ? sp0[1] + bh - 7 : sp0[1] + bh/2 + 4;
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${col}" style="paint-order:stroke" stroke="${roste(it)?'rgba(0,0,0,.3)':'rgba(255,255,255,.45)'}" stroke-width="2.2">${esc(c ? c.nazev : it.nazev)}</text>`);
    }
    // zamek v rohu
    if (it.zamek && bw > 26 && bh > 26) parts.push(pixInto('zamek', sp0[0] + bw - 19, sp0[1] + 3, 16));
  });
  // vybrany prvek: ramec a uchyty
  const sel = state.sel ? state.items[state.sel] : null;
  if (sel && state.tool === 'pan') {
    const b = itBBox(sel), sp = w2s(b.x0, b.y0);
    parts.push(`<rect x="${(sp[0]-3).toFixed(1)}" y="${(sp[1]-3).toFixed(1)}" width="${(b.w*s+6).toFixed(1)}" height="${(b.h*s+6).toFixed(1)}" fill="none" stroke="var(--acc-dark)" stroke-width="2" stroke-dasharray="6 4" rx="4"/>`);
    if (!sel.zamek && !state.zamek) handlesOf(sel).forEach(h => {
      parts.push(`<circle cx="${h.p[0].toFixed(1)}" cy="${h.p[1].toFixed(1)}" r="9.5" fill="var(--card)" stroke="var(--acc-dark)" stroke-width="2.5"/>`);
      const l = 4;
      parts.push(h.ax === 'h'
        ? `<path d="M${(h.p[0]).toFixed(1)} ${(h.p[1]-l).toFixed(1)}v${l*2}" stroke="var(--acc-dark)" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M${(h.p[0]-l).toFixed(1)} ${(h.p[1]).toFixed(1)}h${l*2}" stroke="var(--acc-dark)" stroke-width="2.5" stroke-linecap="round"/>`);
    });
  }
  // vrcholy obrysu
  if (state.tool === 'outline') {
    const n = state.outline.length;
    if (n >= 2) {
      const lim = (state.outlineDone && n >= 3) ? n : n-1;
      for (let i = 0; i < lim; i++) {
        const a = state.outline[i], b = state.outline[(i+1) % n];
        const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
        if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
        const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
        parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="var(--paper)" fill-opacity="0.9" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="3 2.5" data-mid="${i}"/>`);
      }
    }
    state.outline.forEach((p, i) => {
      const sp = w2s(p[0], p[1]);
      const on = state.selVert === i;
      parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="${on?8:6.5}" fill="${on?'var(--acc)':'var(--card)'}" stroke="var(--acc-dark)" stroke-width="2.5"/>`);
      if (i === 0 && !state.outlineDone && state.outline.length >= 3) {
        parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="12" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="3 3"/>`);
      }
    });
  }
  // nahled tazeneho bloku
  if (preview && preview.w > 0 && preview.h > 0) {
    const d = PRVKY[preview.prvek] || PRVKY.bed;
    const sp = w2s(preview.x, preview.y);
    parts.push(`<rect x="${sp[0].toFixed(1)}" y="${sp[1].toFixed(1)}" width="${(preview.w*s).toFixed(1)}" height="${(preview.h*s).toFixed(1)}" fill="${d.fill}" fill-opacity="0.55" stroke="${d.line}" stroke-width="2" stroke-dasharray="6 4"/>`);
    parts.push(`<text x="${(sp[0] + preview.w*s/2).toFixed(1)}" y="${(sp[1] - 7).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--ink)">${preview.w} × ${preview.h} m</text>`);
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = parts.join('');
}

/* --- gesta --- */
let ptrs = new Map(), gest = null;
function napojPlatno() {
  const cv = el('cv'); if (!cv || cv.dataset.bound) return;
  cv.dataset.bound = '1';
  const local = (e) => { const r = cvRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    const p = local(e);
    ptrs.set(e.pointerId, p);

    if (ptrs.size === 2) {
      const a = [...ptrs.values()];
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      gest = { type:'pinch', d0: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1, s0: view.scale, w0: s2w(mid.x, mid.y) };
      preview = null; return;
    }

    /* Zamčená zahrada: prst jen posouvá a vybírá, nic se nepřekreslí. */
    if (state.zamek && state.tool !== 'pan') {
      gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false };
      return;
    }

    if (state.tool === 'outline') {
      const hv = state.outline.findIndex(q => { const sp = w2s(q[0],q[1]); return Math.hypot(sp[0]-p.x, sp[1]-p.y) <= 17; });
      if (hv >= 0) { gest = { type:'vertex', i:hv, start:p, moved:false }; return; }
      const n = state.outline.length;
      if (n >= 2) {
        const lim = (state.outlineDone && n >= 3) ? n : n-1;
        for (let i = 0; i < lim; i++) {
          const a = state.outline[i], b = state.outline[(i+1) % n];
          const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
          if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
          const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
          if (Math.hypot(mx-p.x, my-p.y) <= 15) { gest = { type:'insert', i, start:p, moved:false }; return; }
        }
      }
      gest = { type:'tapAdd', start:p, moved:false }; return;
    }

    if (state.tool === 'erase') {
      gest = { type:'erase', start:p, moved:false, done:new Set() };
      const k = cellAt(p.x, p.y);
      const o = ownerAt(k);
      if (!o || !o.zamek) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }

    if (PRVKY[state.tool]) {
      const w = s2w(p.x, p.y);
      gest = { type:'rect', prvek: state.tool, ax: Math.floor(w[0]), ay: Math.floor(w[1]), start:p, moved:false };
      return;
    }

    /* Ruka: prst vždy posouvá plán. Prvek se hýbe jen když je předtím vybraný —
       jinak by se při listování zahradou omylem přetahovaly záhony. */
    const sel = state.sel ? state.items[state.sel] : null;
    if (sel && !sel.zamek) {
      const h = handlesOf(sel).find(h => Math.hypot(h.p[0]-p.x, h.p[1]-p.y) <= 18);
      if (h) { gest = { type:'stretch', id:sel.id, side:h.side, start:p, applied:0, moved:false }; return; }
    }
    const own = ownerAt(cellAt(p.x, p.y));
    if (own && state.sel === own.id && !own.zamek && !state.zamek) {
      gest = { type:'move', id:own.id, start:p, last:{dx:0,dy:0}, moved:false }; return;
    }
    gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false, klep: own ? own.id : null };
  });

  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.set(e.pointerId, p);
    if (!gest) return;
    if (gest.type !== 'pinch' && !gest.moved && Math.hypot(p.x-gest.start.x, p.y-gest.start.y) > 7) gest.moved = true;

    if (gest.type === 'pinch') {
      const a = [...ptrs.values()]; if (a.length < 2) return;
      const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1;
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      view.scale = clamp(gest.s0 * (d/gest.d0), 1.2, 60);
      view.ox = gest.w0[0] - mid.x/view.scale;
      view.oy = gest.w0[1] - mid.y/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'pan' && gest.moved) {
      view.ox = gest.o0.ox - (p.x - gest.start.x)/view.scale;
      view.oy = gest.o0.oy - (p.y - gest.start.y)/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'erase') {
      const k = cellAt(p.x, p.y);
      const o = ownerAt(k);
      if (!gest.done.has(k) && (!o || !o.zamek)) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }
    if (gest.type === 'rect') {
      const w = s2w(p.x, p.y);
      const bx = Math.floor(w[0]), by = Math.floor(w[1]);
      const x0 = Math.min(gest.ax, bx), y0 = Math.min(gest.ay, by);
      preview = { prvek:gest.prvek, x:x0, y:y0, w: Math.abs(bx-gest.ax)+1, h: Math.abs(by-gest.ay)+1 };
      scheduleRender(); return;
    }
    if (gest.type === 'vertex' && gest.moved) {
      state.outline[gest.i] = snapW(...s2w(p.x, p.y));
      scheduleRender(); return;
    }
    if (gest.type === 'stretch') {
      const it = state.items[gest.id]; if (!it) return;
      const side = gest.side;
      const d = (side === 'E' || side === 'W')
        ? (p.x - gest.start.x)/view.scale
        : (p.y - gest.start.y)/view.scale;
      const want = Math.round((side === 'W' || side === 'N') ? -d : d);
      let guard = 0;
      while (gest.applied < want && guard++ < 80) { if (!stretch(it, side, true)) break; gest.applied++; }
      guard = 0;
      while (gest.applied > want && guard++ < 80) { if (!stretch(it, side, false)) break; gest.applied--; }
      scheduleRender(); return;
    }
    if (gest.type === 'move' && gest.moved) {
      const it = state.items[gest.id]; if (!it) return;
      const dx = Math.round((p.x - gest.start.x)/view.scale);
      const dy = Math.round((p.y - gest.start.y)/view.scale);
      if (dx !== gest.last.dx || dy !== gest.last.dy) {
        moveItemBy(it, dx - gest.last.dx, dy - gest.last.dy);
        gest.last = { dx, dy };
        scheduleRender();
      }
      return;
    }
  });

  const finish = (e) => {
    ptrs.delete(e.pointerId);
    if (!gest) return;
    const g = gest;
    if (ptrs.size > 0 && g.type === 'pinch') return;
    gest = null;

    if (g.type === 'pinch') { save(); kresliPlatno(); return; }

    if (g.type === 'tapAdd' && !g.moved) {
      const w = snapW(...s2w(g.start.x, g.start.y));
      if (!state.outlineDone && state.outline.length >= 3) {
        const f = w2s(state.outline[0][0], state.outline[0][1]);
        if (Math.hypot(f[0]-g.start.x, f[1]-g.start.y) <= 19) {
          state.outlineDone = true; save(); kresliMapu(); toast('Obrys uzavřen'); return;
        }
      }
      if (state.outlineDone) { state.selVert = null; save(); kresliMapu(); return; }
      state.outline.push(w); state.selVert = null; save(); kresliMapu(); return;
    }
    if (g.type === 'insert' && !g.moved) {
      const a = state.outline[g.i], b = state.outline[(g.i+1) % state.outline.length];
      state.outline.splice(g.i+1, 0, snapW((a[0]+b[0])/2, (a[1]+b[1])/2));
      state.selVert = g.i+1;
      save(); kresliMapu(); toast('Vrchol vložen'); return;
    }
    if (g.type === 'vertex') {
      if (g.moved) { save(); kresliMapu(); }
      else { state.selVert = (state.selVert === g.i) ? null : g.i; save(); kresliMapu(); }
      return;
    }
    if (g.type === 'erase') { save(); kresliMapu(); return; }

    if (g.type === 'rect') {
      const pv = preview; preview = null;
      const w = s2w(g.start.x, g.start.y);
      const box = pv || { prvek:g.prvek, x:Math.floor(w[0]), y:Math.floor(w[1]), w:1, h:1 };
      let keys = rectKeys(box.x, box.y, box.x+box.w, box.y+box.h);
      // na zamcene prvky se kreslit neda
      keys = keys.filter(k => { const o = ownerAt(k); return !o || !o.zamek; });
      if (!keys.length) { toast('Tahle část je zamčená'); kresliMapu(); return; }
      // ctverecky vedle sebe patri k jednomu prvku stejneho typu;
      // kvetinace jsou kazdy sam za sebe, proto se nikdy nespojuji
      const sousedi = new Set();
      if (!PRVKY[box.prvek].samostatny) keys.forEach(k => {
        const c = cxy(k);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(dd => {
          const o = ownerAt(ck(c[0]+dd[0], c[1]+dd[1]));
          if (o && o.typ === box.prvek && !o.zamek) sousedi.add(o.id);
        });
      });
      let target = null;
      if (sousedi.size) {
        const ids = [...sousedi];
        target = state.items[ids[0]];
        ids.slice(1).forEach(id => { const o = state.items[id]; if (o) { addCells(target, o.cells.slice()); } });
        addCells(target, keys);
      } else if (PRVKY[box.prvek].samostatny) {
        keys.forEach(k => { target = novyPrvek(box.prvek, [k]); });
      } else {
        target = novyPrvek(box.prvek, keys);
      }
      const fresh = !sousedi.size && keys.length === 1 || !sousedi.size;
      state.sel = null;
      save(); kresliMapu();
      if (fresh && target && roste(target) && !PRVKY[box.prvek].samostatny) dialogPrvku(target.id);
      return;
    }
    if (g.type === 'stretch') { save(); kresliMapu(); return; }
    if (g.type === 'move') {
      if (g.moved) { save(); kresliMapu(); }
      else { state.sel = g.id; save(); kresliMapu(); }
      return;
    }
    if (g.type === 'pan') {
      if (g.moved) { save(); return; }
      if (g.klep && state.sel !== g.klep) { state.sel = g.klep; save(); kresliMapu(); }
      else if (state.sel) { state.sel = null; save(); kresliMapu(); }
      return;
    }
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', finish);

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cvRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

}

/* ============ OBRAZOVKA: KALENDÁŘ ============ */
const DNY_ZKR = ['Po','Út','St','Čt','Pá','So','Ne'];
const UKON_PIX = { soil:'ryc', sow:'semeno', plant:'sazenice', care:'pece', harvest:'kosik' };
const ZAPIS_PIX = { voda:'konev', hnuj:'hnojivo', vysadba:'sazenice' };
const ZAPIS_NAZEV = { voda:'Zalito', hnuj:'Pohnojeno', vysadba:'Vyseto nebo vysazeno' };

/* Vsechno, co je v zahrade zapsane na konkretni den: zalivka, hnojeni, vysadba */
function zapisyPoDnech() {
  const map = {};
  const pridej = (iso, e) => { if (!iso) return; (map[iso] = map[iso] || []).push(e); };
  beds().forEach(b => {
    (b.zalivka || []).forEach(dt => pridej(dt, { typ:'voda', b }));
    (b.hnojeni || []).forEach(h => pridej(h.datum, { typ:'hnuj', b, co:h.co }));
    if (b.datumVysadby) pridej(b.datumVysadby, { typ:'vysadba', b });
  });
  return map;
}
const isoDne = (r, m, d) => r + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2);

function kresliKalendar() {
  const s = el('s-cal');
  const dnes = new Date();
  let rok = state.calRok ?? dnes.getFullYear();
  let mi = state.calMonth ?? dnes.getMonth();       // 0-11
  const m = mi + 1;
  const zapisy = zapisyPoDnech();

  // mrizka: tyden zacina pondelim
  const prvni = new Date(rok, mi, 1);
  const posun = (prvni.getDay() + 6) % 7;
  const dnuVMesici = new Date(rok, mi+1, 0).getDate();
  const dnuPred = new Date(rok, mi, 0).getDate();
  const bunky = [];
  for (let i = 0; i < posun; i++) bunky.push({ d: dnuPred - posun + 1 + i, out:true });
  for (let d = 1; d <= dnuVMesici; d++) bunky.push({ d, out:false, iso: isoDne(rok, m, d) });
  while (bunky.length % 7) bunky.push({ d: bunky.length - posun - dnuVMesici + 1, out:true });

  const dnesIso = todayISO();
  const moje = beds().map(b => ({ b, c: crop(b.cropId) })).filter(o => o.c);
  const ukMoje = [];
  moje.forEach(o => ukonyOf(o.c).filter(u => u.m === m).forEach(u => ukMoje.push({ ...u, c:o.c, b:o.b })));
  const ukOst = [];
  allCrops().forEach(c => {
    if (moje.some(o => o.c.id === c.id)) return;
    ukonyOf(c).filter(u => u.m === m).forEach(u => ukOst.push({ ...u, c, b:null }));
  });
  const poradi = { soil:0, sow:1, plant:2, care:3, harvest:4 };
  ukMoje.sort((a,b)=>poradi[a.typ]-poradi[b.typ]);
  ukOst.sort((a,b)=>poradi[a.typ]-poradi[b.typ]);
  const zapisuVMesici = bunky.filter(b => !b.out && zapisy[b.iso]).length;

  s.innerHTML = `<div class="scroll">
    <div class="sec" style="margin-top:14px">
      <div class="calhead">
        <button class="ar" id="c-prev" aria-label="Předchozí měsíc">‹</button>
        <span class="nm"><b>${esc(MESICE[mi])}</b><span>${rok}${zapisuVMesici ? ' · ' + zapisuVMesici + ' dnů se zápisem' : ''}</span></span>
        <button class="ar" id="c-next" aria-label="Další měsíc">›</button>
      </div>
      <div class="cal">
        ${DNY_ZKR.map(d=>`<div class="wd">${d}</div>`).join('')}
        ${bunky.map(b => {
          if (b.out) return `<div class="cday out">${b.d}</div>`;
          const ev = zapisy[b.iso] || [];
          const typy = [...new Set(ev.map(e=>e.typ))];
          return `<button class="cday ${b.iso===dnesIso?'dnes':(typy.length?'mam':'')}" data-den="${b.iso}">
            ${b.d}<span class="dots">${typy.slice(0,3).map(t=>`<i class="${t}"></i>`).join('')}</span></button>`;
        }).join('')}
      </div>
      <div class="callegend">
        <span><i style="background:var(--sky)"></i>zalito</span>
        <span><i style="background:var(--earth)"></i>hnojeno</span>
        <span><i style="background:var(--acc)"></i>výsev či výsadba</span>
      </div>
      ${mi !== dnes.getMonth() || rok !== dnes.getFullYear()
        ? `<button class="btn sm sec wide" id="c-dnes" style="margin-top:14px">Zpátky na dnešek</button>` : ''}

      <div class="sec-h" style="margin-top:26px"><h2>Co dělat v ${esc(MESICE[mi])}u</h2><span class="n">${ukMoje.length}</span></div>
      <div class="list">
        ${ukMoje.length ? ukMoje.map(u => radekUkonu(u, true)).join('')
          : `<div class="card"><div class="task"><span class="ti2" style="background:var(--bg2)">${pixSvg('klid')}</span>
             <span class="tm"><b>V ${esc(MESICE[mi])}u nic nečeká</b><span>Na tvých plodinách není tenhle měsíc žádný úkon.</span></span></div></div>`}
      </div>
      ${ukOst.length ? `<div class="sec-h" style="margin-top:24px"><h2>Co se dá dělat navíc</h2><span class="n">${ukOst.length}</span></div>
      <div class="list">${ukOst.map(u => radekUkonu(u, false)).join('')}</div>` : ''}
    </div>
  </div>`;

  const posun2 = (k) => {
    mi += k;
    if (mi < 0) { mi = 11; rok--; }
    if (mi > 11) { mi = 0; rok++; }
    state.calMonth = mi; state.calRok = rok; save(); kresliKalendar();
  };
  el('c-prev').onclick = () => posun2(-1);
  el('c-next').onclick = () => posun2(1);
  const cd = el('c-dnes');
  if (cd) cd.onclick = () => {
    state.calMonth = dnes.getMonth(); state.calRok = dnes.getFullYear(); save(); kresliKalendar();
  };
  s.querySelectorAll('[data-den]').forEach(b => b.onclick = () => dialogDne(b.dataset.den));
  s.querySelectorAll('[data-crop]').forEach(b => b.onclick = () => dialogPlodiny(b.dataset.crop));
}

/* Co se ten den v zahradě dělo a co se tam dá dopsat */
function dialogDne(iso) {
  const zapisy = (zapisyPoDnech()[iso] || []);
  const m = Number(iso.slice(5,7));
  const moje = beds().map(b => ({ b, c: crop(b.cropId) })).filter(o => o.c);
  const uk = [];
  moje.forEach(o => ukonyOf(o.c).filter(u => u.m === m).forEach(u => uk.push({ ...u, c:o.c, b:o.b })));
  const d = dialog(`<h2>${esc(formatDate(iso))}</h2>
    <p class="lead">${esc(DNY_ZKR[(new Date(iso+'T12:00:00').getDay()+6)%7])} · ${esc(relDays(iso)) || 'dnes'}</p>
    ${zapisy.length ? `<div class="list" style="margin-bottom:16px">
      ${zapisy.map(e=>`<div class="card row" style="padding:11px 12px">
        <span class="thumb" style="width:38px;height:38px;padding:5px">${pixSvg(ZAPIS_PIX[e.typ])}</span>
        <span class="mid"><b style="font-size:14.5px">${esc(ZAPIS_NAZEV[e.typ])}${e.co ? ' — ' + esc(e.co) : ''}</b>
          <span>${esc(e.b.nazev)}</span></span></div>`).join('')}
    </div>` : `<p class="note" style="margin-top:0">Na tenhle den nic zapsaného není.</p>`}
    ${uk.length ? `<div class="sec-h"><h2>Úkony měsíce</h2></div>
      <div class="list">${uk.slice(0,6).map(u=>`<div class="card task ${u.typ}">
        <span class="ti2">${pixSvg(UKON_PIX[u.typ])}</span>
        <span class="tm"><b>${esc(u.t)}</b><span>${esc(u.c.nazev)} · ${esc(u.b.nazev)}</span></span></div>`).join('')}</div>` : ''}
    <div class="dacts"><button class="btn wide" id="dn-ok">Zavřít</button></div>`);

}

function radekUkonu(u, moje) {
  return `<button class="card task ${u.typ}" data-crop="${u.c.id}" style="width:100%;text-align:left">
    <span class="ti2">${pixSvg(UKON_PIX[u.typ] || 'listek')}</span>
    <span class="tm"><b>${esc(u.t)}</b>
      <span>${esc(u.c.nazev)}${moje && u.b ? ' · ' + esc(u.b.nazev) : ''} · ${esc(TYP_LABEL[u.typ])}</span></span>
  </button>`;
}

/* ============ DIALOGY ============ */
function dialog(obsah) {
  zavri();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="dh"><i></i></div><div class="dc">${obsah}</div></div>`;
  ov.addEventListener('pointerdown', e => { if (e.target === ov) zavri(); });
  document.body.appendChild(ov);
  return ov;
}
function zavri() { const o = el('ov'); if (o) o.remove(); }
function potvrd(nadpis, text, ano) {
  const d = dialog(`<h2>${esc(nadpis)}</h2><p class="lead">${esc(text)}</p>
    <div class="dacts"><button class="btn sec" id="c-ne">Zrušit</button>
    <button class="btn" id="c-ano" style="background:var(--danger)">Potvrdit</button></div>`);
  d.querySelector('#c-ne').onclick = zavri;
  d.querySelector('#c-ano').onclick = () => { zavri(); ano(); };
}

/* --- prvek na plánu --- */
function dialogPrvku(id) {
  const it = state.items[id]; if (!it) return;
  const jeZahon = roste(it);
  const b = itBBox(it), obdelnik = isRect(it);
  const d = dialog(`
    <h2 style="display:flex;align-items:center;gap:10px">
      <span style="width:30px;height:30px;flex:none">${prvekPix(it.typ)}</span>${esc(PRVKY[it.typ].nazev)}</h2>
    <p class="lead">${fmtA(itArea(it))} · ${itArea(it)} čtverečků · ${obdelnik ? fmtDim(b.w,b.h) : 'nepravidelný tvar'}</p>
    ${!itemInside(it) ? `<div class="info" style="margin-bottom:16px">Tenhle prvek přesahuje obrys zahrady.</div>` : ''}
    <button class="btn sm sec wide" id="d-zamek" style="margin-bottom:16px">
      <span style="width:22px;height:22px;flex:none">${pixSvg(it.zamek?'zamek':'odemek')}</span>
      ${it.zamek ? 'Odemknout — teď se s ním nedá hýbat' : 'Zamknout, aby se s ním nehýbalo'}</button>
    <div class="field"><label for="d-nazev">Název</label><input id="d-nazev" value="${esc(it.nazev)}"></div>
    ${obdelnik && !it.zamek ? `<div class="row2">
      <div class="field"><label for="d-w">Šířka (m)</label><input type="number" id="d-w" min="1" step="1" value="${b.w}"></div>
      <div class="field"><label for="d-h">Délka (m)</label><input type="number" id="d-h" min="1" step="1" value="${b.h}"></div>
    </div>` : `<p class="note" style="margin-top:0">${it.zamek ? 'Rozměry jsou zamčené.' : 'Tvar je ze čtverečků. Měň ho na plánu kreslením a gumou.'}</p>`}
    ${jeZahon ? `
      <div class="field"><label for="d-crop">Co tu roste</label>
        <select id="d-crop"><option value="">— nic —</option>
        ${allCrops().map(c=>`<option value="${c.id}" ${it.cropId===c.id?'selected':''}>${c.nazev}</option>`).join('')}</select></div>
      ${odhadRostlin(it) != null ? `<div class="field"><label for="d-rost">Počet rostlin</label>
        <input type="number" id="d-rost" min="0" value="${pocetRostlin(it)}">
        <p class="note" style="margin-top:6px">Z plochy a rozestupu vychází ${odhadRostlin(it)}.</p></div>` : ''}
      <div class="field"><label for="d-datum">Datum výsevu</label><input type="date" id="d-datum" value="${esc(it.datumVysadby)}"></div>
      <div class="field"><label for="d-pozn">Poznámka</label><textarea id="d-pozn" placeholder="Odrůda, odkud sadba…">${esc(it.poznamka)}</textarea></div>

      <div class="field"><label>Hnojení</label>
        ${(it.hnojeni||[]).length ? `<div class="list" style="gap:7px;margin-bottom:9px">
          ${fertSeznam(it)}</div>` : `<p class="note" style="margin:0 0 9px">Zatím nic zapsaného.</p>`}
        <div class="row2">
          <div class="field" style="margin-bottom:9px"><input type="date" id="d-fd" value="${todayISO()}"></div>
          <div class="field" style="margin-bottom:9px"><select id="d-fc">${HNOJIVA.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
        </div>
        <button class="btn sm sec wide" id="d-fadd">Zapsat hnojení</button>
      </div>

      <div class="field"><label>Fotky záhonu</label>
        ${(it.fotky||[]).length ? `<div class="list" style="gap:7px;margin-bottom:9px">${fotoSeznam(it)}</div>` : ''}
        <button class="btn sm sec wide" id="d-foto">Přidat fotku</button>
      </div>` : ''}
    <div class="dacts">
      <button class="btn sec" id="d-smaz" style="color:var(--danger)">Smazat</button>
      <button class="btn" id="d-ulozit">Uložit</button>
    </div>`);

  const q = (x) => d.querySelector(x);
  q('#d-zamek').onclick = () => {
    it.zamek = !it.zamek; save(); dialogPrvku(id); kresliMapu(); kresliZahonky();
    toast(it.zamek ? 'Zamčeno' : 'Odemčeno');
  };
  if (jeZahon) {
    q('#d-fadd').onclick = () => {
      it.hnojeni = it.hnojeni || [];
      it.hnojeni.push({ datum: q('#d-fd').value || todayISO(), co: q('#d-fc').value, mnozstvi:'', pozn:'' });
      save(); dialogPrvku(id); kresliZahonky(); toast('Hnojení zapsáno');
    };
    q('#d-foto').onclick = () => pridejFotku(id, () => dialogPrvku(id));
    d.querySelectorAll('[data-frm]').forEach(x => x.onclick = () => {
      it.hnojeni.splice(Number(x.dataset.frm),1); save(); dialogPrvku(id); kresliZahonky();
    });
    d.querySelectorAll('[data-form]').forEach(x => x.onclick = () => {
      it.fotky.splice(Number(x.dataset.form),1); save(); dialogPrvku(id); kresliZahonky();
    });
  }
  q('#d-ulozit').onclick = () => {
    it.nazev = q('#d-nazev').value || it.nazev;
    if (obdelnik && q('#d-w')) {
      const w = parseInt(q('#d-w').value,10), hh = parseInt(q('#d-h').value,10);
      if (w>0 && hh>0 && (w!==b.w || hh!==b.h)) reshapeRect(it, w, hh);
    }
    if (jeZahon) {
      it.cropId = q('#d-crop').value || null;
      const rf = q('#d-rost');
      if (rf) { const rv = parseInt(rf.value,10); it.rostliny = (rv>=0 && rv!==odhadRostlin(it)) ? rv : null; }
      it.datumVysadby = q('#d-datum').value;
      it.poznamka = q('#d-pozn').value;
    }
    save(); zavri(); kresliMapu(); kresliZahonky(); toast('Uloženo');
  };
  q('#d-smaz').onclick = () => {
    if (it.zamek) { toast('Nejdřív ho odemkni'); return; }
    potvrd('Smazat ' + it.nazev + '?', 'Zmizí z plánu i ze Záhonků, včetně fotek a zápisů.', () => {
      delete state.items[id]; save(); zavri(); kresliMapu(); kresliZahonky(); toast('Smazáno');
    });
  };
}
const fertSeznam = (it) => fotkyRadky((it.hnojeni||[]).slice().sort((a,b)=>a.datum<b.datum?1:-1).map(f => {
  const i = it.hnojeni.indexOf(f);
  return `<div class="card row" style="padding:10px 12px">
    <span class="mid"><b style="font-size:14px">${esc(f.co)}</b><span>${esc(formatDate(f.datum))} · ${esc(relDays(f.datum))}</span></span>
    <button class="tag" data-frm="${i}">×</button></div>`;
}));
const fotoSeznam = (it) => fotkyRadky(fotky(it).map(f => {
  const i = (it.fotky||[]).indexOf(f);
  return `<div class="card row" style="padding:8px">
    <img src="${f.data}" style="width:64px;height:48px;object-fit:cover;border-radius:9px;flex:none" alt="">
    <span class="mid"><b style="font-size:14px">${esc(formatDate(f.datum))}</b><span>${esc(relDays(f.datum))}</span></span>
    <button class="tag" data-form="${i}">×</button></div>`;
}));
const fotkyRadky = (a) => a.join('');

/* --- fotky --- */
let fotoCil = null, fotoPotom = null;
function pridejFotku(id, potom) {
  fotoCil = id; fotoPotom = potom || null;
  let inp = el('inp-foto');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'inp-foto'; inp.hidden = true;
    inp.setAttribute('capture','environment');
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f || !fotoCil) return;
      const it = state.items[fotoCil]; if (!it) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 1100, (data) => {
        it.fotky = it.fotky || [];
        it.fotky.push({ data, datum: todayISO() });
        save(); kresliZahonky(); toast('Fotka přidána');
        if (fotoPotom) fotoPotom();
      });
      r.readAsDataURL(f);
    };
  }
  inp.click();
}
function prohlizecFotek(bedId, idx) {
  const it = state.items[bedId]; if (!it) return;
  const fs = fotky(it); if (!fs.length) return;
  let i = clamp(idx, 0, fs.length-1);
  const kresli = () => {
    const f = fs[i];
    const d = dialog(`<h2>${esc(it.nazev)}</h2>
      <p class="lead">${esc(formatDate(f.datum))} · ${esc(relDays(f.datum))} · ${i+1} z ${fs.length}</p>
      <img src="${f.data}" style="width:100%;border-radius:var(--r);display:block" alt="">
      <div class="dacts"><button class="btn sec" id="f-st" ${i>=fs.length-1?'disabled':''}>Starší</button>
      <button class="btn sec" id="f-no" ${i===0?'disabled':''}>Novější</button></div>
      <div class="dacts"><button class="btn" id="f-ok">Zavřít</button></div>`);
    d.querySelector('#f-ok').onclick = zavri;
    const a = d.querySelector('#f-st'), b = d.querySelector('#f-no');
    if (a) a.onclick = () => { if (i<fs.length-1){i++;kresli();} };
    if (b) b.onclick = () => { if (i>0){i--;kresli();} };
  };
  kresli();
}

    ${c.zaliv ? `<div class="sec-h"><h2>Zálivka</h2></div><p style="margin:0 0 16px;font-size:14.5px;line-height:1.55">${esc(c.zaliv)}</p>` : ''}
    ${c.sousedi ? `<div class="sec-h"><h2>Sousedé</h2></div><p style="margin:0 0 16px;font-size:14.5px;line-height:1.55">${esc(c.sousedi)}</p>` : ''}
    <div class="sec-h"><h2>Parametry</h2></div>

      Na m²: <b>${c.hustota >= 1 ? Math.round(c.hustota)+' rostlin' : fmtN(1/c.hustota)+' m² na rostlinu'}</b></p>
    <div class="sec-h"><h2>Kde koupit</h2></div>
    <div class="field"><input id="p-odruda" value="${esc(p.odruda)}" placeholder="Odrůda, kterou chci"></div>
    <div class="chips" style="margin-bottom:16px">
      ${shops().map(o=>`<button class="chip ${p.shops.includes(o.id)?'on':''}" data-shop="${o.id}">${esc(o.nazev)}</button>`).join('')}
    </div>
    <div class="sec-h"><h2>Úkony v roce</h2></div>
    <div class="list" style="margin-bottom:16px">
      ${ukonyOf(c).slice().sort((a,b)=>a.m-b.m).map(u=>`<div class="card task ${u.typ}">
        <span class="ti2">${cropArt(c)}</span>
        <span class="tm"><b>${esc(u.t)}</b><span>${esc(MESICE[u.m-1])} · ${esc(TYP_LABEL[u.typ])}</span></span></div>`).join('')}
    </div>
    <div class="dacts">
      <button class="btn sec" id="p-edit">Upravit plodinu</button>
      <button class="btn" id="p-ok">Zavřít</button>
    </div>`);
  d.querySelector('#p-hero').onclick = () => addCropFoto(c.id, () => dialogPlodiny(c.id));
  const od = d.querySelector('#p-odruda');
  d.querySelectorAll('[data-shop]').forEach(b => b.onclick = () => {
    const cur = planOf(c.id).shops.slice();
    const i = cur.indexOf(b.dataset.shop);
    if (i>=0) cur.splice(i,1); else cur.push(b.dataset.shop);
    setPlan(c.id, { shops: cur });
    b.classList.toggle('on', cur.includes(b.dataset.shop));
  });
  d.querySelector('#p-edit').onclick = () => { setPlan(c.id,{odruda:od.value.trim()}); editorPlodiny(c.id); };
  d.querySelector('#p-ok').onclick = () => { setPlan(c.id,{odruda:od.value.trim()}); zavri(); kresliPlodiny(); kresliZahonky(); };
}

let cfotoCil = null, cfotoPotom = null;
function addCropFoto(cropId, potom) {
  cfotoCil = cropId; cfotoPotom = potom || null;
  let inp = el('inp-cfoto');
  if (!inp) {
    inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.id='inp-cfoto'; inp.hidden=true;
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value='';
      if (!f || !cfotoCil) return;
      const r = new FileReader();
      r.onload = () => shrinkImage(r.result, 900, (data) => {
        if (!state.cropFoto) state.cropFoto = {};
        state.cropFoto[cfotoCil] = (state.cropFoto[cfotoCil]||[]).concat([data]);
        save(); kresliPlodiny(); toast('Fotka přidána');
        if (cfotoPotom) cfotoPotom();
      });
      r.readAsDataURL(f);
    };
  }
  inp.click();
}

/* --- editor plodiny --- */
const IKONY_UKONU = { soil:'🪏', sow:'🌱', plant:'🌿', care:'✂️', harvest:'🧺' };
function editorPlodiny(id) {
  const orig = id ? crop(id) : null;
  const c = orig ? JSON.parse(JSON.stringify(orig))
    : { id:'', nazev:'', lat:'', emoji:'🌱', kat:'Plodová', sow:[], plant:[], harvest:[],
        hustota:9, rozestup:'', hloubka:'', slunce:'', pozor:'', rady:'', zaliv:'', sousedi:'', ukony:[] };
  const novy = !id, vlastni = id ? jeVlastni(id) : true;
  const mes = (k, popis) => `<div class="field"><label>${popis}</label>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:3px">
      ${MESICE_KR.map((z,i)=>`<button type="button" class="chip" style="height:36px;padding:0;border-radius:8px;font-size:11px;justify-content:center;display:grid;place-items:center${(c[k]||[]).includes(i+1)?';background:var(--acc);border-color:var(--acc);color:var(--acc-ink)':''}" data-mg="${k}" data-mi="${i+1}">${z}</button>`).join('')}
    </div></div>`;
  const d = dialog(`
    <h2>${novy ? 'Nová plodina' : 'Upravit ' + esc(c.nazev)}</h2>
    <p class="lead">${novy ? 'Měsíce se propíšou do kalendáře.' : (vlastni ? 'Tvoje plodina.' : 'Úpravy se uloží jen u tebe.')}</p>
    <div class="row2">
      <div class="field" style="flex:0 0 88px"><label for="e-emoji">Značka</label><input id="e-emoji" value="${esc(c.emoji)}" maxlength="3"></div>
      <div class="field"><label for="e-nazev">Název</label><input id="e-nazev" value="${esc(c.nazev)}" placeholder="Pastiňák"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="e-lat">Latinsky</label><input id="e-lat" value="${esc(c.lat)}"></div>
      <div class="field"><label for="e-kat">Kategorie</label><input id="e-kat" list="kats" value="${esc(c.kat)}">
        <datalist id="kats">${kategorie().filter(k=>k!=='Vše').map(k=>`<option value="${esc(k)}">`).join('')}</datalist></div>
    </div>
    ${mes('sow','Měsíce výsevu')}${mes('plant','Měsíce výsadby')}${mes('harvest','Měsíce sklizně')}
    <div class="row2">
      <div class="field"><label for="e-hust">Rostlin na m²</label><input type="number" id="e-hust" step="0.1" min="0.1" value="${c.hustota||9}"></div>
      <div class="field"><label for="e-roz">Rozestup</label><input id="e-roz" value="${esc(c.rozestup)}" placeholder="30 × 40 cm"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="e-hl">Hloubka</label><input id="e-hl" value="${esc(c.hloubka)}"></div>
      <div class="field"><label for="e-sl">Stanoviště</label><input id="e-sl" value="${esc(c.slunce)}"></div>
    </div>
    <div class="field"><label for="e-poz">Na co pozor</label><textarea id="e-poz">${esc(c.pozor)}</textarea></div>
    <div class="field"><label for="e-rad">Jak na to</label><textarea id="e-rad">${esc(c.rady)}</textarea></div>
    <div class="field"><label for="e-zal">Zálivka</label><textarea id="e-zal">${esc(c.zaliv)}</textarea></div>
    <div class="field"><label for="e-sou">Sousedé</label><textarea id="e-sou">${esc(c.sousedi)}</textarea></div>
    <div class="field"><label>Úkony</label><div id="e-ukony">${(c.ukony||[]).map(radekEditoru).join('')}</div>
      <button class="btn sm sec wide" id="e-ukon-add" style="margin-top:8px">Přidat úkon</button>
      ${!(c.ukony||[]).length ? `<p class="note">Bez vlastních úkonů se do kalendáře propíše prostý Výsev, Výsadba a Sklizeň podle měsíců.</p>` : ''}</div>
    <div class="dacts"><button class="btn sec" id="e-zrus">Zrušit</button><button class="btn" id="e-ok">Uložit</button></div>
    ${!novy && vlastni ? `<div class="dacts"><button class="btn sec wide" id="e-smaz" style="color:var(--danger)">Smazat plodinu</button></div>` : ''}
    ${!novy && !vlastni && jeUpravena(id) ? `<div class="dacts"><button class="btn sec wide" id="e-reset">Vrátit původní</button></div>` : ''}`);

  d.querySelectorAll('[data-mg]').forEach(b => b.onclick = () => {
    const k = b.dataset.mg, m = Number(b.dataset.mi);
    c[k] = c[k] || [];
    const i = c[k].indexOf(m);
    if (i>=0) c[k].splice(i,1); else c[k].push(m);
    const on = c[k].includes(m);
    b.style.background = on ? 'var(--acc)' : ''; b.style.borderColor = on ? 'var(--acc)' : '';
    b.style.color = on ? 'var(--acc-ink)' : '';
  });
  const sez = d.querySelector('#e-ukony');
  const napojUkony = () => sez.querySelectorAll('[data-ur]').forEach(b => b.onclick = () => { b.closest('.ur').remove(); });
  d.querySelector('#e-ukon-add').onclick = () => {
    sez.insertAdjacentHTML('beforeend', radekEditoru({ m:new Date().getMonth()+1, t:'', typ:'care' }));
    napojUkony();
  };
  napojUkony();
  d.querySelector('#e-zrus').onclick = zavri;
  d.querySelector('#e-ok').onclick = () => {
    const q = (x) => d.querySelector(x);
    const nazev = q('#e-nazev').value.trim();
    if (!nazev) { toast('Napiš název plodiny'); return; }
    const ukony = [];
    sez.querySelectorAll('.ur').forEach(r => {
      const t = r.querySelector('[data-ut]').value.trim(); if (!t) return;
      const typ = r.querySelector('[data-uk]').value;
      ukony.push({ m:Number(r.querySelector('[data-um]').value), t, typ, ic: IKONY_UKONU[typ]||'✂️' });
    });
    const data = { nazev, lat:q('#e-lat').value.trim(), emoji:q('#e-emoji').value.trim()||'🌱',
      kat:q('#e-kat').value.trim()||'Ostatní',
      sow:(c.sow||[]).slice().sort((a,b)=>a-b), plant:(c.plant||[]).slice().sort((a,b)=>a-b),
      harvest:(c.harvest||[]).slice().sort((a,b)=>a-b),
      hustota:Math.max(0.1, parseFloat(q('#e-hust').value)||9),
      rozestup:q('#e-roz').value.trim(), hloubka:q('#e-hl').value.trim(), slunce:q('#e-sl').value.trim(),
      pozor:q('#e-poz').value.trim(), rady:q('#e-rad').value.trim(),
      zaliv:q('#e-zal').value.trim(), sousedi:q('#e-sou').value.trim(), ukony };
    if (novy) {
      state.customCrops = (state.customCrops||[]).concat([Object.assign({ id:'u'+Date.now().toString(36) }, data)]);
    } else if (vlastni) {
      const i = state.customCrops.findIndex(x => x.id === id);
      if (i>=0) state.customCrops[i] = Object.assign({ id }, data);
    } else {
      state.cropEdits = state.cropEdits || {};
      state.cropEdits[id] = data;
    }
    save(); zavri(); kresliPlodiny(); kresliZahonky(); toast(novy ? 'Plodina přidána' : 'Uloženo');
  };
  const sm = d.querySelector('#e-smaz');
  if (sm) sm.onclick = () => potvrd('Smazat '+c.nazev+'?','Záhonky s ní zůstanou bez plodiny.', () => {
    state.customCrops = state.customCrops.filter(x => x.id !== id);
    beds().forEach(b => { if (b.cropId === id) b.cropId = null; });
    save(); zavri(); kresliPlodiny(); kresliZahonky(); toast('Smazáno');
  });
  const rs = d.querySelector('#e-reset');
  if (rs) rs.onclick = () => { delete state.cropEdits[id]; save(); zavri(); kresliPlodiny(); toast('Vráceno'); };
}
function radekEditoru(u) {
  return `<div class="ur" style="display:flex;gap:6px;margin-bottom:7px">
    <select data-um style="flex:0 0 76px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 6px;font-size:13px;font-weight:600">
      ${MESICE.map((n,i)=>`<option value="${i+1}" ${u.m===i+1?'selected':''}>${n.slice(0,3)}</option>`).join('')}</select>
    <select data-uk style="flex:0 0 96px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 6px;font-size:13px;font-weight:600">
      ${Object.keys(TYP_LABEL).map(k=>`<option value="${k}" ${u.typ===k?'selected':''}>${TYP_LABEL[k]}</option>`).join('')}</select>
    <input data-ut value="${esc(u.t)}" placeholder="Co udělat" style="flex:1;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-size:13.5px;font-weight:600">
    <button class="tag" data-ur style="flex:0 0 36px;justify-content:center">×</button></div>`;
}

/* --- obchod --- */
function dialogObchodu(id) {
  const o = id ? shopOf(id) : null;
  const d = dialog(`<h2>${o ? 'Upravit obchod' : 'Nový obchod'}</h2>
    <p class="lead">${o ? '' : 'E-shop, zahradnictví nebo soused, co dává sadbu.'}</p>
    <div class="field"><label for="o-n">Název</label><input id="o-n" value="${esc(o?o.nazev:'')}" placeholder="Zahradnictví u nádraží"></div>
    <div class="field"><label for="o-u">Odkaz nebo adresa</label><input id="o-u" value="${esc(o?o.url:'')}" placeholder="https://…"></div>
    <div class="field"><label for="o-i">Ikona</label><input id="o-i" value="${esc(o?(o.ico||'🛒'):'🛒')}" maxlength="3"></div>
    <div class="field"><label for="o-p">Poznámka</label><textarea id="o-p">${esc(o?o.pozn:'')}</textarea></div>
    <div class="dacts"><button class="btn sec" id="o-zrus">Zrušit</button><button class="btn" id="o-ok">Uložit</button></div>`);
  d.querySelector('#o-zrus').onclick = zavri;
  d.querySelector('#o-ok').onclick = () => {
    const nazev = d.querySelector('#o-n').value.trim();
    if (!nazev) { toast('Napiš název'); return; }
    let url = d.querySelector('#o-u').value.trim();
    if (url && !/^https?:\/\//i.test(url) && /\.[a-z]{2,}/i.test(url) && !/\s/.test(url)) url = 'https://' + url;
    const pozn = d.querySelector('#o-p').value.trim(), ico = d.querySelector('#o-i').value.trim() || '🛒';
    if (o) Object.assign(o, { nazev, url, pozn, ico });
    else {
      const nid = 'v' + (state.nextShop = (state.nextShop||1) + 1);
      state.shops[nid] = { id:nid, nazev, url, pozn, ico, vlastni:true };
    }
    save(); zavri(); kresliPlodiny(); toast('Uloženo');
  };
}

load();
el('bar-mark').innerHTML = LOGO_KOZEL;
el('bar-ver').textContent = VERZE;
el('bar-theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const tmavy = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', tmavy ? 'light' : 'dark');
  state.theme = tmavy ? 'light' : 'dark'; save();
  if (state.tab === 'map') kresliPlatno();
};
if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
document.querySelectorAll('[data-pix]').forEach(x => { x.innerHTML = pixSvg(x.dataset.pix); });
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => prepni(b.dataset.tab));
document.addEventListener('keydown', e => { if (e.key === 'Escape') zavri(); });
window.addEventListener('resize', () => { if (state.tab === 'map') { posadPanel(); scheduleRender(); } });
prepni(state.tab || 'map');
if (!state.view) requestAnimationFrame(() => requestAnimationFrame(() => fitView()));
