  });
  const list = m.querySelector('#ukon-list');
  m.querySelector('#ukon-add').onclick = () => {
    const i = list.querySelectorAll('.ukon-row').length;
    list.insertAdjacentHTML('beforeend', ukonRow({ m:new Date().getMonth()+1, t:'', typ:'care', ic:'✂️' }, i));
    bindUkonRows(list);
  };
  bindUkonRows(list);
  m.querySelector('#c-cancel').onclick = closeModal;
  m.querySelector('#c-save').onclick = () => {
    const nazev = m.querySelector('#c-nazev').value.trim();
    if (!nazev) { toast('Napiš název plodiny'); return; }
    const sbirej = {};
    ['sow','plant','harvest'].forEach(k => { sbirej[k] = (c[k]||[]).slice().sort((a,b)=>a-b); });
    const ukony = [];
    list.querySelectorAll('.ukon-row').forEach(r => {
      const t = r.querySelector('[data-ut]').value.trim();
      if (!t) return;
      const typ = r.querySelector('[data-uk]').value;
      ukony.push({ m: Number(r.querySelector('[data-um]').value), t, typ, ic: IKONY_UKONU[typ] || '✂️' });
    });
    const data = {
      nazev,
      lat: m.querySelector('#c-lat').value.trim(),
      emoji: m.querySelector('#c-emoji').value.trim() || '🌱',
      kat: m.querySelector('#c-kat').value.trim() || 'Ostatní',
      sow: sbirej.sow, plant: sbirej.plant, harvest: sbirej.harvest,
      hustota: Math.max(0.1, parseFloat(m.querySelector('#c-hust').value) || 9),
      rozestup: m.querySelector('#c-rozestup').value.trim(),
      hloubka: m.querySelector('#c-hloubka').value.trim(),
      slunce: m.querySelector('#c-slunce').value.trim(),
      pozor: m.querySelector('#c-pozor').value.trim(),
      rady: m.querySelector('#c-rady').value.trim(),
      zaliv: m.querySelector('#c-zaliv').value.trim(),
      sousedi: m.querySelector('#c-sousedi').value.trim(),
      ukony,
    };
    if (novy) {
      const nid = 'u' + Date.now().toString(36);
      state.customCrops = (state.customCrops || []).concat([Object.assign({ id:nid }, data)]);
    } else if (vlastni) {
      const i = state.customCrops.findIndex(x => x.id === id);
      if (i >= 0) state.customCrops[i] = Object.assign({ id }, data);
    } else {
      state.cropEdits = state.cropEdits || {};
      state.cropEdits[id] = data;
    }
    save(); closeModal(); renderCrops(); renderBeds(); renderCalendar();
    toast(novy ? 'Plodina přidána' : 'Plodina uložena');
  };
  const del = m.querySelector('#c-del');
  if (del) del.onclick = () => confirmDialog('Smazat ' + c.nazev + '?', 'Zmizí ze seznamu. Záhonky, kde je přiřazená, zůstanou bez plodiny.', () => {
    state.customCrops = state.customCrops.filter(x => x.id !== id);
    beds().forEach(b => { if (b.cropId === id) b.cropId = null; });
    save(); closeModal(); renderCrops(); renderBeds(); renderCalendar(); toast('Plodina smazána');
  });
  const res = m.querySelector('#c-reset');
  if (res) res.onclick = () => confirmDialog('Vrátit původní?', 'Tvoje úpravy téhle plodiny se zahodí.', () => {
    delete state.cropEdits[id];
    save(); closeModal(); renderCrops(); renderBeds(); renderCalendar(); toast('Vráceno na původní');
  });
}
const IKONY_UKONU = { soil:'🪏', sow:'🌱', plant:'🌿', care:'✂️', harvest:'🧺' };
function ukonRow(u, i) {
  return `<div class="ukon-row">
    <select data-um aria-label="Měsíc">${MESICE.map((nm,j)=>`<option value="${j+1}" ${u.m===j+1?'selected':''}>${nm.slice(0,3)}</option>`).join('')}</select>
    <select data-uk aria-label="Typ">${Object.keys(TYP_LABEL).map(k=>`<option value="${k}" ${u.typ===k?'selected':''}>${TYP_LABEL[k]}</option>`).join('')}</select>
    <input data-ut value="${esc(u.t)}" placeholder="Co udělat" aria-label="Úkon">
    <button class="fi-rm" data-ur="${i}" aria-label="Odebrat úkon">×</button>
  </div>`;
}
function bindUkonRows(list) {
  list.querySelectorAll('[data-ur]').forEach(b => b.onclick = () => {
    b.closest('.ukon-row').remove();
  });
}

function confirmDialog(title, text, onYes) {
  const back = openModal(`
    <h2>${esc(title)}</h2>
    <p class="m-lead">${esc(text)}</p>
    <div class="modal-actions">
      <button class="btn ghost" id="c-no">Zrušit</button>
      <button class="btn" id="c-yes" style="background:var(--danger)">Potvrdit</button>
    </div>`);
  back.querySelector('#c-no').onclick = closeModal;
  back.querySelector('#c-yes').onclick = () => { closeModal(); onYes(); };
}

let toastT = null;
function toast(msg) {
  let t = el('toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:opacity .2s;max-width:88vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

/* ============ NAVIGACE ============ */
function switchTab(tab) {
  state.tab = tab; save();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el('screen-'+tab).classList.add('active');
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab==='garden') { renderGarden(); requestAnimationFrame(renderCanvas); }
  if (tab==='beds') renderBeds();
  if (tab==='crops') renderCrops();
  if (tab==='calendar') renderCalendar();
  if (tab==='weather') renderWeather();
  if (tab==='shops') renderShops();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ============ START ============ */
load();

const now = new Date();
el('season-label').textContent = sezona(now.getMonth()+1) + ' · ' + MESICE[now.getMonth()];

document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

el('theme-btn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  state.theme = dark ? 'light' : 'dark'; save();
  if (state.tab === 'garden') renderCanvas();
};
if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' || e.key === ' ') {
    const t = e.target;
    if (t && t.classList && t.classList.contains('task') && t.dataset.crop) { e.preventDefault(); openCropDetail(t.dataset.crop); }
  }
});
window.addEventListener('resize', () => { if (state.tab === 'garden') scheduleRender(); });

switchTab(state.tab || 'garden');
if (!state.view) requestAnimationFrame(() => fitView());
</script>
