<meta name="claude:viewport-fit-sides" content="cover">
<title>Koza Zahradník</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: mobilní aplikace s dolní navigací; plánovač je tečkovaný papír v metrech s panningem a zoomem */
:root {
  --bg: #f4f6f1;
  --surface: #ffffff;
  --surface-2: #eef1e9;
  --fg: #26301f;
  --fg-soft: #5d6b52;
  --fg-faint: #8a9680;
  --line: #d9e0cf;
  --accent: #5a8c3e;
  --accent-deep: #3f6a29;
  --accent-soft: #e4efd6;
  --soil: #a9794f;
  --soil-soft: #efe2d3;
  --sky: #5b9bc4;
  --sun: #e4a93c;
  --warn: #c7622d;
  --danger: #b23b3b;
  --paper: #fbfbf7;
  --dot: #b4c0a2;
  --grid5: #e7ecde;
  --house: #868b95;
  --house-fill: #dde0e6;
  --paved: #bcae97;
  --paved-fill: #ece5d8;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 10px rgba(40,56,28,.08);
  --shadow-up: 0 -2px 14px rgba(40,56,28,.07);
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Nunito Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1f17;
    --surface: #242b1f;
    --surface-2: #2d3626;
    --fg: #e8ecdf;
    --fg-soft: #a8b399;
    --fg-faint: #78836a;
    --line: #38412e;
    --accent: #7fb45c;
    --accent-deep: #9fcd7d;
    --accent-soft: #313d24;
    --soil: #c49468;
    --soil-soft: #3a3127;
    --sky: #6fb0d8;
    --sun: #e8b857;
    --warn: #e0824a;
    --danger: #e06a6a;
    --paper: #1e2419;
    --dot: #4a5740;
    --grid5: #2b3324;
    --house: #7f8794;
    --house-fill: #333a46;
    --paved: #8c7f6a;
    --paved-fill: #342e25;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
    --shadow-up: 0 -2px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1f17;
  --surface: #242b1f;
  --surface-2: #2d3626;
  --fg: #e8ecdf;
  --fg-soft: #a8b399;
  --fg-faint: #78836a;
  --line: #38412e;
  --accent: #7fb45c;
  --accent-deep: #9fcd7d;
  --accent-soft: #313d24;
  --soil: #c49468;
  --soil-soft: #3a3127;
  --sky: #6fb0d8;
  --sun: #e8b857;
  --warn: #e0824a;
  --danger: #e06a6a;
  --paper: #1e2419;
  --dot: #4a5740;
  --grid5: #2b3324;
  --house: #7f8794;
  --house-fill: #333a46;
  --paved: #8c7f6a;
  --paved-fill: #342e25;
  --shadow: 0 2px 12px rgba(0,0,0,.3);
  --shadow-up: 0 -2px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
button { font-family: inherit; cursor: pointer; }

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

/* ---- Top bar ---- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-block: 12px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 10px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 25;
  background: var(--surface);
}
.topbar .mark {
  width: 34px; height: 34px; flex: none;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--accent), var(--accent-deep));
  display: grid; place-items: center; overflow: hidden;
}
.topbar .mark svg { width: 25px; height: 25px; }
.topbar h1 { font-size: 18.5px; letter-spacing: -.015em; white-space: nowrap; }
.topbar .sub { font-size: 11.5px; color: var(--fg-faint); font-weight: 600; letter-spacing: .02em; }
.topbar .spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 10px; display: grid; place-items: center; color: var(--fg-soft);
}
.icon-btn svg { width: 18px; height: 18px; }

/* ---- Screen area ---- */
main {
  flex: 1;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 90px;
}
.screen { display: none; }
.screen.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen.active { animation: none; } }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 2px 12px; }
.section-head h2 { font-size: 22px; letter-spacing: -.015em; }
.section-head .count { font-size: 12.5px; color: var(--fg-faint); font-weight: 700; }
.lead { color: var(--fg-soft); font-size: 13.5px; margin: -6px 2px 16px; }

/* ---- Buttons ---- */
.btn {
  border: none; border-radius: 10px; padding: 11px 16px; font-weight: 700; font-size: 14px;
  background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: 7px;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.sm { padding: 8px 12px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---- Plánovač ---- */
.addr-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px; margin-bottom: 12px;
}
.addr-row { display: flex; gap: 8px; }
.addr-row input {
  flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px;
}
.addr-row input::placeholder { color: var(--fg-faint); }
.addr-note { font-size: 11.5px; color: var(--fg-faint); margin: 8px 2px 0; line-height: 1.45; }

.toolrow { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 7px; margin-bottom: 9px; scrollbar-width: none; }
.toolrow::-webkit-scrollbar { display: none; }
.tool {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg-soft);
  border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 12.5px;
  display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; flex: none;
}
.tool.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tool svg { width: 15px; height: 15px; }
.tool i.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.15); }

.canvas-wrap {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; position: relative;
}
#canvas {
  position: relative; height: clamp(320px, 52vh, 460px);
  touch-action: none; background-color: var(--paper); overflow: hidden;
}
#cv-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cv-empty {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: 24px; pointer-events: none;
}
.cv-empty div { max-width: 270px; }
.cv-empty .ce-ico { font-size: 34px; margin-bottom: 8px; }
.cv-empty h3 { font-size: 16px; margin-bottom: 5px; }
.cv-empty p { font-size: 13px; color: var(--fg-soft); margin: 0; }
.scalebar {
  position: absolute; left: 10px; bottom: 10px; pointer-events: none;
  font-size: 10.5px; font-weight: 800; color: var(--fg-soft);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  padding: 4px 7px; border-radius: 7px; display: flex; align-items: flex-end; gap: 7px;
}
.scalebar .bar { height: 7px; border-left: 2px solid var(--fg-soft); border-right: 2px solid var(--fg-soft); border-bottom: 2px solid var(--fg-soft); }
.zoomer { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomer button {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--fg);
  font-size: 18px; font-weight: 800; display: grid; place-items: center; line-height: 1;
}
.zoomer button svg { width: 17px; height: 17px; }
.cv-hint {
  position: absolute; left: 10px; top: 10px; right: 10px; pointer-events: none;
  background: color-mix(in srgb, var(--accent-deep) 93%, transparent); color: #fff;
  font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 9px;
  box-shadow: var(--shadow); line-height: 1.4;
}
.stats { display: flex; gap: 8px; margin-top: 11px; }
.stat { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; }
.stat .s-val { font-family: var(--font-display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .s-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--fg-faint); margin-top: 1px; }
.actrow { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
.selbar {
  display: flex; align-items: center; gap: 10px; margin-top: 11px;
  background: var(--surface); border: 1px solid var(--accent); border-left-width: 4px;
  border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 10px 11px;
}
.selbar .sl-ico { font-size: 20px; flex: none; }
.selbar .sl-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.selbar .sl-name { font-weight: 800; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selbar .sl-meta { font-size: 11.5px; color: var(--fg-faint); font-weight: 700; }
.hint { font-size: 12.5px; color: var(--fg-faint); margin: 11px 2px 0; line-height: 1.5; }

/* ---- Záhonky ---- */
.bed-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
}
.bed-card .bc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.mini-wrap { flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 3px; line-height: 0; display: grid; place-items: center; width: 80px; height: 80px; }
.mini { display: block; }
.bed-card .swatch { width: 32px; height: 32px; border-radius: 8px; background: var(--soil); display: grid; place-items: center; font-size: 17px; flex: none; }
.bed-card .swatch.planted { background: var(--accent-soft); }
.bed-card h3 { font-size: 16px; }
.bed-card .bc-meta { font-size: 12px; color: var(--fg-faint); font-weight: 600; }
.bed-card .bc-crop { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; flex-wrap: wrap; }
.bed-card .bc-crop.empty { color: var(--fg-faint); }
.bed-card .bc-actions { display: flex; gap: 8px; margin-top: 10px; }
.photo-strip {
  display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
  margin: -14px -14px 12px; padding: 0 14px; scrollbar-width: none;
}
.photo-strip::-webkit-scrollbar { display: none; }
.photo-strip .ps-item {
  margin: 0; flex: none; scroll-snap-align: start; position: relative;
  width: 86%; max-width: 420px; border-radius: 0 0 10px 10px; overflow: hidden;
}
.photo-strip .ps-item:first-child { border-radius: 13px 13px 10px 10px; }
.photo-strip .ps-item img { width: 100%; height: 168px; object-fit: cover; display: block; }
.photo-strip .ps-item figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to top, rgba(0,0,0,.72), transparent);
  color: #fff; font-size: 11.5px; font-weight: 700; padding: 18px 10px 7px;
}
.photo-strip .ps-add {
  flex: none; width: 72px; align-self: stretch; border: 1.5px dashed var(--line);
  background: var(--bg); color: var(--fg-faint); border-radius: 10px; font-size: 24px;
}
.photo-strip-add {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  margin-bottom: 12px; padding: 13px; border: 1.5px dashed var(--line); background: var(--bg);
  border-radius: var(--radius-sm); color: var(--fg-soft); font-weight: 700; font-size: 13.5px;
}
.photo-strip-add .psa-ico { font-size: 17px; }
.foto-row {
  display: flex; gap: 10px; align-items: center; background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px; margin-bottom: 7px;
}
.foto-row img { width: 72px; height: 54px; object-fit: cover; border-radius: 7px; flex: none; }
.foto-row .fr-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.foto-row .fr-date { font-weight: 800; font-size: 13px; }
.foto-row .fr-rel { font-size: 11.5px; color: var(--fg-faint); font-weight: 700; }
.bc-quick { display: flex; gap: 8px; margin-top: 10px; }
.qa-ico { display: inline-flex; width: 19px; height: 19px; }
.qa-ico svg { width: 100%; height: 100%; }
.bc-water { display: flex; align-items: center; gap: 6px; }
.bw-ico { display: inline-flex; width: 15px; height: 15px; flex: none; }
.bw-ico svg { width: 100%; height: 100%; }
.rostliny {
  display: flex; align-items: center; gap: 9px; margin-top: 11px; flex-wrap: wrap;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px;
}
.r-btn {
  width: 34px; height: 34px; flex: none; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font-size: 19px; font-weight: 800; line-height: 1;
  display: grid; place-items: center;
}
.r-btn:active { transform: translateY(1px); }
.r-val { font-size: 14px; font-variant-numeric: tabular-nums; }
.r-val strong { font-size: 17px; font-family: var(--font-display); }
.r-note { font-size: 11px; color: var(--fg-faint); font-weight: 700; margin-left: auto; }
.r-reset { margin-left: auto; border: none; background: none; color: var(--accent-deep); font-size: 11.5px; font-weight: 800; text-decoration: underline; }
.cc-cam {
  position: absolute; right: 7px; bottom: 7px; font-size: 13px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  border-radius: 7px; padding: 3px 6px; line-height: 1;
}
.crop-card .cc-top { display: block; }
.crop-card .cc-top svg { width: 100%; height: 100%; display: block; }
.art-emoji { display: grid; place-items: center; width: 100%; height: 100%; font-size: 40px; }
.detail-hero { position: relative; }
.detail-hero svg { width: 100%; height: 100%; display: block; }
.qa {
  flex: 1; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent-deep);
  border-radius: 10px; padding: 11px 8px; font-weight: 800; font-size: 13.5px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.qa span { font-size: 16px; }
.qa:active { transform: translateY(1px); }
.loc-pick { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 11px 12px 8px; margin-bottom: 13px; }
.live-ok { font-size: 12px; font-weight: 700; color: var(--accent-deep); line-height: 1.45; }
.live-bad { font-size: 12px; font-weight: 600; color: var(--fg-soft); line-height: 1.5; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.mes-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.mes {
  border: 1px solid var(--line); background: var(--bg); color: var(--fg-soft);
  border-radius: 6px; padding: 8px 0; font-weight: 800; font-size: 11px;
}
.mes.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ukon-row { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
.ukon-row select, .ukon-row input {
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 8px; padding: 8px 7px; font: inherit; font-size: 13px; min-width: 0;
}
.ukon-row select { flex: 0 0 auto; max-width: 33%; }
.ukon-row input { flex: 1; min-width: 0; }
.cc-mine {
  position: absolute; top: 7px; right: 7px; font-size: 9.5px; font-weight: 800;
  letter-spacing: .03em; text-transform: uppercase; background: var(--accent); color: #fff;
  padding: 3px 7px; border-radius: 6px;
}
.loc-pick .lp-label { font-size: 11.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--fg-faint); margin-bottom: 8px; }

/* ---- Plodiny ---- */
.filter-chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
.filter-chips::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg-soft);
  border-radius: 20px; padding: 7px 13px; font-weight: 700; font-size: 12.5px; white-space: nowrap; flex: none;
}
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.crop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
.crop-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; text-align: left; padding: 0; color: inherit;
  display: flex; flex-direction: column;
}
.crop-card .cc-top { aspect-ratio: 16/10; background: var(--accent-soft); display: grid; place-items: center; font-size: 40px; position: relative; overflow: hidden; }
.crop-card .cc-top img { width: 100%; height: 100%; object-fit: cover; }
.crop-card .cc-tag { position: absolute; top: 7px; left: 7px; font-size: 10px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--accent-deep); padding: 3px 7px; border-radius: 6px; }
.crop-card .cc-body { padding: 10px 11px 12px; }
.crop-card h3 { font-size: 15px; margin-bottom: 2px; }
.crop-card .cc-lat { font-size: 11px; color: var(--fg-faint); font-style: italic; }
.crop-card .cc-months { display: flex; gap: 3px; margin-top: 9px; }
.crop-card .cc-months i { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); }
.crop-card .cc-months i.sow { background: var(--sky); }
.crop-card .cc-months i.plant { background: var(--accent); }
.crop-card .cc-months i.harvest { background: var(--sun); }

/* ---- Kalendář ---- */
.cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cal-nav h2 { font-size: 20px; flex: 1; text-align: center; }
.cal-nav button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; }
.cal-nav button svg { width: 18px; height: 18px; }
.task-group { margin-bottom: 18px; }
.task-group .tg-label { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-faint); margin: 0 2px 8px; }
.task {
  background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow); padding: 12px 13px; margin-bottom: 9px; display: flex; gap: 11px; align-items: flex-start;
}
.task .t-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; }
.task .t-body { flex: 1; min-width: 0; }
.task .t-title { font-weight: 800; font-size: 14px; }
.task .t-sub { font-size: 12.5px; color: var(--fg-soft); margin-top: 1px; }
.task .t-when { font-size: 11.5px; font-weight: 700; color: var(--fg-faint); margin-top: 4px; }
.task.soil { border-left-color: var(--soil); }
.task.soil .t-icon { background: var(--soil-soft); }
.task.sow { border-left-color: var(--sky); }
.task.sow .t-icon { background: color-mix(in srgb, var(--sky) 20%, transparent); }
.task.plant { border-left-color: var(--accent); }
.task.plant .t-icon { background: var(--accent-soft); }
.task.care { border-left-color: var(--sun); }
.task.care .t-icon { background: color-mix(in srgb, var(--sun) 22%, transparent); }

  display: flex; max-width: 560px; margin: 0 auto;

  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabbar button {
  flex: 1; min-width: 0; border: none; background: none; padding: 9px 1px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px;

}

.modal-back {

.modal {

  padding-right: max(18px, env(safe-area-inset-right, 0px));

function save() {
  try { state.view = view; localStorage.setItem('zahradka-v2', JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('zahradka-v2');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        state = Object.assign(state, p);
        if (p.view && isFinite(p.view.scale)) view = p.view;
        if (!state.shops || !Object.keys(state.shops).length) seedShops();
        if (!state.cropPlan) state.cropPlan = {};
        if (!state.cropFoto) state.cropFoto = {};
        if (!state.lokalita) state.lokalita = 'praha';
        if (!Array.isArray(state.customCrops)) state.customCrops = [];
        if (!state.cropEdits) state.cropEdits = {};
        items().forEach(i => {
          if (!i.hnojeni) i.hnojeni = [];

  } catch (e) {}

/* ============ GEOMETRIE ============
   Obrys zahrady je polygon v metrech, s vrcholy, ktere se daji tahat.
   Prvky (zahon, dum, cesta) jsou mnoziny ctverecku 1 x 1 m, takze muzou mit
   i nepravidelny tvar a daji se po ctverecku pridavat i ubirat. */
function polyArea(pts) {
  if (!pts || pts.length < 3) return 0;
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s) / 2;
}
function pointInPoly(x, y, pts) {
  if (!pts || pts.length < 3) return true;
  let inside = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi) * (y-yi) / (yj-yi) + xi)) inside = !inside;
  }
  return inside;
}
function bbox(pts) {
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return { x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys) };
}

/* --- ctverecky --- */
const ck = (x, y) => x + ',' + y;
const cxy = (k) => { const p = k.split(','); return [ +p[0], +p[1] ]; };
const cellsOf = (it) => (it && it.cells) || [];
const itArea = (it) => cellsOf(it).length;
function itBBox(it) {
  const cs = cellsOf(it);
  if (!cs.length) return { x0:0, y0:0, x1:0, y1:0, w:0, h:0 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const k of cs) {
    const c = cxy(k);
    if (c[0] < x0) x0 = c[0];
    if (c[1] < y0) y0 = c[1];
    if (c[0]+1 > x1) x1 = c[0]+1;
    if (c[1]+1 > y1) y1 = c[1]+1;
  }
  return { x0, y0, x1, y1, w: x1-x0, h: y1-y0 };
}
const isRect = (it) => { const b = itBBox(it); return itArea(it) === b.w * b.h; };
function rectKeys(x0, y0, x1, y1) {
  const out = [];
  for (let y = Math.min(y0,y1); y < Math.max(y0,y1); y++)
    for (let x = Math.min(x0,x1); x < Math.max(x0,x1); x++) out.push(ck(x,y));
  return out;
}
function ownerAt(key) {
  for (const i of items()) if ((i.cells||[]).indexOf(key) >= 0) return i;
  return null;
}
function pruneEmpty() {
  Object.keys(state.items).forEach(id => {
    const it = state.items[id];
    if (!it.cells || !it.cells.length) {
      delete state.items[id];
      if (state.sel === id) state.sel = null;
    }
  });
}
/* Pridani ctverecku jednomu prvku. Co patrilo jinemu, se mu odebere. */
function addCells(it, keys) {
  const mine = new Set(it.cells || []);
  keys.forEach(k => {
    const o = ownerAt(k);
    if (o && o.id !== it.id) o.cells = o.cells.filter(x => x !== k);
    mine.add(k);
  });
  it.cells = [...mine];
  pruneEmpty();
}
function removeCells(keys) {
  keys.forEach(k => { const o = ownerAt(k); if (o) o.cells = o.cells.filter(x => x !== k); });
  pruneEmpty();
}
function moveItemBy(it, dx, dy) {
  const keys = cellsOf(it).map(k => { const c = cxy(k); return ck(c[0]+dx, c[1]+dy); });
  it.cells = [];
  addCells(it, keys);
}
/* Roztahovani za uchyt: nova rada vznikne kopii krajni rady, takze to funguje
   i u nepravidelnych tvaru. Zmensovani krajni radu odebere. */
function stretch(it, side, grow) {
  const b = itBBox(it);
  const cs = cellsOf(it).map(cxy);
  if (grow) {
    let nk = [];
    if (side === 'E') nk = cs.filter(p => p[0] === b.x1-1).map(p => ck(b.x1, p[1]));
    if (side === 'W') nk = cs.filter(p => p[0] === b.x0).map(p => ck(b.x0-1, p[1]));
    if (side === 'S') nk = cs.filter(p => p[1] === b.y1-1).map(p => ck(p[0], b.y1));
    if (side === 'N') nk = cs.filter(p => p[1] === b.y0).map(p => ck(p[0], b.y0-1));
    if (!nk.length) return false;
    addCells(it, nk);
    return true;
  }
  if ((side === 'E' || side === 'W') && b.w <= 1) return false;
  if ((side === 'N' || side === 'S') && b.h <= 1) return false;
  let rm = [];
  if (side === 'E') rm = cs.filter(p => p[0] === b.x1-1);
  if (side === 'W') rm = cs.filter(p => p[0] === b.x0);
  if (side === 'S') rm = cs.filter(p => p[1] === b.y1-1);
  if (side === 'N') rm = cs.filter(p => p[1] === b.y0);
  const rmSet = new Set(rm.map(p => ck(p[0], p[1])));
  const left = cellsOf(it).filter(k => !rmSet.has(k));
  if (!left.length) return false;
  it.cells = left;
  return true;
}
function reshapeRect(it, w, h) {
  const b = itBBox(it);
  it.cells = [];
  addCells(it, rectKeys(b.x0, b.y0, b.x0 + Math.max(1, Math.round(w)), b.y0 + Math.max(1, Math.round(h))));
}
function itemInside(it) {
  if (!state.outlineDone || state.outline.length < 3) return true;
  return cellsOf(it).every(k => { const c = cxy(k); return pointInPoly(c[0]+0.5, c[1]+0.5, state.outline); });
}
/* Hrany unie ctverecku: kreslime linku jen tam, kde vedle neni dalsi ctverecek */
function edgeSegments(it) {
  const s = new Set(cellsOf(it));
  const segs = [];
  s.forEach(k => {
    const c = cxy(k), x = c[0], y = c[1];
    if (!s.has(ck(x, y-1))) segs.push([x, y, x+1, y]);
    if (!s.has(ck(x, y+1))) segs.push([x, y+1, x+1, y+1]);
    if (!s.has(ck(x-1, y))) segs.push([x, y, x, y+1]);
    if (!s.has(ck(x+1, y))) segs.push([x+1, y, x+1, y+1]);
  });
  return segs;
}

const DNY_KR = ['Ne','Po','Út','St','Čt','Pá','So'];
let liveStav = { stav:'idle', chyba:'' };

async function nactiZivePocasi(dotaz) {
  liveStav = { stav:'nacitam', chyba:'' };
  renderWeather();
  try {
    const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=cs&format=json&name='
      + encodeURIComponent(dotaz));
    if (!g.ok) throw new Error('geo ' + g.status);
    const gj = await g.json();
    if (!gj.results || !gj.results.length) {
      liveStav = { stav:'nenalezeno', chyba:'Obec „' + dotaz + '" jsem nenašel. Zkus název bez čísla popisného.' };
      renderWeather(); return;
    }
    const m = gj.results[0];
    const f = await fetch('https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + m.latitude + '&longitude=' + m.longitude
      + '&current=temperature_2m'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum'
      + '&timezone=auto&forecast_days=6');
    if (!f.ok) throw new Error('fc ' + f.status);
    const fj = await f.json();
    const d = fj.daily;
    const dny = d.time.slice(0,6).map((iso,i) => {
      const dt = new Date(iso + 'T12:00:00');
      return {
        d: DNY_KR[dt.getDay()],
        datum: dt.getDate() + '. ' + (dt.getMonth()+1) + '.',
        max: d.temperature_2m_max[i],
        min: d.temperature_2m_min[i],
        p: d.precipitation_probability_max[i] == null ? 0 : d.precipitation_probability_max[i],
        mm: d.precipitation_sum[i] == null ? 0 : d.precipitation_sum[i],
      };
    });
    const ted = new Date();
    state.live = {
      id: 'live',
      nazev: m.name + (m.admin1 ? ', ' + m.admin1 : ''),
      t: fj.current && fj.current.temperature_2m != null ? fj.current.temperature_2m : dny[0].max,
      dny,
      cas: ('0'+ted.getHours()).slice(-2) + ':' + ('0'+ted.getMinutes()).slice(-2),
      zivy: true,
    };
    state.liveDotaz = dotaz;
    liveStav = { stav:'ok', chyba:'' };
    save(); renderWeather(); renderBeds();
    toast('Načteno pro ' + m.name);
  } catch (e) {
    liveStav = { stav:'blokovano', chyba: String(e && e.message || e) };
    renderWeather();
  }
}

      if (side <= gh) cy = clamp(cy, g.y0 + side/2, g.y1 - side/2);

  }

  });
  if (it && itArea(it)) {
    const b = itBBox(it);
    parts.push(`<rect x="${X(b.x0)}" y="${Y(b.y0)}" width="${(b.w*s).toFixed(1)}" height="${(b.h*s).toFixed(1)}" fill="none" stroke="var(--warn)" stroke-width="2.4" rx="2"/>`);
  }
  if (crop_) {
    parts.push(`<text x="${size-3}" y="${size-3}" text-anchor="end" font-size="7.5" font-weight="800" fill="var(--fg-faint)">${Math.round(side)} m</text>`);
  }

/* ============ KATASTR ============
   Nacteni obrysu parcely z verejne sluzby CUZK (INSPIRE WFS, bez klice
   a bez registrace) a prevod na metry pro plan zahrady.

   1) adresa -> souradnice  (Nominatim, nebo Open-Meteo pro obce)
   2) souradnice -> GML s parcelami v okoli  (CUZK WFS GetFeature, BBOX)
   3) vybereme parcelu, ve ktere bod lezi, a prevedeme ji na metry

   V publikovanem artefaktu je sitovy pozadavek zakazany, takze to tise
   selze. V aplikaci (WebView s nativnim mostem) to bezi. */
const CUZK_WFS = 'https://services.cuzk.cz/wfs/inspire-cp-wfs.asp';
const CRS84 = 'http://www.opengis.net/def/crs/EPSG/0/4326';

/* V aplikaci jde pozadavek pres nativni most, jinak pres fetch.
   Most obchazi CORS, ktery by ve WebView jinak dotazy na CUZK zablokoval. */
async function httpGet(url, accept) {
  if (window.KozaNative && typeof window.KozaNative.get === 'function') {
    const r = window.KozaNative.get(url, accept || '');
    if (r == null || r === '') throw new Error('prazdna odpoved');
    if (r.indexOf('KOZA_ERR:') === 0) throw new Error(r.slice(9));
    return r;
  }
  const res = await fetch(url, accept ? { headers: { 'Accept': accept } } : undefined);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

async function geokoduj(adresa) {
  const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cz&addressdetails=0&q='
    + encodeURIComponent(adresa);
  const txt = await httpGet(u, 'application/json');
  const j = JSON.parse(txt);
  if (!j || !j.length) return null;
  return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon), nazev: j[0].display_name };
}

/* Prevod stupnu na metry kolem referencniho bodu. Na velikost parcely
   je rovinna aproximace presna na centimetry. */
function naMetry(body, lat0, lon0) {
  const mLat = 110540, mLon = 111320 * Math.cos(lat0 * Math.PI / 180);
  return body.map(p => [ (p[1] - lon0) * mLon, -(p[0] - lat0) * mLat ]);
}

/* Z GML vytahneme souradnicove seznamy. Poradi os overujeme podle rozsahu CR. */
function parsujGml(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('odpověď nejde přečíst');
  const out = [];
  const uzly = doc.getElementsByTagNameNS('*', 'posList');
  for (let i = 0; i < uzly.length; i++) {
    const cisla = (uzly[i].textContent || '').trim().split(/\s+/).map(Number);
    const body = [];
    for (let k = 0; k + 1 < cisla.length; k += 2) {
      let a = cisla[k], b = cisla[k+1];
      // v CR je zemepisna sirka 48-52, delka 12-19
      const prohodit = !(a > 48 && a < 52 && b > 12 && b < 19);
      body.push(prohodit ? [b, a] : [a, b]);
    }
    if (body.length >= 4) out.push(body);
  }
  return out;
}

async function nactiParcelu(adresa) {
  katStav = { stav:'geokoduji', text:'Hledám adresu…' };
  renderGarden();
  const m = await geokoduj(adresa);
  if (!m) { katStav = { stav:'chyba', text:'Adresu „' + adresa + '" jsem nenašel. Zkus ji napsat i s obcí.' }; renderGarden(); return; }

  katStav = { stav:'parcela', text:'Mám souřadnice, stahuji parcelu z katastru…' };
  renderGarden();
  const d = 0.0012;  // asi 130 m na vysku
  const bbox = [ (m.lat-d), (m.lon-d*1.6), (m.lat+d), (m.lon+d*1.6) ].map(x=>x.toFixed(6)).join(',');
  const u = CUZK_WFS + '?service=WFS&version=2.0.0&request=GetFeature'
    + '&typenames=CadastralParcel&count=60'
    + '&srsName=' + encodeURIComponent(CRS84)
    + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
  const xml = await httpGet(u, 'application/xml');
  const polygony = parsujGml(xml);
  if (!polygony.length) { katStav = { stav:'chyba', text:'Katastr pro tohle místo nevrátil žádnou parcelu.' }; renderGarden(); return; }

  // parcela, ve ktere nalezeny bod lezi; jinak ta s nejblizsim stredem
  let vybrana = polygony.find(poly => pointInPoly(m.lon, m.lat, poly.map(q => [q[1], q[0]])));
  if (!vybrana) {
    vybrana = polygony.slice().sort((A,B) => {
      const s = (P) => { const la = P.reduce((x,q)=>x+q[0],0)/P.length, lo = P.reduce((x,q)=>x+q[1],0)/P.length;
        return (la-m.lat)**2 + (lo-m.lon)**2; };
      return s(A) - s(B);
    })[0];
  }
  let metry = naMetry(vybrana, m.lat, m.lon);
  const xs = metry.map(q=>q[0]), ys = metry.map(q=>q[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  metry = metry.map(q => [ Math.round((q[0]-x0)*10)/10, Math.round((q[1]-y0)*10)/10 ]);
  // posledni bod bywa shodny s prvnim
  if (metry.length > 2) {
    const a = metry[0], b = metry[metry.length-1];
    if (Math.abs(a[0]-b[0]) < 0.2 && Math.abs(a[1]-b[1]) < 0.2) metry.pop();
  }
  state.outline = metry;
  state.outlineDone = true;
  state.sel = null; state.selVert = null;
  state.adresa = adresa;
  katStav = { stav:'ok', text:'Parcela načtena z katastru · ' + fmtA(polyArea(metry)) + ' · ' + metry.length + ' lomových bodů' };
  save(); renderGarden(); fitView();
  toast('Parcela načtena, ' + fmtA(polyArea(metry)));
}

  const bedArea = beds().reduce((s,b) => s + itArea(b), 0);
  const sel = state.sel ? state.items[state.sel] : null;
  if (state.sel && !sel) state.sel = null;
  const outlineClosed = state.outlineDone && state.outline.length >= 3;

  el('screen-garden').innerHTML = `
    <div class="section-head">
      <h2>Půdorys zahrady</h2>
      <span class="count">1 čtvereček = 1 m²</span>
    </div>
    <div class="addr-card">
      <div class="addr-row">
        <input id="addr-input" placeholder="Zdická 1351/15, Praha" value="${esc(state.adresa)}" aria-label="Adresa zahrady">
        <button class="btn sm" id="addr-load">${katStav.stav==='geokoduji'||katStav.stav==='parcela' ? 'Hledám…' : 'Z katastru'}</button>
      </div>
      ${katStav.text ? `<div class="${katStav.stav==='ok'?'live-ok':(katStav.stav==='ukazka'?'live-ok':'live-bad')}" style="margin-top:8px">${katStav.stav==='ok'?'● ':''}${esc(katStav.text)}</div>` : ''}
      ${katStav.stav==='blokovano' ? `<div class="live-bad" style="margin-top:8px">Tahle stránka nemá přístup k síti, takže z katastru stahovat nejde. V aplikaci to funguje. Zatím si obrys nakresli sám, nebo si načti ukázku.</div>` : ''}
      <div class="actrow" style="margin-top:9px">
        <button class="btn sm ghost" id="addr-demo">Ukázková parcela</button>
      </div>
      <p class="addr-note">Obrys se stáhne z veřejné služby ČÚZK podle adresy. Po načtení ho můžeš dál upravovat — tahat vrcholy, vkládat nové.</p>
    </div>
    <div class="toolrow">
      ${TOOLS.map(t=>`<button class="tool ${state.tool===t.id?'active':''}" data-tool="${t.id}">
        ${t.sw ? `<i class="sw" style="background:${t.sw}"></i>` : t.ico}${t.label}</button>`).join('')}
    </div>
    <div class="canvas-wrap">
      <div id="canvas">
        <svg id="cv-svg" aria-label="Plán zahrady"></svg>
        ${!state.outline.length && !items().length ? `<div class="cv-empty"><div>
          <div class="ce-ico">📐</div>
          <h3>Prázdný tečkovaný papír</h3>
          <p>Načti obrys podle adresy, nebo si ho nástrojem Obrys obkresli sám. Jedna tečka je jeden metr.</p>
        </div></div>` : ''}
        <div class="cv-hint">${esc(HINTS[state.tool] || '')}</div>
        <div class="scalebar"><span class="bar" id="sb-bar"></span><span id="sb-lbl">5 m</span></div>
        <div class="zoomer">
          <button id="zoom-in" aria-label="Přiblížit">+</button>
          <button id="zoom-out" aria-label="Oddálit">−</button>
          <button id="zoom-fit" aria-label="Zobrazit celou zahradu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="s-val">${area ? fmtA(area) : '—'}</div><div class="s-lbl">Parcela</div></div>
      <div class="stat"><div class="s-val">${bedArea ? fmtA(bedArea) : '—'}</div><div class="s-lbl">Záhony</div></div>
      <div class="stat"><div class="s-val">${beds().length}</div><div class="s-lbl">Záhonků</div></div>
    </div>
    ${sel ? (() => {
      const b = itBBox(sel), c = crop(sel.cropId);
      return `<div class="selbar">
        <span class="sl-ico">${c ? c.emoji : (sel.typ==='bed'?'🟫':(sel.typ==='house'?'🏠':'⬜'))}</span>
        <span class="sl-body">
          <span class="sl-name">${esc(sel.nazev)}</span>
          <span class="sl-meta">${fmtA(itArea(sel))} · ${isRect(sel) ? fmtDim(b.w,b.h) : 'nepravidelný, ' + fmtDim(b.w,b.h)}</span>
        </span>
        <button class="btn sm ghost" id="sel-edit">Upravit</button>
        <button class="btn sm ghost" id="sel-off" aria-label="Zrušit výběr">×</button>
      </div>`;
    })() : ''}
    <div class="actrow">
      ${state.tool==='outline' ? `
        ${!state.outlineDone && state.outline.length>=3 ? `<button class="btn sm" id="o-close">Uzavřít obrys</button>` : ''}
        ${state.selVert != null && outlineClosed && state.outline.length > 3 ? `<button class="btn sm ghost" id="o-delvert">Smazat vrchol</button>` : ''}
        ${state.outline.length ? `<button class="btn sm ghost" id="o-undo">Zpět</button>` : ''}
        ${state.outline.length ? `<button class="btn sm ghost" id="o-clear">Smazat obrys</button>` : ''}
      ` : ''}
      <button class="btn sm ghost" id="g-empty">Prázdná zahrada</button>
      <button class="btn sm ghost" id="g-demo">Ukázková zahrada</button>
    </div>
    <p class="hint">Záhony, dům i cesty jsou skládané ze čtverečků, takže mají i nepravidelný tvar. Záhony se objeví v Záhoncích, kde jim přiřadíš plodinu, a jejich úkony se propíšou do Kalendáře.</p>
  `;

  el('addr-load').onclick = nactiObrys;
  el('addr-demo').onclick = () => confirmDialog('Načíst ukázkovou parcelu?','Přepíše to současný obrys zahrady.', ukazkovyObrys);
  const ai = el('addr-input');
  ai.onchange = () => { state.adresa = ai.value; save(); };
  el('screen-garden').querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    state.tool = b.dataset.tool;
    if (state.tool !== 'outline') state.selVert = null;
    if (state.tool !== 'pan') state.sel = null;
    save(); renderGarden();
  });

  if (sel) {
    el('sel-edit').onclick = () => openItemModal(sel.id);
    el('sel-off').onclick = () => { state.sel = null; save(); renderGarden(); };
  }
  const oc = el('o-close'); if (oc) oc.onclick = () => { state.outlineDone = true; save(); renderGarden(); toast('Obrys uzavřen'); };
  const odv = el('o-delvert'); if (odv) odv.onclick = () => {
    state.outline.splice(state.selVert, 1); state.selVert = null;
    save(); renderGarden(); toast('Vrchol smazán');
  };
  const ou = el('o-undo'); if (ou) ou.onclick = () => {
    state.outline.pop(); state.selVert = null;
    if (state.outline.length < 3) state.outlineDone = false;
    save(); renderGarden();
  };
  const ocl = el('o-clear'); if (ocl) ocl.onclick = () => confirmDialog('Smazat obrys?','Prvky uvnitř zahrady zůstanou, zmizí jen hranice parcely.', () => {
    state.outline = []; state.outlineDone = false; state.selVert = null; save(); renderGarden();
  });
  el('g-empty').onclick = () => confirmDialog('Začít s prázdnou zahradou?','Smaže se obrys, dům, cesty i všechny záhonky s plodinami.', () => {
    state.outline = []; state.outlineDone = false; state.items = {}; state.nextId = 1;
    state.sel = null; state.selVert = null;
    view = { ox:-3, oy:-3, scale:11 };
    state.tool = 'outline'; save(); renderGarden(); toast('Můžeš kreslit');
  });
  el('g-demo').onclick = () => confirmDialog('Načíst ukázkovou zahradu?','Přepíše to tvůj současný plán.', () => {
    seed(); katStav = { stav:'idle', text:'' }; save(); renderGarden(); fitView(); toast('Ukázka načtena');
  });

  bindCanvas();
  renderCanvas();
}

/* --- prepocty mezi metry a pixely --- */
function cvRect() { const c = el('canvas'); return c ? c.getBoundingClientRect() : { width:0, height:0, left:0, top:0 }; }
function w2s(x, y) { return [ (x - view.ox) * view.scale, (y - view.oy) * view.scale ]; }
function s2w(px, py) { return [ px / view.scale + view.ox, py / view.scale + view.oy ]; }
function snapW(x, y) { return [ Math.round(x/snapStep)*snapStep, Math.round(y/snapStep)*snapStep ]; }
function cellAt(px, py) { const w = s2w(px, py); return ck(Math.floor(w[0]), Math.floor(w[1])); }

function fitView() {
  const pts = state.outline.length >= 2 ? state.outline.slice()
    : items().flatMap(i => { const b = itBBox(i); return [[b.x0,b.y0],[b.x1,b.y1]]; });
  const r = cvRect();
  if (!pts.length || !r.width) { renderCanvas(); return; }
  const b = bbox(pts);
  const pad = 2.5;
  const w = Math.max(b.x1-b.x0, 4) + pad*2, h = Math.max(b.y1-b.y0, 4) + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/h), 1.2, 60);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); renderCanvas();
}
function centerOn(it) {
  const b = itBBox(it), r = cvRect();
  if (!r.width) return;
  const pad = 6;
  const w = b.w + pad*2, hh = b.h + pad*2;
  view.scale = clamp(Math.min(r.width/w, r.height/hh), 1.2, 30);
  view.ox = (b.x0+b.x1)/2 - r.width/(2*view.scale);
  view.oy = (b.y0+b.y1)/2 - r.height/(2*view.scale);
  save(); renderCanvas();
}
function zoomAt(f, px, py) {
  const w = s2w(px, py);
  view.scale = clamp(view.scale * f, 1.2, 60);
  view.ox = w[0] - px/view.scale;
  view.oy = w[1] - py/view.scale;
  save(); renderCanvas();
}

/* --- uchyty pro roztahovani --- */
function handlesOf(it) {
  const b = itBBox(it);
  return [
    { side:'N', p: w2s((b.x0+b.x1)/2, b.y0), ax:'v' },
    { side:'S', p: w2s((b.x0+b.x1)/2, b.y1), ax:'v' },
    { side:'W', p: w2s(b.x0, (b.y0+b.y1)/2), ax:'h' },
    { side:'E', p: w2s(b.x1, (b.y0+b.y1)/2), ax:'h' },
  ];
}

/* --- kresleni --- */
let preview = null;
let rafId = null;
function scheduleRender() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = null; renderCanvas(); }); }

function renderCanvas() {
  const cv = el('canvas'), svg = el('cv-svg');
  if (!cv || !svg) return;
  const W = cv.clientWidth, H = cv.clientHeight;

  snapStep = 1;
  const dotStep = view.scale >= 9 ? 1 : (view.scale >= 3.5 ? 5 : 10);
  const tile = dotStep * view.scale, tile5 = dotStep * 5 * view.scale;
  const px = -view.ox * view.scale, py = -view.oy * view.scale;
  cv.style.backgroundImage =
    'radial-gradient(circle, var(--dot) 1.3px, transparent 1.9px),' +
    'linear-gradient(to right, var(--grid5) 1px, transparent 1px),' +
    'linear-gradient(to bottom, var(--grid5) 1px, transparent 1px)';
  cv.style.backgroundSize = `${tile}px ${tile}px, ${tile5}px ${tile5}px, ${tile5}px ${tile5}px`;
  cv.style.backgroundPosition = `${px - tile/2}px ${py - tile/2}px, ${px}px ${py}px, ${px}px ${py}px`;

  const sb = el('sb-bar'), sbl = el('sb-lbl');
  if (sb) {
    let mm = 5;
    for (const cand of [1,2,5,10,20,50,100]) { mm = cand; if (cand*view.scale >= 46) break; }
    sb.style.width = (mm*view.scale) + 'px';
    sbl.textContent = mm + ' m';
  }

  const parts = [];
  // obrys parcely
  if (state.outline.length >= 2) {
    const pstr = state.outline.map(p => w2s(p[0],p[1]).map(n=>n.toFixed(1)).join(',')).join(' ');
    if (state.outlineDone && state.outline.length >= 3) {
      parts.push(`<polygon points="${pstr}" fill="var(--accent-soft)" fill-opacity="0.5" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`);
    } else {
      parts.push(`<polyline points="${pstr}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>`);
    }
  }
  // prvky ze ctverecku
  const zo = { paved:0, house:1, bed:2 };
  const sorted = items().slice().sort((a,b) => (zo[a.typ]||0) - (zo[b.typ]||0));
  const s = view.scale, ov = 0.6;
  sorted.forEach(it => {
    const d = PRVKY[it.typ] || PRVKY.bed;
    const c = crop(it.cropId);
    const out = !itemInside(it);
    const fill = (it.typ === 'bed' && c) ? 'var(--accent)' : d.fill;
    let fp = '';
    cellsOf(it).forEach(k => {
      const cc = cxy(k), sp = w2s(cc[0], cc[1]);
      fp += `M${sp[0].toFixed(1)} ${sp[1].toFixed(1)}h${(s+ov).toFixed(1)}v${(s+ov).toFixed(1)}h${(-(s+ov)).toFixed(1)}Z`;
    });
    parts.push(`<path d="${fp}" fill="${fill}" fill-opacity="${it.typ==='bed'?0.92:0.95}"/>`);
    let ep = '';
    edgeSegments(it).forEach(g => {
      const a = w2s(g[0], g[1]), b2 = w2s(g[2], g[3]);
      ep += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b2[0].toFixed(1)} ${b2[1].toFixed(1)}`;
    });
    parts.push(`<path d="${ep}" fill="none" stroke="${out?'var(--danger)':d.line}" stroke-width="${out?2.5:1.6}" stroke-linecap="square" ${out?'stroke-dasharray="5 4"':''}/>`);

    const b = itBBox(it);
    const sp0 = w2s(b.x0, b.y0), bw = b.w*s, bh = b.h*s;
    if (bw > 34 && bh > 24 && it.typ === 'bed' && c) {
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${(sp0[1]+bh/2).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${Math.min(24, bh*0.55).toFixed(0)}">${c.emoji}</text>`);
    }
    if (bw > 52 && bh > 16) {
      const col = it.typ === 'bed' ? '#ffffff' : 'var(--fg)';
      const ty = (it.typ === 'bed' && c && bh > 42) ? sp0[1] + bh - 7 : sp0[1] + bh/2 + 4;
      parts.push(`<text x="${(sp0[0]+bw/2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${col}" style="paint-order:stroke" stroke="${it.typ==='bed'?'rgba(0,0,0,.3)':'rgba(255,255,255,.45)'}" stroke-width="2.2">${esc(it.nazev)}</text>`);
    }
  });
  // vybrany prvek: ramec a uchyty
  const sel = state.sel ? state.items[state.sel] : null;
  if (sel && state.tool === 'pan') {
    const b = itBBox(sel), sp = w2s(b.x0, b.y0);
    parts.push(`<rect x="${(sp[0]-3).toFixed(1)}" y="${(sp[1]-3).toFixed(1)}" width="${(b.w*s+6).toFixed(1)}" height="${(b.h*s+6).toFixed(1)}" fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-dasharray="6 4" rx="4"/>`);
    handlesOf(sel).forEach(h => {
      parts.push(`<circle cx="${h.p[0].toFixed(1)}" cy="${h.p[1].toFixed(1)}" r="9.5" fill="var(--surface)" stroke="var(--accent-deep)" stroke-width="2.5"/>`);
      const l = 4;
      parts.push(h.ax === 'h'
        ? `<path d="M${(h.p[0]).toFixed(1)} ${(h.p[1]-l).toFixed(1)}v${l*2}" stroke="var(--accent-deep)" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M${(h.p[0]-l).toFixed(1)} ${(h.p[1]).toFixed(1)}h${l*2}" stroke="var(--accent-deep)" stroke-width="2.5" stroke-linecap="round"/>`);
    });
  }
  // vrcholy obrysu
  if (state.tool === 'outline') {
    const n = state.outline.length;
    if (n >= 2) {
      const lim = (state.outlineDone && n >= 3) ? n : n-1;
      for (let i = 0; i < lim; i++) {
        const a = state.outline[i], b = state.outline[(i+1) % n];
        const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
        if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
        const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
        parts.push(`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="var(--paper)" fill-opacity="0.9" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="3 2.5" data-mid="${i}"/>`);
      }
    }
    state.outline.forEach((p, i) => {
      const sp = w2s(p[0], p[1]);
      const on = state.selVert === i;
      parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="${on?8:6.5}" fill="${on?'var(--accent)':'var(--surface)'}" stroke="var(--accent-deep)" stroke-width="2.5"/>`);
      if (i === 0 && !state.outlineDone && state.outline.length >= 3) {
        parts.push(`<circle cx="${sp[0].toFixed(1)}" cy="${sp[1].toFixed(1)}" r="12" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`);
      }
    });
  }
  // nahled tazeneho bloku
  if (preview && preview.w > 0 && preview.h > 0) {
    const d = PRVKY[preview.prvek] || PRVKY.bed;
    const sp = w2s(preview.x, preview.y);
    parts.push(`<rect x="${sp[0].toFixed(1)}" y="${sp[1].toFixed(1)}" width="${(preview.w*s).toFixed(1)}" height="${(preview.h*s).toFixed(1)}" fill="${d.fill}" fill-opacity="0.55" stroke="${d.line}" stroke-width="2" stroke-dasharray="6 4"/>`);
    parts.push(`<text x="${(sp[0] + preview.w*s/2).toFixed(1)}" y="${(sp[1] - 7).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--fg)">${preview.w} × ${preview.h} m</text>`);
  }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = parts.join('');
}

/* --- gesta --- */
let ptrs = new Map(), gest = null;
function bindCanvas() {
  const cv = el('canvas'); if (!cv || cv.dataset.bound) return;
  cv.dataset.bound = '1';
  const local = (e) => { const r = cvRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture(e.pointerId);
    const p = local(e);
    ptrs.set(e.pointerId, p);

    if (ptrs.size === 2) {
      const a = [...ptrs.values()];
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      gest = { type:'pinch', d0: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1, s0: view.scale, w0: s2w(mid.x, mid.y) };
      preview = null; return;
    }

    if (state.tool === 'outline') {
      const hv = state.outline.findIndex(q => { const sp = w2s(q[0],q[1]); return Math.hypot(sp[0]-p.x, sp[1]-p.y) <= 17; });
      if (hv >= 0) { gest = { type:'vertex', i:hv, start:p, moved:false }; return; }
      const n = state.outline.length;
      if (n >= 2) {
        const lim = (state.outlineDone && n >= 3) ? n : n-1;
        for (let i = 0; i < lim; i++) {
          const a = state.outline[i], b = state.outline[(i+1) % n];
          const pa = w2s(a[0],a[1]), pb = w2s(b[0],b[1]);
          if (Math.hypot(pa[0]-pb[0], pa[1]-pb[1]) < 46) continue;
          const mx = (pa[0]+pb[0])/2, my = (pa[1]+pb[1])/2;
          if (Math.hypot(mx-p.x, my-p.y) <= 15) { gest = { type:'insert', i, start:p, moved:false }; return; }
        }
      }
      gest = { type:'tapAdd', start:p, moved:false }; return;
    }

    if (state.tool === 'erase') {
      gest = { type:'erase', start:p, moved:false, done:new Set() };
      const k = cellAt(p.x, p.y); gest.done.add(k); removeCells([k]); scheduleRender(); return;
    }

    if (state.tool === 'bed' || state.tool === 'house' || state.tool === 'paved') {
      const w = s2w(p.x, p.y);
      gest = { type:'rect', prvek: state.tool, ax: Math.floor(w[0]), ay: Math.floor(w[1]), start:p, moved:false };
      return;
    }

    // ruka
    const sel = state.sel ? state.items[state.sel] : null;
    if (sel) {
      const h = handlesOf(sel).find(h => Math.hypot(h.p[0]-p.x, h.p[1]-p.y) <= 18);
      if (h) { gest = { type:'stretch', id:sel.id, side:h.side, start:p, applied:0, moved:false }; return; }
    }
    const k = cellAt(p.x, p.y);
    const own = ownerAt(k);
    if (own) { gest = { type:'move', id:own.id, start:p, last:{dx:0,dy:0}, moved:false }; return; }
    gest = { type:'pan', start:p, o0:{ ox:view.ox, oy:view.oy }, moved:false };
  });

  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    const p = local(e);
    ptrs.set(e.pointerId, p);
    if (!gest) return;
    if (gest.type !== 'pinch' && !gest.moved && Math.hypot(p.x-gest.start.x, p.y-gest.start.y) > 7) gest.moved = true;

    if (gest.type === 'pinch') {
      const a = [...ptrs.values()]; if (a.length < 2) return;
      const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1;
      const mid = { x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2 };
      view.scale = clamp(gest.s0 * (d/gest.d0), 1.2, 60);
      view.ox = gest.w0[0] - mid.x/view.scale;
      view.oy = gest.w0[1] - mid.y/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'pan' && gest.moved) {
      view.ox = gest.o0.ox - (p.x - gest.start.x)/view.scale;
      view.oy = gest.o0.oy - (p.y - gest.start.y)/view.scale;
      scheduleRender(); return;
    }
    if (gest.type === 'erase') {
      const k = cellAt(p.x, p.y);
      if (!gest.done.has(k)) { gest.done.add(k); removeCells([k]); scheduleRender(); }
      return;
    }
    if (gest.type === 'rect') {
      const w = s2w(p.x, p.y);
      const bx = Math.floor(w[0]), by = Math.floor(w[1]);
      const x0 = Math.min(gest.ax, bx), y0 = Math.min(gest.ay, by);
      preview = { prvek:gest.prvek, x:x0, y:y0, w: Math.abs(bx-gest.ax)+1, h: Math.abs(by-gest.ay)+1 };
      scheduleRender(); return;
    }
    if (gest.type === 'vertex' && gest.moved) {
      state.outline[gest.i] = snapW(...s2w(p.x, p.y));
      scheduleRender(); return;
    }
    if (gest.type === 'stretch') {
      const it = state.items[gest.id]; if (!it) return;
      const side = gest.side;
      const d = (side === 'E' || side === 'W')
        ? (p.x - gest.start.x)/view.scale
        : (p.y - gest.start.y)/view.scale;
      const want = Math.round((side === 'W' || side === 'N') ? -d : d);
      let guard = 0;
      while (gest.applied < want && guard++ < 80) { if (!stretch(it, side, true)) break; gest.applied++; }
      guard = 0;
      while (gest.applied > want && guard++ < 80) { if (!stretch(it, side, false)) break; gest.applied--; }
      scheduleRender(); return;
    }
    if (gest.type === 'move' && gest.moved) {
      const it = state.items[gest.id]; if (!it) return;
      const dx = Math.round((p.x - gest.start.x)/view.scale);
      const dy = Math.round((p.y - gest.start.y)/view.scale);
      if (dx !== gest.last.dx || dy !== gest.last.dy) {
        moveItemBy(it, dx - gest.last.dx, dy - gest.last.dy);
        gest.last = { dx, dy };
        scheduleRender();
      }
      return;
    }
  });

  const finish = (e) => {
    ptrs.delete(e.pointerId);
    if (!gest) return;
    const g = gest;
    if (ptrs.size > 0 && g.type === 'pinch') return;
    gest = null;

    if (g.type === 'pinch') { save(); renderCanvas(); return; }

    if (g.type === 'tapAdd' && !g.moved) {
      const w = snapW(...s2w(g.start.x, g.start.y));
      if (!state.outlineDone && state.outline.length >= 3) {
        const f = w2s(state.outline[0][0], state.outline[0][1]);
        if (Math.hypot(f[0]-g.start.x, f[1]-g.start.y) <= 19) {
          state.outlineDone = true; save(); renderGarden(); toast('Obrys uzavřen'); return;
        }
      }
      if (state.outlineDone) { state.selVert = null; save(); renderGarden(); return; }
      state.outline.push(w); state.selVert = null; save(); renderGarden(); return;
    }
    if (g.type === 'insert' && !g.moved) {
      const a = state.outline[g.i], b = state.outline[(g.i+1) % state.outline.length];
      state.outline.splice(g.i+1, 0, snapW((a[0]+b[0])/2, (a[1]+b[1])/2));
      state.selVert = g.i+1;
      save(); renderGarden(); toast('Vrchol vložen'); return;
    }
    if (g.type === 'vertex') {
      if (g.moved) { save(); renderGarden(); }
      else { state.selVert = (state.selVert === g.i) ? null : g.i; save(); renderGarden(); }
      return;
    }
    if (g.type === 'erase') { save(); renderGarden(); return; }

    if (g.type === 'rect') {
      const pv = preview; preview = null;
      const w = s2w(g.start.x, g.start.y);
      const box = pv || { prvek:g.prvek, x:Math.floor(w[0]), y:Math.floor(w[1]), w:1, h:1 };
      const keys = rectKeys(box.x, box.y, box.x+box.w, box.y+box.h);
      // ctverecky vedle sebe patri k jednomu prvku stejneho typu
      const sousedi = new Set();
      keys.forEach(k => {
        const c = cxy(k);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(dd => {
          const o = ownerAt(ck(c[0]+dd[0], c[1]+dd[1]));
          if (o && o.typ === box.prvek) sousedi.add(o.id);
        });
      });
      let target = null;
      if (sousedi.size) {
        const ids = [...sousedi];
        target = state.items[ids[0]];
        ids.slice(1).forEach(id => { const o = state.items[id]; if (o) { addCells(target, o.cells.slice()); } });
      } else {
        const id = 'p' + state.nextId++;
        const n = items().filter(i => i.typ === box.prvek).length + 1;
        target = state.items[id] = { id, typ:box.prvek, cells:[], nazev: PRVKY[box.prvek].nazev + ' ' + n,
          cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[] };
      }
      addCells(target, keys);
      const fresh = !sousedi.size;
      state.sel = null;
      save(); renderGarden();
      if (fresh && box.prvek === 'bed') openItemModal(target.id);
      return;
    }
    if (g.type === 'stretch') { save(); renderGarden(); return; }
    if (g.type === 'move') {
      if (g.moved) { save(); renderGarden(); }
      else { state.sel = g.id; save(); renderGarden(); }
      return;
    }
    if (g.type === 'pan') {
      if (g.moved) save();
      else if (state.sel) { state.sel = null; save(); renderGarden(); }
      return;
    }
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', finish);

  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = cvRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

  el('zoom-in').onclick = () => { const r = cvRect(); zoomAt(1.3, r.width/2, r.height/2); };
  el('zoom-out').onclick = () => { const r = cvRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
  el('zoom-fit').onclick = () => fitView();
}

/* ============ OBRAZOVKA: KALENDAR ============ */
function renderCalendar() {
  const m = state.calMonth + 1;
  const mine = beds().map(b => ({ b, c: crop(b.cropId) })).filter(o => o.c);
  const mineTasks = [];
  mine.forEach(o => ukonyOf(o.c).filter(u=>u.m===m).forEach(u => mineTasks.push({ ...u, crop:o.c, bed:o.b })));
  const otherTasks = [];
  allCrops().forEach(c => {
    if (mine.some(o => o.c.id === c.id)) return;
    ukonyOf(c).filter(u=>u.m===m).forEach(u => otherTasks.push({ ...u, crop:c, bed:null }));
  });
  const order = { soil:0, sow:1, plant:2, care:3, harvest:4 };
  mineTasks.sort((a,b)=>order[a.typ]-order[b.typ]);
  otherTasks.sort((a,b)=>order[a.typ]-order[b.typ]);

  el('screen-calendar').innerHTML = `
    <div class="cal-nav">
      <button id="cal-prev" aria-label="Předchozí měsíc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>${MESICE[state.calMonth][0].toUpperCase()+MESICE[state.calMonth].slice(1)}</h2>
      <button id="cal-next" aria-label="Další měsíc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    ${mineTasks.length ? `
      <div class="task-group">
        <div class="tg-label">Co dělat na mých záhonech · ${mineTasks.length}</div>
        ${mineTasks.map(t => taskHTML(t, true)).join('')}
      </div>` : `
      <div class="task-group">
        <div class="tg-label">Moje záhonky</div>
        <div class="task" style="border-left-color:var(--line)">
          <div class="t-icon" style="background:var(--surface-2)">😌</div>
          <div class="t-body"><div class="t-title">V ${MESICE[state.calMonth]}u tu nic nečeká</div>
          <div class="t-sub">Na plodinách, které pěstuješ, není tento měsíc žádný úkon.</div></div>
        </div>
      </div>`}
    <div class="task-group">
      <div class="tg-label">Co se dá dělat navíc · ${otherTasks.length}</div>
      ${otherTasks.length ? otherTasks.map(t => taskHTML(t, false)).join('')
        : `<p class="hint">Pro ostatní plodiny v seznamu není v tomto měsíci nic naplánováno.</p>`}
    </div>
  `;
  el('cal-prev').onclick = () => { state.calMonth = (state.calMonth+11)%12; save(); renderCalendar(); };
  el('cal-next').onclick = () => { state.calMonth = (state.calMonth+1)%12; save(); renderCalendar(); };
  el('screen-calendar').querySelectorAll('[data-crop]').forEach(b => b.onclick = () => openCropDetail(b.dataset.crop));
}
function taskHTML(t, mine) {
  return `<div class="task ${t.typ}" data-crop="${t.crop.id}" role="button" tabindex="0">
    <div class="t-icon">${t.ic}</div>
    <div class="t-body">
      <div class="t-title">${esc(t.t)}</div>
      <div class="t-sub">${esc(t.crop.nazev)}${mine && t.bed ? ' · ' + esc(t.bed.nazev) : ''}</div>
      <div class="t-when">${TYP_LABEL[t.typ]}${mine?'':' · nepěstuješ'}</div>
    </div>
  </div>`;
}

        : `<strong>Uložená data.</strong> Předpovědi pro šest lokalit jsou skutečné, odečtené ${esc(ODECTENO)}. Tlačítkem Načíst zkusí appka stáhnout živou předpověď pro jakoukoli obec z Open-Meteo — v prostředí Artefaktů je to zakázané, ve vlastní aplikaci to funguje.`}</span>
    </div>
  `;
  el('screen-weather').querySelectorAll('[data-lok]').forEach(b => b.onclick = () => {

  if (lo) lo.onclick = () => { state.live = null; liveStav = { stav:'idle', chyba:'' }; save(); renderWeather(); };
}

function openModal(html) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modal-back'; back.id = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  back.addEventListener('pointerdown', e => { if (e.target === back) closeModal(); });
  document.body.appendChild(back);
  return back;
}
function closeModal() { const b = el('modal-back'); if (b) b.remove(); }

function shrinkImage(dataUrl, maxW, cb) {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { cb(c.toDataURL('image/jpeg', 0.75)); } catch (e) { cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

        </span>

      <div class="shop-card">

  });
  el('shop-add').onclick = () => openShopModal(null);
  const rs = el('shop-reset');
  if (rs) rs.onclick = () => { seedShops(); save(); renderShops(); toast('Výchozí obchody obnoveny'); };
}

function openShopModal(id) {
  const s = id ? shopOf(id) : null;
  const back = openModal(`
    <h2>${s ? 'Upravit obchod' : 'Nový obchod'}</h2>
    <p class="m-lead">${s ? 'Změň, co potřebuješ.' : 'Přidej e-shop, zahradnictví nebo místo, odkud bereš osivo.'}</p>
    <div class="field"><label for="f-sn">Název</label><input id="f-sn" value="${esc(s?s.nazev:'')}" placeholder="Zahradnictví u nádraží"></div>
    <div class="field"><label for="f-su">Odkaz nebo adresa</label><input id="f-su" value="${esc(s?s.url:'')}" placeholder="https://… nebo adresa prodejny"></div>
    <div class="field"><label for="f-si">Ikona</label><input id="f-si" value="${esc(s?(s.ico||'🛒'):'🛒')}" maxlength="3"></div>
    <div class="field"><label for="f-sp">Poznámka</label><textarea id="f-sp" placeholder="Co tam berou, jaké mají ceny, kdy mívají sadbu…">${esc(s?s.pozn:'')}</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" id="s-cancel">Zrušit</button>
      <button class="btn" id="s-save">Uložit</button>
    </div>
  `);
  const m = back.querySelector('.modal');
  m.querySelector('#s-cancel').onclick = closeModal;
  m.querySelector('#s-save').onclick = () => {
    const nazev = m.querySelector('#f-sn').value.trim();
    if (!nazev) { toast('Napiš název obchodu'); return; }
    let url = m.querySelector('#f-su').value.trim();
    if (url && !/^https?:\/\//i.test(url) && /\.[a-z]{2,}/i.test(url) && !/\s/.test(url)) url = 'https://' + url;
    const pozn = m.querySelector('#f-sp').value.trim();
    const ico = m.querySelector('#f-si').value.trim() || '🛒';
    if (s) { Object.assign(s, { nazev, url, pozn, ico }); }
    else {
      const nid = 'v' + (state.nextShop = (state.nextShop || 1) + 1);
      state.shops[nid] = { id:nid, nazev, url, pozn, ico, vlastni:true };
    }
    save(); closeModal(); renderShops(); renderBeds(); toast('Obchod uložen');
  };
}

/* ---- editor plodiny ---- */
const PRAZDNA_PLODINA = () => ({
  id:'', nazev:'', lat:'', emoji:'🌱', kat:'Plodová',
  sow:[], plant:[], harvest:[], hustota:9,
  rozestup:'', hloubka:'', slunce:'', pozor:'', rady:'', zaliv:'', sousedi:'', ukony:[]
});
function openCropEditor(id) {
  const orig = id ? crop(id) : null;
  const c = orig ? JSON.parse(JSON.stringify(orig)) : PRAZDNA_PLODINA();
  const novy = !id;
  const vlastni = id ? jeVlastni(id) : true;
  const mesRow = (klic, popis) => `
    <div class="field" style="margin-bottom:11px">
      <label>${popis}</label>
      <div class="mes-row">
        ${MESICE_KR.map((zk,i)=>`<button type="button" class="mes ${(c[klic]||[]).includes(i+1)?'on':''}" data-mg="${klic}" data-m="${i+1}" title="${esc(MESICE[i])}">${zk}</button>`).join('')}
      </div>
    </div>`;
  const back = openModal(`
    <h2>${novy ? 'Nová plodina' : 'Upravit ' + esc(c.nazev)}</h2>
    <p class="m-lead">${novy ? 'Co pěstuješ a kdy se o to staráš. Měsíce se propíšou do kalendáře.'
      : (vlastni ? 'Tvoje vlastní plodina.' : 'Úpravy se uloží jen u tebe, původní plodinu můžeš kdykoli vrátit.')}</p>
    <div class="field-row">
      <div class="field" style="flex:0 0 86px"><label for="c-emoji">Značka</label><input id="c-emoji" value="${esc(c.emoji)}" maxlength="3"></div>
      <div class="field"><label for="c-nazev">Název</label><input id="c-nazev" value="${esc(c.nazev)}" placeholder="Pastiňák"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="c-lat">Latinsky</label><input id="c-lat" value="${esc(c.lat)}" placeholder="Pastinaca sativa"></div>
      <div class="field"><label for="c-kat">Kategorie</label><input id="c-kat" list="kat-list" value="${esc(c.kat)}">
        <datalist id="kat-list">${kategorie().filter(k=>k!=='Vše').map(k=>`<option value="${esc(k)}">`).join('')}</datalist></div>
    </div>
    ${mesRow('sow','Měsíce výsevu')}
    ${mesRow('plant','Měsíce výsadby')}
    ${mesRow('harvest','Měsíce sklizně')}
    <div class="field-row">
      <div class="field"><label for="c-hust">Rostlin na m²</label><input type="number" id="c-hust" step="0.1" min="0.1" value="${c.hustota||9}"></div>
      <div class="field"><label for="c-rozestup">Rozestup</label><input id="c-rozestup" value="${esc(c.rozestup)}" placeholder="30 × 40 cm"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="c-hloubka">Hloubka</label><input id="c-hloubka" value="${esc(c.hloubka)}" placeholder="2 cm"></div>
      <div class="field"><label for="c-slunce">Stanoviště</label><input id="c-slunce" value="${esc(c.slunce)}" placeholder="Plné slunce"></div>
    </div>
    <div class="field"><label for="c-pozor">Na co si dát pozor</label><textarea id="c-pozor" placeholder="Škůdci, choroby, čeho se vyvarovat…">${esc(c.pozor)}</textarea></div>
    <div class="field"><label for="c-rady">Jak na to</label><textarea id="c-rady">${esc(c.rady)}</textarea></div>
    <div class="field"><label for="c-zaliv">Zálivka</label><textarea id="c-zaliv">${esc(c.zaliv)}</textarea></div>
    <div class="field"><label for="c-sousedi">Sousedé na záhonu</label><textarea id="c-sousedi" placeholder="Dobře: … Špatně: …">${esc(c.sousedi)}</textarea></div>
    <div class="field">
      <label>Úkony během roku</label>
      <div id="ukon-list">
        ${(c.ukony||[]).map((u,i)=>ukonRow(u,i)).join('')}
      </div>
      ${!(c.ukony||[]).length ? `<p class="hint" style="margin:0 0 8px">Bez vlastních úkonů se do kalendáře propíšou prosté „Výsev", „Výsadba" a „Sklizeň" podle měsíců výše.</p>` : ''}
      <button class="btn sm ghost" id="ukon-add" style="width:100%;justify-content:center">Přidat úkon</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="c-cancel">Zrušit</button>
      <button class="btn" id="c-save">Uložit</button>
    </div>
    ${!novy && vlastni ? `<div class="modal-actions"><button class="btn ghost" id="c-del" style="color:var(--danger)">Smazat plodinu</button></div>` : ''}
    ${!novy && !vlastni && jeUpravena(id) ? `<div class="modal-actions"><button class="btn ghost" id="c-reset">Vrátit původní</button></div>` : ''}
  `);
  const m = back.querySelector('.modal');
  m.querySelectorAll('[data-mg]').forEach(b => b.onclick = () => {
    const k = b.dataset.mg, mm = Number(b.dataset.m);
    c[k] = c[k] || [];
    const i = c[k].indexOf(mm);
    if (i >= 0) c[k].splice(i,1); else c[k].push(mm);
    b.classList.toggle('on', c[k].includes(mm));
  });
  const list = m.querySelector('#ukon-list');
  m.querySelector('#ukon-add').onclick = () => {
    const i = list.querySelectorAll('.ukon-row').length;
    list.insertAdjacentHTML('beforeend', ukonRow({ m:new Date().getMonth()+1, t:'', typ:'care', ic:'✂️' }, i));
    bindUkonRows(list);
  };
  bindUkonRows(list);
  m.querySelector('#c-cancel').onclick = closeModal;
  m.querySelector('#c-save').onclick = () => {
    const nazev = m.querySelector('#c-nazev').value.trim();
    if (!nazev) { toast('Napiš název plodiny'); return; }
    const sbirej = {};
    ['sow','plant','harvest'].forEach(k => { sbirej[k] = (c[k]||[]).slice().sort((a,b)=>a-b); });
    const ukony = [];
    list.querySelectorAll('.ukon-row').forEach(r => {
      const t = r.querySelector('[data-ut]').value.trim();
      if (!t) return;
      const typ = r.querySelector('[data-uk]').value;
      ukony.push({ m: Number(r.querySelector('[data-um]').value), t, typ, ic: IKONY_UKONU[typ] || '✂️' });
    });
    const data = {
      nazev,
      lat: m.querySelector('#c-lat').value.trim(),
      emoji: m.querySelector('#c-emoji').value.trim() || '🌱',
      kat: m.querySelector('#c-kat').value.trim() || 'Ostatní',
      sow: sbirej.sow, plant: sbirej.plant, harvest: sbirej.harvest,
      hustota: Math.max(0.1, parseFloat(m.querySelector('#c-hust').value) || 9),
      rozestup: m.querySelector('#c-rozestup').value.trim(),
      hloubka: m.querySelector('#c-hloubka').value.trim(),
      slunce: m.querySelector('#c-slunce').value.trim(),
      pozor: m.querySelector('#c-pozor').value.trim(),
      rady: m.querySelector('#c-rady').value.trim(),
      zaliv: m.querySelector('#c-zaliv').value.trim(),
      sousedi: m.querySelector('#c-sousedi').value.trim(),
      ukony,
    };
    if (novy) {
      const nid = 'u' + Date.now().toString(36);
      state.customCrops = (state.customCrops || []).concat([Object.assign({ id:nid }, data)]);
    } else if (vlastni) {
      const i = state.customCrops.findIndex(x => x.id === id);
      if (i >= 0) state.customCrops[i] = Object.assign({ id }, data);
    } else {
      state.cropEdits = state.cropEdits || {};
      state.cropEdits[id] = data;
    }
    save(); closeModal(); renderCrops(); renderBeds(); renderCalendar();
    toast(novy ? 'Plodina přidána' : 'Plodina uložena');
  };
  const del = m.querySelector('#c-del');
  if (del) del.onclick = () => confirmDialog('Smazat ' + c.nazev + '?', 'Zmizí ze seznamu. Záhonky, kde je přiřazená, zůstanou bez plodiny.', () => {
    state.customCrops = state.customCrops.filter(x => x.id !== id);
    beds().forEach(b => { if (b.cropId === id) b.cropId = null; });
    save(); closeModal(); renderCrops(); renderBeds(); renderCalendar(); toast('Plodina smazána');
  });
  const res = m.querySelector('#c-reset');
  if (res) res.onclick = () => confirmDialog('Vrátit původní?', 'Tvoje úpravy téhle plodiny se zahodí.', () => {
    delete state.cropEdits[id];
    save(); closeModal(); renderCrops(); renderBeds(); renderCalendar(); toast('Vráceno na původní');
  });
}
const IKONY_UKONU = { soil:'🪏', sow:'🌱', plant:'🌿', care:'✂️', harvest:'🧺' };
function ukonRow(u, i) {
  return `<div class="ukon-row">
    <select data-um aria-label="Měsíc">${MESICE.map((nm,j)=>`<option value="${j+1}" ${u.m===j+1?'selected':''}>${nm.slice(0,3)}</option>`).join('')}</select>
    <select data-uk aria-label="Typ">${Object.keys(TYP_LABEL).map(k=>`<option value="${k}" ${u.typ===k?'selected':''}>${TYP_LABEL[k]}</option>`).join('')}</select>
    <input data-ut value="${esc(u.t)}" placeholder="Co udělat" aria-label="Úkon">
    <button class="fi-rm" data-ur="${i}" aria-label="Odebrat úkon">×</button>
  </div>`;
}
function bindUkonRows(list) {
  list.querySelectorAll('[data-ur]').forEach(b => b.onclick = () => {
    b.closest('.ukon-row').remove();
  });
}

function confirmDialog(title, text, onYes) {
  const back = openModal(`
    <h2>${esc(title)}</h2>
    <p class="m-lead">${esc(text)}</p>
    <div class="modal-actions">
      <button class="btn ghost" id="c-no">Zrušit</button>
      <button class="btn" id="c-yes" style="background:var(--danger)">Potvrdit</button>
    </div>`);
  back.querySelector('#c-no').onclick = closeModal;
  back.querySelector('#c-yes').onclick = () => { closeModal(); onYes(); };
}

let toastT = null;
function toast(msg) {
  let t = el('toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:opacity .2s;max-width:88vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

/* ============ NAVIGACE ============ */
function switchTab(tab) {
  state.tab = tab; save();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el('screen-'+tab).classList.add('active');
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab==='garden') { renderGarden(); requestAnimationFrame(renderCanvas); }
  if (tab==='beds') renderBeds();
  if (tab==='crops') renderCrops();
  if (tab==='calendar') renderCalendar();
  if (tab==='weather') renderWeather();
  if (tab==='shops') renderShops();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ============ START ============ */
load();

const now = new Date();
el('season-label').textContent = sezona(now.getMonth()+1) + ' · ' + MESICE[now.getMonth()];

document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

el('theme-btn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur === 'dark' || (!cur && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  state.theme = dark ? 'light' : 'dark'; save();
  if (state.tab === 'garden') renderCanvas();
};
if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' || e.key === ' ') {
    const t = e.target;
    if (t && t.classList && t.classList.contains('task') && t.dataset.crop) { e.preventDefault(); openCropDetail(t.dataset.crop); }
  }
});
window.addEventListener('resize', () => { if (state.tab === 'garden') scheduleRender(); });

switchTab(state.tab || 'garden');
if (!state.view) requestAnimationFrame(() => fitView());
</script>
