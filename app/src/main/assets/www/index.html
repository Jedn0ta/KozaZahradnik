<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=swap">
<style>
/* Layout: pevná aplikační slupka — horní lišta, jedna rolovací plocha,
   dolní navigace. Plán zahrady je mapa přes celou plochu s plovoucím
   ovládáním a vysouvacím panelem. */
:root {
  --bg: #ffffff;
  --bg2: #f3f6f1;
  --card: #ffffff;
  --ink: #0f1a12;
  --ink2: #5c6b5e;
  --ink3: #8a9a8c;
  --line: #e1e8df;
  --line2: #eef2ec;
  --acc: #1e7a3c;
  --acc-dark: #156030;
  --acc-soft: #e4f1e7;
  --acc-ink: #ffffff;
  --earth: #a9663a;
  --earth-soft: #f3e8dd;
  --sun: #d99a1f;
  --sky: #2f7fa8;
  --danger: #c0392b;
  --paper: #f7f6ee;
  --dot: #cdd5c3;
  --grid: #eceee1;
  --house: #8d96a0;
  --house-soft: #e7eaee;
  --r: 16px;
  --r-s: 11px;
  --sh: 0 1px 2px rgba(15,26,18,.05), 0 4px 16px rgba(15,26,18,.06);
  --sh-lift: 0 2px 6px rgba(15,26,18,.1), 0 12px 32px rgba(15,26,18,.14);
  --ui: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11170f; --bg2: #0b100a; --card: #19211700; --card: #192117;
    --ink: #e9efe6; --ink2: #9fb09f; --ink3: #6f8070;
    --line: #2a3528; --line2: #212b20;
    --acc: #4fab6a; --acc-dark: #3d8f55; --acc-soft: #1b2b1f; --acc-ink: #06160a;
    --earth: #c08css; --earth: #c08b5e; --earth-soft: #2b211a;
    --sun: #e0ad42; --sky: #5aa6cd; --danger: #e06153;
    --paper: #141b12; --dot: #36442f; --grid: #1d2619;
    --house: #7e8992; --house-soft: #252d33;
    --sh: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --sh-lift: 0 2px 8px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11170f; --bg2: #0b100a; --card: #192117;
  --ink: #e9efe6; --ink2: #9fb09f; --ink3: #6f8070;
  --line: #2a3528; --line2: #212b20;
  --acc: #4fab6a; --acc-dark: #3d8f55; --acc-soft: #1b2b1f; --acc-ink: #06160a;
  --earth: #c08b5e; --earth-soft: #2b211a;
  --sun: #e0ad42; --sky: #5aa6cd; --danger: #e06153;
  --paper: #141b12; --dot: #36442f; --grid: #1d2619;
  --house: #7e8992; --house-soft: #252d33;
  --sh: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --sh-lift: 0 2px 8px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--ui); font-size: 15px; line-height: 1.45;
  font-weight: 500; -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
h1,h2,h3,h4 { margin: 0; font-weight: 800; letter-spacing: -.02em; }

/* ---------- slupka ---------- */
#app {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  max-width: 640px; margin: 0 auto; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
}
#bar {
  flex: none; height: 56px; display: flex; align-items: center; gap: 12px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line2); z-index: 10;
}
#bar h1 { font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.15; }
#bar .sub { font-size: 12px; font-weight: 600; color: var(--ink3); letter-spacing: 0; }
.bar-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  color: var(--ink2); flex: none;
}
.bar-btn:active { background: var(--line2); }
.bar-btn svg { width: 21px; height: 21px; }
.bar-mark { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; flex: none; background: var(--acc-dark); display: grid; place-items: center; }
.bar-mark svg { width: 26px; height: 26px; }

#view { flex: 1; min-height: 0; position: relative; }
.scr { position: absolute; inset: 0; display: none; flex-direction: column; }
.scr.on { display: flex; }
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 24px;
}

/* ---------- dolní navigace ---------- */
#nav {
  flex: none; display: flex; background: var(--bg);
  border-top: 1px solid var(--line2);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  z-index: 10;
}
#nav button {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 9px 2px 7px; color: var(--ink3);
  font-size: 10.5px; font-weight: 700; letter-spacing: -.01em;
}
#nav button .ni {
  width: 54px; height: 30px; border-radius: 16px; display: grid; place-items: center;
  padding: 0;
  transition: background .15s;
}
#nav button .ni .pix { width: 24px; height: 24px; }
#nav button.on { color: var(--acc); }
#nav button.on .ni { background: var(--acc-soft); }
</style>
<style>
/* ---------- obecné prvky ---------- */
.sec { margin-top: 22px; }
.sec:first-child { margin-top: 16px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px; }
.sec-h h2 { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
.sec-h .n { font-size: 12px; font-weight: 700; color: var(--ink3); margin-left: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; padding: 0 20px; border-radius: 14px;
  background: var(--acc); color: var(--acc-ink); font-weight: 700; font-size: 15.5px;
}
.btn:active { background: var(--acc-dark); }
.btn.sec { background: var(--bg2); color: var(--ink); border: 1px solid var(--line); }
.btn.sec:active { background: var(--line2); }
.btn.sm { height: 40px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn .pix { width: 22px; height: 22px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--bg); font-size: 15.5px; font-weight: 600;
}
.field textarea { height: auto; min-height: 76px; padding: 12px 14px; resize: vertical; font-weight: 500; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--acc); }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; min-width: 0; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 38px; padding: 0 16px; border-radius: 19px;
  border: 1.5px solid var(--line); background: var(--bg);
  font-size: 14px; font-weight: 700; color: var(--ink2); white-space: nowrap;
}
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

.seg {
  display: flex; background: var(--bg2); border-radius: 13px; padding: 4px; gap: 4px;
}
.seg button {
  flex: 1; height: 38px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--ink2);
}
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--sh); }

.pix { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.empty { text-align: center; padding: 48px 24px; }
.empty .ei { width: 72px; height: 72px; margin: 0 auto 14px; opacity: .85; }
.empty h3 { font-size: 18px; margin-bottom: 6px; }
.empty p { color: var(--ink2); font-size: 14.5px; margin: 0 0 20px; }

/* ---------- mapa ---------- */
.map { position: absolute; inset: 0; background: var(--paper); }
#cv { position: absolute; inset: 0; touch-action: none; overflow: hidden; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.m-search {
  position: absolute; top: 12px; left: 78px; right: 12px; z-index: 4;
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px;
  background: var(--card); border-radius: 26px; box-shadow: var(--sh-lift);
  font-size: 15px; font-weight: 700; color: var(--ink); text-align: left;
}
.m-search .si { width: 20px; height: 20px; flex: none; color: var(--acc); }
.m-search .st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-search .sx { width: 36px; height: 36px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; flex: none; color: var(--ink2); }
.m-search .sx svg { width: 17px; height: 17px; }
.m-search.plain { color: var(--ink3); font-weight: 600; }

.m-panel {
  position: absolute; top: 12px; left: 12px; right: 12px; z-index: 6;
  background: var(--card); border-radius: 20px; box-shadow: var(--sh-lift); padding: 16px;
}
.m-panel .ph { display: flex; align-items: center; margin-bottom: 14px; }
.m-panel .ph h3 { font-size: 17px; flex: 1; }

.m-zoom { position: absolute; right: 12px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
.m-zoom button {
  width: 44px; height: 44px; border-radius: 14px; background: var(--card);
  box-shadow: var(--sh); color: var(--ink); display: grid; place-items: center;
  font-size: 22px; font-weight: 700;
}
.m-zoom button svg { width: 19px; height: 19px; }

.m-scale {
  position: absolute; left: 78px; z-index: 3; pointer-events: none;
  display: flex; align-items: flex-end; gap: 10px;
  font-size: 11px; font-weight: 800; color: var(--ink2);
}
.m-scale .b { height: 6px; border: 1.5px solid var(--ink2); border-top: none; }

.m-load {
  position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  font-weight: 700; color: var(--ink2); font-size: 14.5px;
}
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--acc); animation: sp .75s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }

/* dolní lišta mapy: jen čtyři kulatá tlačítka, ať zbyde místo na plán */
.mbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; gap: 8px; justify-content: center;
  padding: 9px max(12px, env(safe-area-inset-left,0px)) max(10px, env(safe-area-inset-bottom,0px));
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: blur(14px); border-top: 1px solid var(--line2);
}
.mbtn {
  flex: 1; max-width: 104px; height: 56px; border-radius: 17px; background: var(--bg2);
  border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 800; color: var(--ink2);
  letter-spacing: -.01em;
}
.mbtn .pix { width: 24px; height: 24px; }
.mbtn.on { background: var(--acc-soft); border-color: var(--acc); color: var(--acc-dark); }
.mbtn.go { background: var(--acc); color: var(--acc-ink); }
.mbtn.go .pl { font-size: 23px; line-height: 1; font-weight: 400; }

/* režim kreslení: jasně napsané, co se právě děje */
.m-mode {
  position: absolute; top: 12px; left: 78px; right: 12px; z-index: 5;
  display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px;
  background: var(--acc-dark); color: #fff; border-radius: 18px; box-shadow: var(--sh-lift);
}
.m-mode .pix { width: 28px; height: 28px; flex: none; }
.m-mode .mt { flex: 1; min-width: 0; }
.m-mode .mt b { display: block; font-size: 14px; font-weight: 800; }
.m-mode .mt span { display: block; font-size: 11.5px; font-weight: 600; opacity: .85; line-height: 1.3; }
.m-mode button {
  flex: none; height: 38px; padding: 0 15px; border-radius: 12px;
  background: rgba(255,255,255,.18); color: #fff; font-size: 13.5px; font-weight: 800;
}

/* vysouvací kartička nad lištou (výběr parcel, vybraný prvek) */
.msheet {
  position: absolute; left: 0; right: 0; z-index: 5;
  background: var(--card); border-radius: 20px 20px 0 0;
  box-shadow: 0 -2px 10px rgba(15,26,18,.07), 0 -12px 34px rgba(15,26,18,.1);
  padding: 13px max(16px, env(safe-area-inset-left,0px)) 14px;
  max-height: 46%; overflow-y: auto; overscroll-behavior: contain;
}
.msheet h3 { font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }

/* dlaždice v dialogu Přidat */
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick button {
  display: flex; align-items: center; gap: 11px; padding: 12px;
  border: 1.5px solid var(--line); border-radius: 15px; background: var(--bg);
  text-align: left; font-size: 13.5px; font-weight: 800; color: var(--ink); line-height: 1.25;
}
.pick button .pix { width: 34px; height: 34px; flex: none; }
.pick button:active { border-color: var(--acc); background: var(--acc-soft); }

.parcels { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.parcel {
  border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 13px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; background: var(--bg);
}
.parcel.on { border-color: var(--acc); background: var(--acc-soft); }
.parcel .pn { font-size: 15px; font-weight: 800; }
.parcel .pm { font-size: 11.5px; font-weight: 700; color: var(--ink3); }
.parcel.on .pm { color: var(--acc-dark); }

.selbar {
  display: flex; align-items: center; gap: 11px;
  background: var(--acc-soft); border-radius: 14px; padding: 11px 12px;
}
.selbar .si { width: 38px; height: 38px; flex: none; border-radius: 11px; overflow: hidden; background: var(--card); display: grid; place-items: center; }
.selbar .sn { display: block; flex: 1; min-width: 0; }
.selbar .sn b { display: block; font-size: 14.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selbar .sn span { font-size: 12px; font-weight: 700; color: var(--ink2); }
</style>
<style>
/* ---------- seznamy (záhonky, plodiny, kalendář, nákup) ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden;
}
.row {
  display: flex; align-items: center; gap: 13px; padding: 13px;
}
.row .thumb {
  width: 54px; height: 54px; flex: none; border-radius: 14px; overflow: hidden;
  background: var(--acc-soft); display: grid; place-items: center; padding: 5px;
}
.row .thumb img { width: 100%; height: 100%; object-fit: cover; }
.row .mid { display: block; flex: 1; min-width: 0; }
.row .mid b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.row .mid span { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin-top: 1px; }
.row .act {
  width: 50px; height: 50px; flex: none; border-radius: 15px; background: var(--acc-soft);
  display: grid; place-items: center; color: var(--acc); padding: 12px;
}
.row .act .pix { width: 26px; height: 26px; }
.row .act.done { background: var(--bg2); color: var(--ink3); }
.row .go { width: 22px; height: 22px; color: var(--ink3); flex: none; }

.photo { width: 100%; height: 180px; object-fit: cover; display: block; background: var(--bg2); }
.photo-strip { display: flex; gap: 2px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.photo-strip::-webkit-scrollbar { display: none; }
.photo-strip figure { margin: 0; flex: none; width: 88%; scroll-snap-align: start; position: relative; }
.photo-strip figure:only-child { width: 100%; }
.photo-strip figcaption {
  position: absolute; left: 10px; bottom: 10px; padding: 5px 10px; border-radius: 9px;
  background: rgba(10,18,12,.6); color: #fff; font-size: 11.5px; font-weight: 700;
}
.addphoto {
  display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
  height: 54px; border-bottom: 1px solid var(--line2); color: var(--ink2);
  font-size: 14px; font-weight: 700; background: var(--bg2);
}
.addphoto .pix, .addphoto .ik { width: 22px; height: 22px; flex: none; }

.count {
  display: flex; align-items: center; gap: 12px; padding: 0 13px 13px;
}
.count button {
  width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid var(--line);
  font-size: 24px; font-weight: 700; color: var(--acc); display: grid; place-items: center;
}
.count button:active { background: var(--acc-soft); }
.count .cv {
  display: block; flex: 1; text-align: center; width: auto; height: auto;
  border: none; border-radius: 12px; padding: 4px 0; color: inherit;
}
.count .cv:active { background: var(--bg2); }
.count .cv b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.count .cv span { font-size: 11.5px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }

.tags { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 13px 13px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px;
  border-radius: 9px; background: var(--bg2); font-size: 12px; font-weight: 700; color: var(--ink2);
}
.tag .pix { width: 15px; height: 15px; }
.tag.warn { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.tile {
  display: block; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; text-align: left;
}
.tile .top { display: block; aspect-ratio: 1/1; background: var(--acc-soft); position: relative; padding: 11px; }
.tile .top img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; padding: 0; }
.tile .cam {
  position: absolute; right: 7px; bottom: 7px; width: 28px; height: 28px; border-radius: 9px;
  background: color-mix(in srgb, var(--card) 88%, transparent); display: grid; place-items: center; padding: 4px;
}
.tile .mine {
  position: absolute; left: 7px; top: 7px; height: 22px; padding: 0 8px; border-radius: 7px;
  background: var(--acc); color: var(--acc-ink); font-size: 10px; font-weight: 800;
  display: grid; place-items: center; letter-spacing: .03em; text-transform: uppercase;
}
.tile .nm { display: block; padding: 10px 12px 12px; }
.tile .nm b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.months { display: flex; gap: 2px; margin-top: 8px; }
.tile .top > .pix { width: 100%; height: 100%; }
.months i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.months i.s { background: var(--sky); }
.months i.p { background: var(--acc); }
.months i.h { background: var(--sun); }

/* ---------- kalendář ---------- */
.calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.calhead .nm { flex: 1; min-width: 0; text-align: center; }
.calhead .nm b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.02em; text-transform: capitalize; }
.calhead .nm span { display: block; font-size: 12px; font-weight: 700; color: var(--ink3); }
.calhead .ar {
  width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--bg2);
  font-size: 22px; font-weight: 700; color: var(--ink2); display: grid; place-items: center;

function load() {
  try {
    const raw = localStorage.getItem('zahradka-v2');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        state = Object.assign(state, p);
        if (p.view && isFinite(p.view.scale)) view = p.view;
        if (!state.shops || !Object.keys(state.shops).length) seedShops();

        if (!PRVKY[state.tool] && ['pan','outline','erase'].indexOf(state.tool) < 0) state.tool = 'pan';

        if (!state.radyEdit) state.radyEdit = {};
        if (!Array.isArray(state.vlastniRady)) state.vlastniRady = [];
        if (!state.calRezim) state.calRezim = 'mesic';
        // po přestavbě rozhraní se pohled na plán jednou srovná znovu
        if (state.uiVerze !== 5) { state.uiVerze = 5; state.view = null; }
        items().forEach(i => {
          if (!i.hnojeni) i.hnojeni = [];
          if (!i.zalivka) i.zalivka = [];

          if (i.thumb !== undefined) delete i.thumb;
          i.fotky = (i.fotky || []).map(f => typeof f === 'string' ? { data:f, datum:'' } : f);
          if (!i.cells) {
            const x = Math.round(i.x||0), y = Math.round(i.y||0);
            const w = Math.max(1, Math.round(i.w||1)), hh = Math.max(1, Math.round(i.h||1));
            i.cells = rectKeys(x, y, x+w, y+hh);
            delete i.x; delete i.y; delete i.w; delete i.h;
          }
        });
        return;
      }
    }
  } catch (e) {}
  // prvni spusteni: prazdna zahrada, uzivatel si nacte svou parcelu
  state.outline = []; state.outlineDone = false; state.items = {}; state.vedlejsi = [];

function shrinkImage(dataUrl, maxW, cb) {
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { cb(c.toDataURL('image/jpeg', 0.75)); } catch (e) { cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

function pixSvg(id) {
  const s = PIX[id];
  if (!s) return '';
  let r = '';
  for (let y = 0; y < s.d.length; y++) {
    const row = s.d[y];
    for (let x = 0; x < row.length; x++) {
      const c = s.p[row[x]];
      if (c) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`;
    }
  }
  return `<svg class="pix" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
/* Tentyz sprite, ale jako skupina do velkeho SVG planu */
function pixInto(id, x, y, size) {
  const s = PIX[id];
  if (!s) return '';
  const k = size / 16;
  let r = '';
  for (let yy = 0; yy < s.d.length; yy++) {
    const row = s.d[yy];
    for (let xx = 0; xx < row.length; xx++) {
      const c = s.p[row[xx]];
      if (c) r += `<rect x="${(xx*k).toFixed(2)}" y="${(yy*k).toFixed(2)}" width="${(k*1.05).toFixed(2)}" height="${(k*1.05).toFixed(2)}" fill="${c}"/>`;
    }
  }
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" shape-rendering="crispEdges">${r}</g>`;
}
const cropPixId = (c) => (c && PIX[c.id]) ? c.id : null;

/* ============ GEOMETRIE ============
   Obrys zahrady je polygon v metrech, s vrcholy, ktere se daji tahat.
   Prvky (zahon, dum, cesta) jsou mnoziny ctverecku 1 x 1 m, takze muzou mit
   i nepravidelny tvar a daji se po ctverecku pridavat i ubirat. */
function polyArea(pts) {
  if (!pts || pts.length < 3) return 0;
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i+1) % pts.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s) / 2;
}
function pointInPoly(x, y, pts) {
  if (!pts || pts.length < 3) return true;
  let inside = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj-xi) * (y-yi) / (yj-yi) + xi)) inside = !inside;
  }
  return inside;
}
function bbox(pts) {
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return { x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys) };
}

/* --- ctverecky --- */
const ck = (x, y) => x + ',' + y;
const cxy = (k) => { const p = k.split(','); return [ +p[0], +p[1] ]; };
const cellsOf = (it) => (it && it.cells) || [];
const itArea = (it) => (PRVKY[it.typ] && PRVKY[it.typ].maly && it.rozmer)
  ? (it.rozmer.w * it.rozmer.h * cellsOf(it).length)
  : cellsOf(it).length;
const itRozmer = (it) => (PRVKY[it.typ] && PRVKY[it.typ].maly && it.rozmer)
  ? { w: it.rozmer.w, h: it.rozmer.h } : null;
function itBBox(it) {
  const cs = cellsOf(it);
  if (!cs.length) return { x0:0, y0:0, x1:0, y1:0, w:0, h:0 };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const k of cs) {
    const c = cxy(k);
    if (c[0] < x0) x0 = c[0];
    if (c[1] < y0) y0 = c[1];
    if (c[0]+1 > x1) x1 = c[0]+1;
    if (c[1]+1 > y1) y1 = c[1]+1;
  }
  return { x0, y0, x1, y1, w: x1-x0, h: y1-y0 };
}
const isRect = (it) => { const b = itBBox(it); return itArea(it) === b.w * b.h; };
function rectKeys(x0, y0, x1, y1) {
  const out = [];
  for (let y = Math.min(y0,y1); y < Math.max(y0,y1); y++)
    for (let x = Math.min(x0,x1); x < Math.max(x0,x1); x++) out.push(ck(x,y));
  return out;
}
function ownerAt(key) {
  for (const i of items()) if ((i.cells||[]).indexOf(key) >= 0) return i;
  return null;
}
function pruneEmpty() {
  Object.keys(state.items).forEach(id => {
    const it = state.items[id];
    if (!it.cells || !it.cells.length) {
      delete state.items[id];
      if (state.sel === id) state.sel = null;
    }
  });
}
/* Pridani ctverecku jednomu prvku. Co patrilo jinemu, se mu odebere. */
function addCells(it, keys) {
  const mine = new Set(it.cells || []);
  keys.forEach(k => {
    const o = ownerAt(k);
    if (o && o.id !== it.id) o.cells = o.cells.filter(x => x !== k);
    mine.add(k);
  });
  it.cells = [...mine];
  pruneEmpty();
}
function removeCells(keys) {
  keys.forEach(k => { const o = ownerAt(k); if (o) o.cells = o.cells.filter(x => x !== k); });
  pruneEmpty();
}
/* Novy prvek planu. Vsechny maji stejnou strukturu, at se do nich sazi nebo ne. */
function novyPrvek(typ, keys) {
  const id = 'p' + state.nextId++;
  const n = items().filter(i => i.typ === typ).length + 1;
  const rz = PRVKY[typ].rozmer ? { w:PRVKY[typ].rozmer.w, h:PRVKY[typ].rozmer.h } : null;
  const it = state.items[id] = { id, typ, cells:[], rozmer: rz, nazev: PRVKY[typ].nazev + ' ' + n,
    cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[], zalivka:[], sklizen:[], historie:[], udalosti:[], zaznamy:[], rostliny:null, zamek:false };
  addCells(it, keys);
  return it;
}
function moveItemBy(it, dx, dy) {
  const keys = cellsOf(it).map(k => { const c = cxy(k); return ck(c[0]+dx, c[1]+dy); });
  it.cells = [];
  addCells(it, keys);
}
/* Roztahovani za uchyt: nova rada vznikne kopii krajni rady, takze to funguje
   i u nepravidelnych tvaru. Zmensovani krajni radu odebere. */
function stretch(it, side, grow) {
  const b = itBBox(it);
  const cs = cellsOf(it).map(cxy);
  if (grow) {
    let nk = [];
    if (side === 'E') nk = cs.filter(p => p[0] === b.x1-1).map(p => ck(b.x1, p[1]));
    if (side === 'W') nk = cs.filter(p => p[0] === b.x0).map(p => ck(b.x0-1, p[1]));
    if (side === 'S') nk = cs.filter(p => p[1] === b.y1-1).map(p => ck(p[0], b.y1));
    if (side === 'N') nk = cs.filter(p => p[1] === b.y0).map(p => ck(p[0], b.y0-1));
    if (!nk.length) return false;
    addCells(it, nk);
    return true;
  }
  if ((side === 'E' || side === 'W') && b.w <= 1) return false;
  if ((side === 'N' || side === 'S') && b.h <= 1) return false;
  let rm = [];
  if (side === 'E') rm = cs.filter(p => p[0] === b.x1-1);
  if (side === 'W') rm = cs.filter(p => p[0] === b.x0);
  if (side === 'S') rm = cs.filter(p => p[1] === b.y1-1);
  if (side === 'N') rm = cs.filter(p => p[1] === b.y0);
  const rmSet = new Set(rm.map(p => ck(p[0], p[1])));
  const left = cellsOf(it).filter(k => !rmSet.has(k));
  if (!left.length) return false;
  it.cells = left;
  return true;
}
function reshapeRect(it, w, h) {
  const b = itBBox(it);
  it.cells = [];
  addCells(it, rectKeys(b.x0, b.y0, b.x0 + Math.max(1, Math.round(w)), b.y0 + Math.max(1, Math.round(h))));
}
/* Prvek je v zahrade, kdyz lezi v obrysu nebo na nektere vedlejsi parcele */
function itemInside(it) {
  if (!state.outlineDone || state.outline.length < 3) return true;
  const plochy = [state.outline].concat(state.vedlejsi || []);
  const cs = cellsOf(it);
  if (!cs.length) return true;
  let uvnitr = 0;
  cs.forEach(k => {
    const c = cxy(k), x = c[0]+0.5, y = c[1]+0.5;
    if (plochy.some(poly => poly.length >= 3 && pointInPoly(x, y, poly))) uvnitr++;
  });
  return uvnitr / cs.length >= 0.6;
}
/* Hrany unie ctverecku: kreslime linku jen tam, kde vedle neni dalsi ctverecek */
function edgeSegments(it) {
  const s = new Set(cellsOf(it));
  const segs = [];
  s.forEach(k => {
    const c = cxy(k), x = c[0], y = c[1];
    if (!s.has(ck(x, y-1))) segs.push([x, y, x+1, y]);
    if (!s.has(ck(x, y+1))) segs.push([x, y+1, x+1, y+1]);
    if (!s.has(ck(x-1, y))) segs.push([x, y, x, y+1]);
    if (!s.has(ck(x+1, y))) segs.push([x+1, y, x+1, y+1]);
  });
  return segs;
}

const DNY_KR = ['Ne','Po','Út','St','Čt','Pá','So'];

async function nactiZivePocasi(dotaz) {
  liveStav = { stav:'nacitam', chyba:'' };
  kresliPocasi();
  try {
    const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=cs&format=json&name='
      + encodeURIComponent(dotaz));
    if (!g.ok) throw new Error('geo ' + g.status);

      kresliPocasi(); return;
    }
    const m = gj.results[0];
    const f = await fetch('https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + m.latitude + '&longitude=' + m.longitude
      + '&current=temperature_2m'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum'
      + '&timezone=auto&forecast_days=6');
    if (!f.ok) throw new Error('fc ' + f.status);
    const fj = await f.json();
    const d = fj.daily;
    const dny = d.time.slice(0,6).map((iso,i) => {
      const dt = new Date(iso + 'T12:00:00');
      return {
        d: DNY_KR[dt.getDay()],
        datum: dt.getDate() + '. ' + (dt.getMonth()+1) + '.',
        max: d.temperature_2m_max[i],
        min: d.temperature_2m_min[i],
        p: d.precipitation_probability_max[i] == null ? 0 : d.precipitation_probability_max[i],
        mm: d.precipitation_sum[i] == null ? 0 : d.precipitation_sum[i],
      };
    });
    const ted = new Date();
    state.live = {
      id: 'live',
      nazev: m.name + (m.admin1 ? ', ' + m.admin1 : ''),
      t: fj.current && fj.current.temperature_2m != null ? fj.current.temperature_2m : dny[0].max,
      dny,
      cas: ('0'+ted.getHours()).slice(-2) + ':' + ('0'+ted.getMinutes()).slice(-2),

    liveStav = { stav:'blokovano', chyba: String(e && e.message || e) };
    kresliPocasi();
  }
}

/* Hlidac. Radit "zalij" v listopadu je nesmysl, takze zalivka se resi
   jen v sezone (duben az zari) a jen kdyz je vubec co zalevat.
   Mimo sezonu hlida mraz, sklizen a zazimovani. */
function zalivkaStav() {
  const w = lok(), dny = w.dny, out = [];
  const m = new Date().getMonth() + 1;
  const maMm = dny.some(d => d.mm != null);
  const osazene = beds().filter(x => crop(x.cropId));
  /* Hlavni sezona zalivky. V breznu a rijnu uz jen vyjimecne pri suchu a teple. */
  const plnaSezona = m >= 5 && m <= 8;
  const okrajSezony = (m === 4 || m === 9) ;
  const sezonaZalivky = (plnaSezona || okrajSezony) && osazene.length > 0;
  const suchoDny = dny.slice(1,4);
  const sucho = suchoDny.length >= 3 && suchoDny.every(d => maMm ? d.mm < 1.5 : d.p < 25);
  const teplo = dny.slice(0,3).some(d => d.max >= 18);

  if (sezonaZalivky) {
    const zitra = dny[1];
    if (zitra && (maMm ? zitra.mm >= 3 : zitra.p >= 60)) {
      out.push({ alert:false, ic:ik('dest'), title:'Z\u00e1livku odlo\u017e',
        sub:`Z\u00edtra ${maMm ? 'spadne ' + fmtN(zitra.mm) + ' mm sr\u00e1\u017eek' : 'je ' + zitra.p + ' % \u0161ance na d\u00e9\u0161\u0165'}. Zal\u00e9vat dnes nem\u00e1 smysl, voda by jen protekla.` });
    } else if (sucho && (plnaSezona || teplo)) {
      out.push({ alert:true, ic:ik('konev'), title:'Zalij z\u00e1honky',
        sub:`T\u0159i dny v \u0159ad\u011b bez v\u00fdrazn\u00e9ho de\u0161t\u011b, jen ${suchoDny.map(d=>maMm ? fmtN(d.mm)+' mm' : d.p+' %').join(', ')}. Zal\u00e9vej r\u00e1no ke koren\u016fm, ne na listy.` });
    }
    // nejdele nezality zahon, kdyz se neblizi dest
    if (sucho) {
      const poradi = osazene.map(x => {
        const lw = lastWater(x);
        return { b:x, d: lw ? (dnuOd(lw) == null ? 999 : dnuOd(lw)) : 999 };
      }).sort((x,y) => y.d - x.d);
      if (poradi.length && poradi[0].d >= 3) {
        const n = poradi[0];
        out.push({ alert:true, ic:ik('pozor'), title:`Nejd\u00e9le bez vody: ${n.b.nazev}`,
          sub: n.d > 900
            ? 'Z\u00e1livka tu nen\u00ed v\u016fbec zapsan\u00e1. Konv\u00ed u z\u00e1honku si to za\u010dne\u0161 hl\u00eddat.'
            : `Naposledy zalito p\u0159ed ${n.d} dny. Po zal\u00e9v\u00e1n\u00ed klepni na konev u z\u00e1honku.` });
      }
    }
    const dest = dny.slice(2).find(d => (d.mm != null && d.mm >= 2) || d.p >= 50);
    if (dest) {
      out.push({ alert:false, ic:ik('dest'), title:`D\u00e9\u0161\u0165 p\u0159ijde ${dest.d} ${dest.datum}`,
        sub:`${dest.mm != null && dest.mm > 0 ? fmtN(dest.mm) + ' mm' : dest.p + ' % \u0161ance'} sr\u00e1\u017eek. A\u017e do t\u00e9 doby po\u010d\u00edtej se zal\u00e9v\u00e1n\u00edm.` });
    }
  } else {
    out.push({ alert:false, ic:ik('klid'), title:'Zal\u00e9vat se te\u010f nemus\u00ed',
      sub: m >= 10 || m <= 2
        ? `V ${MESICE[m-1]}u je venku z\u00e1livka zbyte\u010dn\u00e1 \u2014 p\u016fda dr\u017e\u00ed vlhkost a rostliny skoro nepij\u00ed. Hl\u00eddej m\u00edsto toho mrazy. Truhl\u00edky a kv\u011btin\u00e1\u010de u zdi domu se ale m\u016f\u017eou vysu\u0161it, ob\u010das se do nich pod\u00edvej.`
        : (osazene.length ? `V ${MESICE[m-1]}u je\u0161t\u011b sta\u010d\u00ed sr\u00e1\u017eky. Z\u00e1livku za\u010dni hl\u00eddat, a\u017e bude po n\u011bkolik dn\u00ed nad 18 \u00b0C a bez de\u0161t\u011b.`
                          : 'Zat\u00edm nem\u00e1\u0161 u z\u00e1honk\u016f zadanou plodinu, tak\u017ee nen\u00ed co hl\u00eddat. P\u0159i\u0159a\u010f plodinu a hl\u00edda\u010d za\u010dne radit.') });
  }

  const mraz = dny.filter(d => d.min <= 3);
  if (mraz.length) {
    const nej = mraz.reduce((x,y) => x.min < y.min ? x : y);
    out.push({ alert:true, ic:ik('mraz'), title:`Chladn\u00e9 noci, a\u017e ${fmtN(nej.min)} \u00b0C`,
      sub:`${mraz.map(d=>d.d).join(', ')} spadne no\u010dn\u00ed teplota k nule. Hroz\u00ed p\u0159\u00edzemn\u00ed mraz\u00edk \u2014 zakryj citliv\u00e9 plodiny netkanou textili\u00ed, truhl\u00edky a kv\u011btin\u00e1\u010de odnes ke zdi nebo do gar\u00e1\u017ee.` });
  }
  const skok = dny.length > 1 ? dny[0].max - dny[1].max : 0;
  if (skok >= 7) {
    out.push({ alert:true, ic:ik('teplomer'), title:`Z\u00edtra ochlazen\u00ed o ${Math.round(skok)} \u00b0C`,
      sub:`Dnes ${fmtN(dny[0].max)} \u00b0C, z\u00edtra u\u017e jen ${fmtN(dny[1].max)} \u00b0C. Co chce\u0161 sklidit v teple, sklid\u00ed dnes.` });
  }
  const sklizen = osazene.filter(x => { const c = crop(x.cropId); return c && c.harvest.includes(m); });
  if (sklizen.length) {
    out.push({ alert:false, ic:ik('kosik'), title:`${sklizen.length}\u00d7 plodina ke sklizni`,
      sub: [...new Set(sklizen.map(x=>crop(x.cropId).nazev))].join(', ') + ' \u2014 tento m\u011bs\u00edc je \u010das skl\u00edzet.' });
  }
  if (m === 10 || m === 11) {
    out.push({ alert:false, ic:ik('ryc'), title:'\u010cas zazimovat',
      sub:'Sklizen\u00e9 z\u00e1hony zaryj nebo zakryj kompostem a list\u00edm, hadice vypus\u0165 a konve ukli\u010f, aby nepopraskaly mrazem.' });
  }
  return out;
}

    const b = itBBox(it);
    parts.push(`<rect x="${X(b.x0)}" y="${Y(b.y0)}" width="${(b.w*s).toFixed(1)}" height="${(b.h*s).toFixed(1)}" fill="none" stroke="var(--warn)" stroke-width="2.4" rx="2"/>`);

}


/* ============ KATASTR ============
   Obrys zahrady z verejnych sluzeb CUZK, bez klice a bez registrace.

   1) adresa + PSC -> souradnice (Nominatim, ma importovana adresni mista z RUIAN)
   2) parcely v okoli            (inspire-cp-wfs, typenames cp:CadastralParcel)
   3) budovy v okoli             (inspire-CPX-wfs, typenames cp-ext:Building)

   Parcela, na ktere stoji budova, je zastavena plocha. Parcela bez budovy je
   zahrada nebo travni porost - a presne ta nas zajima. */
const CUZK_CP  = 'https://services.cuzk.cz/wfs/inspire-cp-wfs.asp';
const CUZK_CPX = 'https://services.cuzk.cz/wfs/inspire-CPX-wfs.asp';
const CRS84 = 'http://www.opengis.net/def/crs/EPSG/0/4326';
const CP_NS = 'http://inspire.ec.europa.eu/schemas/cp/4.0';
const CPX_NS = 'http://services.cuzk.cz/xsd/inspire/cp-ext/4.0';

/* V aplikaci jde pozadavek pres nativni most, ktery obchazi CORS. */
async function httpGet(url, accept) {
  if (window.KozaNative && typeof window.KozaNative.get === 'function') {
    const r = window.KozaNative.get(url, accept || '');
    if (r == null || r === '') throw new Error('prázdná odpověď');
    if (r.indexOf('KOZA_ERR:') === 0) throw new Error(r.slice(9));
    return r;
  }
  const res = await fetch(url, accept ? { headers: { 'Accept': accept } } : undefined);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}

async function geokoduj(dotaz) {
  const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cz&q='
    + encodeURIComponent(dotaz);
  const j = JSON.parse(await httpGet(u, 'application/json'));
  if (!j || !j.length) return null;
  return { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon), nazev: j[0].display_name };
}

/* Chyba je jen tehdy, kdyz je ExceptionReport korenem dokumentu. Sluzba totiz
   k platne odpovedi pripojuje truncatedResponse s ExceptionReport uvnitr. */
function chybaSluzby(xml) {
  if (!xml) return 'prázdná odpověď';
  let doc;
  try { doc = new DOMParser().parseFromString(xml, 'application/xml'); }
  catch (q) { return 'odpověď nejde přečíst'; }
  const root = doc.documentElement;
  if (!root || doc.querySelector('parsererror')) return 'odpověď nejde přečíst';
  if (root.localName !== 'ExceptionReport') return null;
  const t = root.getElementsByTagNameNS('*', 'ExceptionText');
  if (t.length) return (t[0].textContent || '').trim().slice(0, 200);
  return 'služba vrátila chybové hlášení';
}

/* Souradnice ze znacky: poradi os overujeme podle rozsahu CR */
function paryZTextu(txt) {
  const c = (txt || '').trim().split(/\s+/).map(Number);
  const out = [];
  for (let k = 0; k + 1 < c.length; k += 2) {
    const a = c[k], b = c[k+1];
    const ok = (a > 48 && a < 52 && b > 12 && b < 19);
    out.push(ok ? [a, b] : [b, a]);
  }
  return out;
}

/* Parcely: pole polygonu, kazdy { body:[[lat,lon]], cislo, vymera } */
function parsujParcely(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const cleny = doc.getElementsByTagNameNS('*', 'CadastralParcel');
  for (let i = 0; i < cleny.length; i++) {
    const el = cleny[i];
    const pl = el.getElementsByTagNameNS('*', 'posList');
    if (!pl.length) continue;
    const body = paryZTextu(pl[0].textContent);
    if (body.length < 4) continue;
    const lab = el.getElementsByTagNameNS('*', 'label');
    const ar = el.getElementsByTagNameNS('*', 'areaValue');
    out.push({
      body,
      cislo: lab.length ? (lab[0].textContent || '').trim() : '',
      vymera: ar.length ? parseFloat(ar[0].textContent) : null,
    });
  }
  return out;
}

/* Budovy: jen poloha symbolu a natoceni, pudorys sluzba nedava */
function parsujBudovy(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const cleny = doc.getElementsByTagNameNS('*', 'Building');
  for (let i = 0; i < cleny.length; i++) {
    const pos = cleny[i].getElementsByTagNameNS('*', 'pos');
    if (!pos.length) continue;
    const p = paryZTextu(pos[0].textContent);
    if (!p.length) continue;
    const rot = cleny[i].getElementsByTagNameNS('*', 'rotation');
    out.push({ lat: p[0][0], lon: p[0][1], uhel: rot.length ? parseFloat(rot[0].textContent) || 0 : 0 });
  }
  return out;
}

const vPolygonu = (lat, lon, body) => pointInPoly(lon, lat, body.map(q => [q[1], q[0]]));

/* Sousedni parcely sdili hranu, ale ne vzdy i lomovy bod. Proto meríme
   vzdalenost vrcholu jedne parcely od hran te druhe. */
function vzdalenostOdUsecky(p, a, b) {
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const L = dx*dx + dy*dy;
  const t = L ? Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy) / L)) : 0;
  return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy));
}
function sousedi(a, b, tol) {
  tol = tol || 1.0;
  const lat0 = a[0][0];
  const naM = (p) => [ (p[1]) * 111320 * Math.cos(lat0*Math.PI/180), p[0] * 110540 ];
  const A = a.map(naM), B = b.map(naM);
  for (const dvojice of [[A,B],[B,A]]) {
    const X = dvojice[0], Y = dvojice[1];
    for (const q of X) {
      for (let i = 0; i < Y.length; i++) {
        if (vzdalenostOdUsecky(q, Y[i], Y[(i+1) % Y.length]) < tol) return true;
      }
    }
  }
  return false;
}
/* 23/1 a 23/2 jsou dily tehoz puvodniho pozemku, obvykle jednoho vlastnika */
const kmenCisla = (c) => String(c || '').split('/')[0].trim();

/* Natoceni: najdeme smer, ve kterem ma parcela nejmensi opsany obdelnik,
   a postavime ji na vysku - na telefonu se tak vyuzije cela obrazovka. */
function hezkeNatoceni(body) {
  let nej = { uhel: 0, plocha: Infinity, w: 0, h: 0 };
  for (let i = 0; i < body.length; i++) {
    const a = body[i], b = body[(i+1) % body.length];
    const uhel = Math.atan2(b[1]-a[1], b[0]-a[0]);
    const ot = body.map(p => otoc(p, -uhel));
    const xs = ot.map(p=>p[0]), ys = ot.map(p=>p[1]);
    const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
    if (w*h < nej.plocha) nej = { uhel, plocha: w*h, w, h };
  }
  // naPlan otaci o +uhel, merili jsme o -uhel; na vysku = delsi strana svisle
  return nej.w > nej.h ? -nej.uhel + Math.PI/2 : -nej.uhel;
}
const otoc = (p, u) => [ p[0]*Math.cos(u) - p[1]*Math.sin(u), p[0]*Math.sin(u) + p[1]*Math.cos(u) ];

/* Prevod stupnu na metry kolem referencniho bodu, pak natoceni a posun do pocatku */
function naPlan(body, lat0, lon0, uhel) {
  const mLat = 110540, mLon = 111320 * Math.cos(lat0 * Math.PI / 180);
  let m = body.map(p => [ (p[1]-lon0)*mLon, -(p[0]-lat0)*mLat ]);
  if (uhel) m = m.map(p => otoc(p, uhel));
  return m;
}
function doPocatku(sada) {
  const vse = [].concat(...sada);
  const x0 = Math.min(...vse.map(p=>p[0])), y0 = Math.min(...vse.map(p=>p[1]));
  return sada.map(poly => poly.map(p => [
    Math.round((p[0]-x0)*10)/10, Math.round((p[1]-y0)*10)/10 ]));
}
function bezDuplicitnihoKonce(m) {
  if (m.length > 2) {
    const a = m[0], b = m[m.length-1];
    if (Math.abs(a[0]-b[0]) < 0.2 && Math.abs(a[1]-b[1]) < 0.2) m.pop();
  }
  return m;
}

let katStav = { stav:'idle', text:'' };

async function nactiParcelu(dotaz) {
  katStav = { stav:'hledam', text:'Hledám adresu…' };
  kresliMapu();
  const m = await geokoduj(dotaz);
  if (!m) {
    katStav = { stav:'chyba', text:'Adresu „' + dotaz + '" jsem nenašel. Zkus doplnit PSČ nebo obec.' };
    kresliMapu(); return;
  }

  katStav = { stav:'hledam', text:'Stahuji parcely z katastru…' };
  kresliMapu();
  // asi 90 x 90 m. Vetsi vyrez v zastavbe narazi na strop poctu parcel
  // a hledana zahrada se do odpovedi vubec nedostane.
  const d = 0.00042;
  const dLon = d / Math.cos(m.lat * Math.PI / 180);
  const bbox = [ m.lat-d, m.lon-dLon, m.lat+d, m.lon+dLon ].map(x=>x.toFixed(6)).join(',');
  const uP = CUZK_CP + '?service=WFS&version=2.0.0&request=GetFeature'
    + '&typenames=' + encodeURIComponent('cp:CadastralParcel')
    + '&namespaces=' + encodeURIComponent('xmlns(cp,' + CP_NS + ')')
    + '&count=60&srsName=' + encodeURIComponent(CRS84)
    + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
  const xmlP = await httpGet(uP, 'application/xml');
  const chyba = chybaSluzby(xmlP);
  if (chyba) { katStav = { stav:'chyba', text:'Katastr odmítl dotaz: ' + chyba }; kresliMapu(); return; }
  const parcely = parsujParcely(xmlP);
  if (!parcely.length) {
    katStav = { stav:'chyba', text:'Katastr tu nenašel parcely. Může jít o území bez digitální mapy.' };
    kresliMapu(); return;
  }

  // budovy jsou nepovinne: kdyz sluzba nedopovi, jedeme dal bez nich
  let budovy = [];
  try {
    const uB = CUZK_CPX + '?service=WFS&version=2.0.0&request=GetFeature'
      + '&typenames=' + encodeURIComponent('cp-ext:Building')
      + '&namespaces=' + encodeURIComponent('xmlns(cp-ext,' + CPX_NS + ')')
      + '&count=60&srsName=' + encodeURIComponent(CRS84)
      + '&BBOX=' + bbox + ',' + encodeURIComponent(CRS84);
    const xmlB = await httpGet(uB, 'application/xml');
    if (!chybaSluzby(xmlB)) budovy = parsujBudovy(xmlB);
  } catch (q) {}

  // ke kazde parcele poznamename, jestli na ni stoji budova
  parcely.forEach(p => {
    p.zastavena = budovy.some(b => vPolygonu(b.lat, b.lon, p.body));
    p.budovy = budovy.filter(b => vPolygonu(b.lat, b.lon, p.body));
  });

  const adresni = parcely.findIndex(p => vPolygonu(m.lat, m.lon, p.body));
  if (adresni < 0) {
    katStav = { stav:'chyba', text:'Adresu jsem našel, ale nepadla do žádné parcely. Zkus přesnější adresu.' };
    kresliMapu(); return;
  }

  // Sousedni parcela bez budovy muze byt zahrada, ale taky ulice nebo
  // verejna zelen. Rozhoduje kmen cisla: 23/2 patri k domu na 23/1.
  const adr = parcely[adresni];
  const adrKmen = kmenCisla(adr.cislo);
  parcely.forEach((q, i) => {
    q.sousedi = i === adresni || sousedi(q.body, adr.body);
    q.stejnyKmen = kmenCisla(q.cislo) === adrKmen;
  });
  const vybrane = new Set([adresni]);
  parcely.forEach((q, i) => {
    if (i === adresni || q.zastavena || !q.sousedi) return;
    if (q.stejnyKmen) vybrane.add(i);
  });
  // kdyz se podle cisla nic nenaslo, vezmeme jedinou rozumne velkou sousedni
  if (vybrane.size === 1) {
    const kand = parcely.map((q,i)=>({q,i}))
      .filter(o => o.i !== adresni && !o.q.zastavena && o.q.sousedi
                   && o.q.vymera && o.q.vymera <= Math.max(1200, (adr.vymera||300) * 4));
    if (kand.length === 1) vybrane.add(kand[0].i);
  }

  const nabidka = parcely.map((q,i) => ({ q, i }))
    .filter(o => o.i === adresni || (o.q.sousedi && (!o.q.vymera || o.q.vymera < 8000)))
    .sort((x,y) => (x.i === adresni ? -1 : y.i === adresni ? 1
      : (y.q.stejnyKmen - x.q.stejnyKmen) || ((x.q.vymera||0) - (y.q.vymera||0))));
  state.katParcely = nabidka.map(o => ({
    cislo: o.q.cislo, vymera: o.q.vymera, zastavena: o.q.zastavena,
    stejnyKmen: o.q.stejnyKmen, adresni: o.i === adresni,
    body: o.q.body, budovy: o.q.budovy, vybrana: vybrane.has(o.i),
  }));
  state.katStred = { lat: m.lat, lon: m.lon };
  state.katObec = (m.nazev || '').split(',').slice(0,3).join(',').trim();
  state.adresa = dotaz;
  postavZahradu();
  katStav = { stav:'vyber', text:'' };
  state.panelAdresa = false;
  save(); kresliMapu();
  requestAnimationFrame(() => fitView());
}

/* Z vybranych parcel postavi novou prazdnou zahradu: obrys, dum, zadne zahony */
function postavZahradu() {
  const vyb = (state.katParcely || []).filter(p => p.vybrana);
  if (!vyb.length) return;
  // uplne novy plan: nic z predchozi zahrady nezustava
  state.outline = []; state.outlineDone = false; state.vedlejsi = [];
  state.items = {}; state.nextId = 1;
  state.sel = null; state.selVert = null; state.tool = 'pan'; state.zamek = false;
  const s = state.katStred;

  // natoceni pocitame z nejvetsi vybrane parcely
  const hlavni = vyb.slice().sort((a,b) => plochaStupnu(b.body) - plochaStupnu(a.body))[0];
  const uhel = hezkeNatoceni(naPlan(hlavni.body, s.lat, s.lon, 0));

  const sada = vyb.map(p => naPlan(p.body, s.lat, s.lon, uhel));
  const budovyBody = [];
  vyb.forEach(p => (p.budovy || []).forEach(b => {
    budovyBody.push(naPlan([[b.lat, b.lon]], s.lat, s.lon, uhel)[0]);
  }));
  const vsechno = doPocatku(sada.concat(budovyBody.map(b => [b])));
  const obrysy = vsechno.slice(0, sada.length).map(bezDuplicitnihoKonce);
  const domy = vsechno.slice(sada.length).map(a => a[0]);

  // obrysem je nejvetsi parcela bez budovy, tedy zahrada. Zastavene az potom.
  const poradi = obrysy.map((o,i) => ({ o, z: !!vyb[i].zastavena, v: vyb[i].vymera }));
  poradi.sort((a,b) => (a.z === b.z) ? polyArea(b.o) - polyArea(a.o) : (a.z ? 1 : -1));
  // Kontrola rozmeru proti katastru. Plan je v metrech, takze priblizeni
  // s nim nehybe — tady jen overime, ze prepocet stupnu na metry nesedl vedle.
  const hl2 = srovnejVymeru(poradi[0].o, poradi[0].v);
  poradi[0].o = hl2.poly;
  state.katKontrola = { plocha: hl2.plocha, vymera: hl2.vymera, upraveno: hl2.upraveno };
  state.outline = poradi[0].o;
  state.outlineDone = true;
  state.vedlejsi = poradi.slice(1).map(q => srovnejVymeru(q.o, q.v).poly);

  // nova zahrada: zadne zahony, jen dum podle katastru
  state.items = {};
  state.nextId = 1;
  state.sel = null; state.selVert = null;
  domy.forEach((d, i) => {
    const x = Math.max(0, Math.round(d[0]) - 3), y = Math.max(0, Math.round(d[1]) - 3);
    const id = 'p' + state.nextId++;
    state.items[id] = { id, typ:'house', cells: rectKeys(x, y, x+7, y+7),
      nazev: domy.length > 1 ? 'Dům ' + (i+1) : 'Dům',
      cropId:null, datumVysadby:'', poznamka:'', fotky:[], hnojeni:[], zalivka:[], rostliny:null };
  });
}
/* Katastr u kazde parcely uvadi vymeru v m². Kdyz nase geometrie vyjde jinak
   nez o par promile, prepocet stupnu na metry se nekde rozesel — polygon
   proto nafoukneme nebo zmensime kolem jeho stredu, aby plocha sedela.
   Tvar ani pomer stran se tim nemeni. */
function srovnejVymeru(poly, vymera) {
  const plocha = polyArea(poly);
  if (!vymera || !plocha || poly.length < 3) return { poly, plocha, vymera, upraveno:false };
  const pomer = vymera / plocha;
  if (!isFinite(pomer) || pomer <= 0 || Math.abs(pomer - 1) <= 0.02) {
    return { poly, plocha, vymera, upraveno:false };
  }
  if (pomer < 0.5 || pomer > 2) return { poly, plocha, vymera, upraveno:false };
  const k = Math.sqrt(pomer);
  const cx = poly.reduce((a,q) => a + q[0], 0) / poly.length;
  const cy = poly.reduce((a,q) => a + q[1], 0) / poly.length;
  const np = poly.map(q => [ cx + (q[0]-cx)*k, cy + (q[1]-cy)*k ]);
  return { poly: np, plocha: polyArea(np), vymera, upraveno:true };
}
function plochaStupnu(body) {
  let s = 0;
  for (let i = 0; i < body.length; i++) {
    const a = body[i], b = body[(i+1) % body.length];
    s += a[0]*b[1] - b[0]*a[1];
  }
  return Math.abs(s)/2;
}

function nactiObrys() {
  const a = (el('addr-input').value || '').trim();

}

}

const MESICE_KR2 = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];

function dialogRady(id) {
  const vse = vsechnyRady();
  const r = id ? vse.find(x => x.id === id) : { id:'', nadpis:'', text:'', mesice:[], skupina:'Moje rady', vlastni:true };
  if (!r) return;
  let mes = (r.mesice || []).slice();
  const kresli = () => {
    const d = dialog(`<h2>${id ? 'Rada' : 'Nová rada'}</h2>
      <div class="field"><label for="r-n">Nadpis</label><input id="r-n" value="${esc(r.nadpis)}" placeholder="Třeba: Na jahody dát slámu"></div>
      <div class="field"><label for="r-t">Text</label><textarea id="r-t" style="min-height:140px" placeholder="Co přesně dělat a proč">${esc(r.text)}</textarea></div>
      <div class="field"><label>Kdy radit</label>
        <div class="chips" style="flex-wrap:wrap">
          ${MESICE.map((nm,i)=>`<button class="chip ${mes.includes(i+1)?'on':''}" data-rm="${i+1}">${esc(MESICE_KR2[i])}</button>`).join('')}
        </div>
        <p class="note" style="margin-top:8px">Bez vybraného měsíce je to obecná zásada — najdeš ji tady v Nastavení, ale na Dnešek nevyskočí.</p>
      </div>
      ${id ? `<button class="btn sm sec wide" id="r-zap" style="margin-bottom:14px">${r.zap===false?'Zapnout radu':'Vypnout radu'}</button>` : ''}
      <div class="dacts">
        ${id && r.vlastni ? `<button class="btn sec" id="r-del" style="color:var(--danger)">Smazat</button>` : ''}
        ${id && !r.vlastni ? `<button class="btn sec" id="r-zpet">Výchozí text</button>` : ''}
        <button class="btn" id="r-ok">Uložit</button>
      </div>`);
    d.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      const m = Number(b.dataset.rm);
      const i = mes.indexOf(m);
      if (i >= 0) mes.splice(i,1); else mes.push(m);
      r.nadpis = d.querySelector('#r-n').value; r.text = d.querySelector('#r-t').value;
      kresli();
    });
    const z = d.querySelector('#r-zap');
    if (z) z.onclick = () => {
      ulozRadu(r, d.querySelector('#r-n').value, d.querySelector('#r-t').value, mes, r.zap === false);
      zavri(); kresliNastaveni(); kresliDnes();
    };
    const zp = d.querySelector('#r-zpet');
    if (zp) zp.onclick = () => {
      if (state.radyEdit) delete state.radyEdit[r.id];
      save(); zavri(); kresliNastaveni(); toast('Vrácen výchozí text');
    };
    const dl = d.querySelector('#r-del');
    if (dl) dl.onclick = () => {
      state.vlastniRady = (state.vlastniRady || []).filter(x => x.id !== r.id);
      save(); zavri(); kresliNastaveni(); kresliDnes();
    };
    d.querySelector('#r-ok').onclick = () => {
      const nd = d.querySelector('#r-n').value.trim(), tx = d.querySelector('#r-t').value.trim();
      if (!nd) { toast('Napiš nadpis'); return; }
      ulozRadu(r, nd, tx, mes, r.zap !== false);
      zavri(); kresliNastaveni(); kresliDnes(); toast('Uloženo');
    };
  };
  kresli();
}
function ulozRadu(r, nadpis, text, mesice, zap) {
  if (r.vlastni) {
    state.vlastniRady = state.vlastniRady || [];
    const i = state.vlastniRady.findIndex(x => x.id === r.id);
    const obj = { id: r.id || ('vr' + Date.now()), nadpis, text, mesice: mesice.slice().sort((a,b)=>a-b), zap };
    if (i >= 0) state.vlastniRady[i] = obj; else state.vlastniRady.push(obj);
  } else {
    state.radyEdit = state.radyEdit || {};
    state.radyEdit[r.id] = { nadpis, text, mesice: mesice.slice().sort((a,b)=>a-b), zap };
  }
  save();
}

function exportZalohy() {
  try {
    const data = JSON.stringify(state);
    const a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
    a.download = 'koza-zahradnik-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Záloha uložena');
  } catch (e) { toast('Zálohu se nepodařilo uložit'); }
}
function importZalohy() {
  let inp = el('inp-zal');
  if (!inp) {
    inp = document.createElement('input');
    inp.type='file'; inp.accept='application/json,.json'; inp.id='inp-zal'; inp.hidden=true;
    document.body.appendChild(inp);
    inp.onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value='';
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const p = JSON.parse(r.result);
          if (!p || typeof p !== 'object') throw 0;
          localStorage.setItem('zahradka-v2', JSON.stringify(p));
          location.reload();
        } catch (err) { toast('Tohle není záloha Kozy Zahradníka'); }
      };
      r.readAsText(f);
    };
  }
  inp.click();
}

/* ============ OBRAZOVKA: DNES ============
   Domovská obrazovka odpovídá na jedinou otázku: co mám dneska udělat.
   Úkoly nevznikají ručně — appka je odvodí z plodin, počasí a zápisů,
   a odškrtnutí rovnou zapíše zálivku, hnojení nebo sklizeň. */
function ukolyDnes() {
  const out = [];
  beds().forEach(b => {
    const k = dalsiKrok(b);
    if (!k.akce || k.akce === 'edit') return;
    out.push({ b, k });
  });
  const vaha = { sklid:0, zalij:1, dosad:2, hnoj:3 };
  out.sort((x,y) => (vaha[x.k.akce] ?? 9) - (vaha[y.k.akce] ?? 9));
  return out;
}

  el('d-pocasi').onclick = () => otevriPocasi();
  s.querySelectorAll('[data-crop]').forEach(b => b.onclick = () => dialogPlodiny(b.dataset.crop));
  s.querySelectorAll('[data-radu]').forEach(b => b.onclick = () => dialogRady(b.dataset.radu));
  s.querySelectorAll('[data-hotovo]').forEach(b => b.onclick = () => {
    const [id, akce] = b.dataset.hotovo.split('|');
    if (akce === 'zalij') { quickWater(id); kresliDnes(); }
    else if (akce === 'hnoj') { quickFert(id); kresliDnes(); }
    else if (akce === 'sklid') dialogSklizne(id, () => kresliDnes());
    else if (akce === 'dosad') dialogPorostu(id, 'dosadba');
  });
}
function pozdrav() {
  const hod = new Date().getHours();
  if (hod < 10) return 'Dobré ráno';
  if (hod < 18) return 'Dobrý den';
  return 'Dobrý večer';
}

function kresliMapu() {
  const s = el('s-map');
  const vyb = state.sel ? state.items[state.sel] : null;
  if (state.sel && !vyb) state.sel = null;
  const prazdno = !state.outline.length && !items().length;
  const nacitam = katStav.stav === 'hledam';
  const rezim = state.tool !== 'pan' ? RADY[state.tool] : null;
  const vyberParcel = katStav.stav === 'vyber' && state.katParcely;
  /* Adresu nabízíme jen dokud není zahrada. Potom už jen malým tlačítkem v liště. */
  const nabidniAdresu = !state.panel && !rezim && !state.outline.length && !items().length;

  s.innerHTML = `
    <div class="map">
      <div id="cv"><svg id="svg" aria-label="Plán zahrady"></svg></div>

      ${prazdno && !state.panel ? `<div class="empty" style="position:absolute;inset:0;display:grid;place-content:center;z-index:2">
        <div class="ei">${ik('mapa')}</div>
        <h3>Zatím prázdná zahrada</h3>
        <p>Načti svou parcelu z katastru podle adresy,<br>nebo si obrys nakresli sám.</p>
      </div>` : ''}

      ${nacitam ? `<div class="m-load"><div class="spin"></div><span>${esc(katStav.text)}</span></div>` : ''}

      ${rezim ? `<div class="m-mode">
        <span class="mi">${state.tool === 'outline' ? ik('obrys') : (state.tool === 'erase' ? ik('guma') : `<span class="emo">${PRVKY[state.tool].emoji}</span>`)}</span>
        <span class="mt"><b>${esc(rezim.t)}</b><span>${esc(rezim.s)}</span></span>
        <button id="m-hotovo">Hotovo</button>
      </div>` : ''}

      ${nabidniAdresu ? `<button class="m-search plain" id="otevri-adresu">
        <span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="10.5" r="3"/><path d="M12 21s7-5.6 7-10.5a7 7 0 1 0-14 0C5 15.4 12 21 12 21z"/></svg></span>
        <span class="st">Najít mou parcelu podle adresy</span>
        <span class="sx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>` : ''}

      ${state.panel ? panelAdresy() : ''}

      <div class="m-zoom" id="m-zoom">
        <button id="z-in" aria-label="Přiblížit" title="Přiblížit">${ik('plus')}</button>
        <button id="z-out" aria-label="Oddálit" title="Oddálit">${S('<path d="M5 12h14"/>')}</button>
        <button id="z-fit" aria-label="Celá zahrada" title="Celá zahrada">${S('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>')}</button>
      </div>

      <div class="m-scale" id="m-scale"><span class="b" id="sc-b"></span><span id="sc-t">5 m</span></div>

      ${vyberParcel || vyb || (state.tool === 'outline' && state.outline.length) ? `<div class="msheet" id="msheet">
        ${vyberParcel ? `
          <h3>Co patří k zahradě</h3>
          <div class="parcels">
            ${state.katParcely.map((q,i)=>`<button class="parcel ${q.vybrana?'on':''}" data-parcela="${i}">
              <span class="pn">${esc(q.cislo || '—')}</span>

          </div>
          <p class="note">${esc(state.katObec || '')} · klepnutím přidáš nebo odebereš${kontrolaText()}</p>

        ${vyb ? (roste(vyb) ? `

            <b>${esc(vyb.nazev)}</b>

        <button id="t-adresa" aria-label="Najít parcelu podle adresy" title="Adresa">${ik('adresa')}</button>
        <button class="${state.zamek?'on':''}" id="z-zamek" aria-label="${state.zamek?'Odemknout zahradu':'Zamknout zahradu'}" title="${state.zamek?'Odemknout':'Zamknout'}">${ik(state.zamek?'zamek':'odemek')}</button>
      </div>
    </div>
  `;

  const oa = el('otevri-adresu');
  if (oa) oa.onclick = () => { state.panel = true; save(); kresliMapu(); };
  if (state.panel) napojPanel();

  const nastav = (t) => {
    if (state.zamek && t !== 'pan') { dialogZamek(); return; }
    if (state.tool === t && t !== 'pan') t = 'pan';
    state.tool = t;
    if (t !== 'outline') state.selVert = null;
    if (t !== 'pan') state.sel = null;
    save(); kresliMapu();
  };
  s.querySelectorAll('[data-nastroj]').forEach(b => b.onclick = () => nastav(b.dataset.nastroj));
  el('z-zamek').onclick = () => {
    if (!state.zamek) {
      state.zamek = true; state.tool = 'pan'; state.selVert = null;
      save(); kresliMapu(); toast('Zahrada zamčená — plán se nedá měnit');
    } else dialogZamek();
  };
  el('t-adresa').onclick = () => { state.panel = true; state.tool = 'pan'; save(); kresliMapu(); };
  const mh = el('m-hotovo'); if (mh) mh.onclick = () => nastav('pan');

  s.querySelectorAll('[data-parcela]').forEach(b => b.onclick = () => prepniParcelu(Number(b.dataset.parcela)));
  const ko = el('kat-ok');
  if (ko) ko.onclick = () => { katStav = { stav:'ok', text:'' }; save(); kresliMapu(); requestAnimationFrame(() => fitView()); };

  if (vyb && roste(vyb)) {
    napojZahonky(el('msheet'));
    el('v-upravit').onclick = () => dialogPrvku(vyb.id);
    el('v-off').onclick = () => { state.sel = null; save(); kresliMapu(); };
  } else if (vyb) {
    el('v-edit').onclick = () => dialogPrvku(vyb.id);
    el('v-off').onclick = () => { state.sel = null; save(); kresliMapu(); };
    el('v-zamek').onclick = () => {
      vyb.zamek = !vyb.zamek; save(); kresliMapu();
      toast(vyb.zamek ? esc(vyb.nazev) + ' zamčený' : esc(vyb.nazev) + ' odemčený');
    };
  }
  const oc = el('o-close'); if (oc) oc.onclick = () => { state.outlineDone = true; save(); kresliMapu(); toast('Obrys uzavřen'); };
  const od = el('o-del'); if (od) od.onclick = () => { state.outline.splice(state.selVert,1); state.selVert = null; save(); kresliMapu(); };
  const ou = el('o-undo'); if (ou) ou.onclick = () => {
    state.outline.pop(); state.selVert = null;
    if (state.outline.length < 3) state.outlineDone = false;
    save(); kresliMapu();
  };

  el('z-in').onclick  = () => { const r = cvRect(); zoomAt(1.3, r.width/2, r.height/2); };
  el('z-out').onclick = () => { const r = cvRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
  el('z-fit').onclick = () => fitView();

  napojPlatno();
  posadPanel();
  requestAnimationFrame(() => { posadPanel(); kresliPlatno(); });
}
